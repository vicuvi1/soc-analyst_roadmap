<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Analyst in 12 Weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: top bar, 940px column. dark navy hero panel anchors each page; work happens in a numbered step rail */
  --bg:#edf0f3; --surface:#ffffff; --ink:#14202b; --muted:#566777; --line:#d4dbe2;
  --accent:#0a6c8f; --accent-ink:#ffffff; --tint:#e2eff4;
  --hero:#0e2a3b; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
  --good:#1b7548; --warn:#955600; --bad:#b3261e; --code:#f3f6f8;
  --g0:#e4e8ec; --g1:#f2e2a4; --g2:#e6c45c; --g3:#d4a017; --g4:#a67c00;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,32,44,.06),0 4px 14px rgba(16,32,44,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1217; --surface:#151e26; --ink:#e4ebf1; --muted:#95a5b5; --line:#293541;
    --accent:#5bbbdd; --accent-ink:#06222d; --tint:#17303c;
    --hero:#12303f; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
    --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#0f181f; --shadow:none; color-scheme:dark;
    --g0:#1e2933; --g1:#4a3b10; --g2:#806518; --g3:#bd931c; --g4:#f2c230;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1217; --surface:#151e26; --ink:#e4ebf1; --muted:#95a5b5; --line:#293541;
  --accent:#5bbbdd; --accent-ink:#06222d; --tint:#17303c;
  --hero:#12303f; --hero-ink:#eaf3f7; --hero-muted:#9dbccb; --hero-accent:#6cc8ea;
  --good:#5fc391; --warn:#e2a650; --bad:#f28b84; --code:#0f181f; --shadow:none; color-scheme:dark;
    --g0:#1e2933; --g1:#4a3b10; --g2:#806518; --g3:#bd931c; --g4:#f2c230;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
h4{font:600 .78rem/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:1.3em 0 .45em}
p{margin:.5em 0} ul{margin:.4em 0;padding-left:1.2em} li{margin:.25em 0}
code,pre{font-family:var(--mono);font-size:.84rem}
code{background:var(--code);padding:.08em .3em;border-radius:3px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:.6em 0;line-height:1.5;white-space:pre}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1060px;margin:0 auto;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font:600 1.05rem var(--display);letter-spacing:.02em;margin-right:auto;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:9px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:6px 9px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{background:var(--tint);color:var(--accent)}
.badge{display:inline-block;min-width:1.4em;padding:0 .4em;margin-left:5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:.75rem;text-align:center;font-weight:600}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--good)} .sync.local i{background:var(--warn)}

main{max-width:980px;margin:0 auto;padding:24px 20px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.card>h2{margin-bottom:10px}
.eyebrow{font:500 .78rem var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.lead{color:var(--muted);max-width:65ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.hero{background:var(--hero) linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/100% 28px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(120% 140% at 100% 0,rgba(108,200,234,.18),transparent 55%);background-size:28px 28px,28px 28px,100% 100%;color:var(--hero-ink);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--shadow)}
.hero .eyebrow{color:var(--hero-accent)} .hero .eyebrow a{color:inherit}
.hero h1{margin:6px 0 8px}
.hero p{color:var(--hero-muted);max-width:58ch;margin:0}
.hero .row{margin-top:16px}
.hero .btn{background:var(--hero-accent);color:#06222d}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.28)}
.hero input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 8px;color:var(--hero-ink);color-scheme:dark}
.hero .sched{font-size:.9rem;color:var(--hero-muted)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .t{stroke:rgba(255,255,255,.14)} .ring .v{stroke:var(--hero-accent);stroke-linecap:round}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 1.9rem var(--display);font-variant-numeric:tabular-nums}
.ring small{font:400 .72rem var(--body);color:var(--hero-muted)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pip{font:500 .72rem var(--mono);padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.25);color:var(--hero-muted);text-transform:uppercase;letter-spacing:.04em}
.pip.on{background:var(--hero-accent);border-color:var(--hero-accent);color:#06222d}
.pip.now{border-color:var(--hero-accent);color:var(--hero-accent)}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:22px}.ring{width:96px;height:96px}h1{font-size:1.8rem}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.due b{color:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font:500 .7rem var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.good{color:var(--good);border-color:var(--good)} .chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.bad{color:var(--bad);border-color:var(--bad)} .chip.acc{color:var(--accent);border-color:var(--accent)}
.chip.fill{background:var(--tint);border-color:transparent;color:var(--accent)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px;flex:1}
.meter i{display:block;height:100%;background:var(--accent)}
.next{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.next li{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin:0}
.next li b{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font:600 .85rem var(--mono)}
.next li:first-child{border-color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.strip a{display:block;text-align:center;padding:9px 0;border-radius:7px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font:500 .85rem var(--mono);position:relative;overflow:hidden}
.strip a i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.strip a.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .strip a.done{background:var(--tint);color:var(--accent)}
.strip a.lock{opacity:.45}
@media(max-width:560px){.strip{grid-template-columns:repeat(6,1fr)}.next li{grid-template-columns:28px 1fr}.next li .btn{grid-column:2;justify-self:start}}

/* roadmap */
.path{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 0}
.path a{flex:1;min-width:120px;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:.85rem}
.path a b{display:block;font:600 .95rem var(--display)} .path a small{color:var(--muted)}
.path a.done{border-color:var(--good)} .path a.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)} .path a.lock{opacity:.55}
.path span{flex:none;width:18px;height:2px;background:var(--line)}
.tl{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:34px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .node{position:relative}
.tl .node::before{content:"";position:absolute;left:-29px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .node.done::before{background:var(--good);border-color:var(--good)}
.tl .node.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.tl .stagehead{margin:14px 0 2px}
.tl .stagehead::before{left:-34px;top:6px;width:22px;height:22px;border-radius:6px;background:var(--hero);border:0;content:attr(data-n);color:var(--hero-ink);font:600 .8rem var(--mono);display:grid;place-items:center}
.stage-locked .wk{opacity:.55}
.wk{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.wk:hover{border-color:var(--accent)}
.wk small{color:var(--muted);display:block}
.wk.exam{border-style:dashed;box-shadow:none}
.wk .side{display:flex;gap:10px;align-items:center}
.mini{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.mini i{font:500 .66rem var(--mono);font-style:normal;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mini i.on{background:var(--tint);border-color:transparent;color:var(--accent)}
@media(max-width:560px){.wk{grid-template-columns:1fr}}

/* week steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:40px 1fr;gap:14px;margin:0;position:relative}
.step::before{content:"";position:absolute;left:19px;top:44px;bottom:-12px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step>.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 1rem var(--mono);background:var(--surface);border:2px solid var(--line);color:var(--muted);z-index:1;margin-top:8px}
.step.cur>.dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.step.done>.dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.done::before{background:var(--good)}
.step>details{scroll-margin-top:70px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.step.cur>details{border-color:var(--accent)}
.step>details>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.step>details>summary::-webkit-details-marker{display:none}
.step>details>summary h2{font-size:1.2rem}
.step>details>summary small{color:var(--muted);display:block;font-size:.85rem}
.step>details>summary .caret{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 8px}
.step>details[open]>summary .caret{transform:rotate(-135deg);margin-bottom:-4px}
.step .body{padding:2px 18px 18px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:560px){.step{grid-template-columns:30px 1fr;gap:10px}.step>.dot{width:30px;height:30px;font-size:.85rem}.step::before{left:14px;top:38px}}

.tasks,.reslist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tasks label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.tasks input,.reslist input,.selfc input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.tasks .done{color:var(--muted);text-decoration:line-through}
.reslist li{display:grid;grid-template-columns:22px 34px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:0}
.reslist li.core{border-left:3px solid var(--accent)}
.reslist a{font-weight:500;text-decoration:none;overflow-wrap:anywhere} .reslist a:hover{text-decoration:underline}
.reslist small{display:block;color:var(--muted)}
.reslist li.seen a{color:var(--muted)}
.ico{width:34px;height:34px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:560px){.reslist li{grid-template-columns:22px 1fr}.ico{display:none}.meta{grid-column:2;justify-content:flex-start}.tasks label{grid-template-columns:22px 1fr}.tasks label .chip{grid-column:2;justify-self:start}}
.selfc{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 14px;border:1px dashed var(--accent);border-radius:8px;cursor:pointer;margin-top:14px;background:var(--tint)}
.tasks .modhead{font:600 .76rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;padding:0}
.tasks a{font-weight:500;text-decoration:none} .tasks a:hover{text-decoration:underline}
.tasks .done a{color:var(--muted)}
.today-rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.today-rooms li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--g3);border-radius:9px;margin:0}
.today-rooms small{display:block;color:var(--muted)}
.note{border-left:3px solid var(--accent);background:var(--tint);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.95rem}
.lesson{max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.why{font-size:.95rem;color:var(--muted);margin:8px 0 14px}
.qtext{font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.cq{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.cq .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cq input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:.9rem}
.cq.ok input{border-color:var(--good)} .cq.no input{border-color:var(--bad)}
.hint{font-size:.8rem;color:var(--muted)}
.ev{position:relative}
.ev .btn{position:absolute;top:8px;right:8px;background:var(--surface)}
.ev pre{padding-top:42px;max-height:420px;overflow:auto}
.timer{position:sticky;top:58px;z-index:4;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.eq{padding:16px 0;border-top:1px solid var(--line)}
.eq label{display:flex;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:flex-start;overflow-wrap:anywhere}
.eq label:hover{background:var(--tint)}
.eq input{margin-top:5px;accent-color:var(--accent)}
.eq .r{color:var(--good);font-weight:600} .eq .w{color:var(--bad);text-decoration:line-through}
.big{font:600 3rem var(--display);font-variant-numeric:tabular-nums;margin:0}
.boxes{display:flex;gap:8px;align-items:flex-end;height:96px}
.boxes div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font:500 .75rem var(--mono);color:var(--muted);height:100%;text-align:center}
.boxes i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.lib h3{margin:18px 0 8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main.wide{max-width:1200px}
.wkgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.aside{display:none}
@media(min-width:1060px){.wkgrid{grid-template-columns:minmax(0,1fr) 260px;align-items:start}.aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:74px}}
.snav{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:4px}
.snav li{margin:0}
.snav button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 8px;cursor:pointer}
.snav button:hover{background:var(--tint)}
.snav b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:600 .75rem var(--mono);color:var(--muted)}
.snav .done b{background:var(--good);border-color:var(--good);color:var(--surface)}
.snav .cur b{border-color:var(--accent);color:var(--accent)} .snav .cur button{border-color:var(--line)}
.snav small{display:block;color:var(--muted);font-size:.78rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;margin-top:8px} .kv span{color:var(--muted)} .kv b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}}
.ivq{display:flex;flex-direction:column;gap:6px}
.ivq details{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ivq summary{cursor:pointer;font-weight:500}
.ivq p{color:var(--muted);margin:.6em 0 .2em;max-width:68ch}
.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 20px}
@media(min-width:900px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sheet>div{min-width:0}
.themebtn{background:none;border:1px solid var(--line);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.themebtn svg{width:16px;height:16px}

<body>
<div class="bar"><div class="bar-in">
  <a class="brand" href="#today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round"/></svg>SOC Analyst <span>in 12 Weeks</span></a>
  <nav id="nav"></nav>
  <button class="timerbtn" id="timerBtn" data-act="timer">Start session</button>
  <button class="themebtn" data-act="theme" aria-label="Switch between light and dark theme" title="Light or dark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <div class="sync" id="sync"><i></i><span>Saved in this browser</span></div>
</div></div>
<main id="view"></main>
<script id="seed" type="application/json">null</script>
<script src="thm.js"></script>
<script>
try { const t = localStorage.getItem('soc12-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
const D = /*DATA*/null;
const DAY = 864e5, IV = [0, 1, 3, 7, 14, 30], KEY = 'soc12-state-v1', PASS = 0.8, QPASS = 0.7, COOLDOWN = 12 * 36e5;
const TYPE = { thm: 'TryHackMe', room: 'TryHackMe room', pwn: 'pwn.college', own: 'Own work' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
function hash(str) { let h1 = 0xdeadbeef ^ 77, h2 = 0x41c6ce57 ^ 77; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

/* question registry */
const Q = {};
D.weeks.forEach((w, wi) => w.quiz.forEach((q, qi) => Q['w' + (wi + 1) + 'q' + (qi + 1)] = Object.assign({ week: wi + 1 }, q)));
D.stages.forEach((s, si) => s.extra.forEach((q, qi) => Q['s' + (si + 1) + 'x' + (qi + 1)] = Object.assign({ stage: si + 1 }, q)));
const weekQids = w => D.weeks[w - 1].quiz.map((_, i) => 'w' + w + 'q' + (i + 1));

/* state */
const fresh = () => ({ v: 2, updatedAt: 0, start: null, tasks: {}, res: {}, rec: {}, act: {}, rooms: {}, thm: null, skill: {}, rv: [], drill: {}, bank: {}, rep: {}, iv: {}, log: {}, time: {}, timer: null, plan: null, cal: {}, todo: {}, sim: [], q: {}, wq: {}, ch: {}, ex: {} });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
try { const seed = JSON.parse(document.getElementById('seed').textContent); if (seed && (seed.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(fresh(), seed); localStorage.setItem(KEY, JSON.stringify(S)); } } catch (e) {}
/* TryHackMe sync: newest of built-in snapshot, thm.js written by the launcher, and saved state */
let THMSET = new Set();
function adoptThm(t) { if (t && Array.isArray(t.codes) && (t.at || 0) > ((S.thm && S.thm.at) || 0)) { S.thm = { user: t.user || 'vicuvi1', at: t.at, codes: [...new Set([...(S.thm ? S.thm.codes : []), ...t.codes.map(String)])] }; return true; } return false; }
function refreshThm() { THMSET = new Set(S.thm ? S.thm.codes : []); }
{ const a = adoptThm(D.thm), b = adoptThm(window.THM_SYNC); if (a || b) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} } refreshThm(); }
const roomDone = c => THMSET.has(c) || !!S.rooms[c];
const taskOn = (w, i) => { const t = D.weeks[w - 1].tasks[i]; return t[3] ? roomDone(t[3]) : !!S.tasks[w + '-' + i]; };
const roomUrl = c => 'https://tryhackme.com/room/' + c + '?pathCode=soclevel1';
const pathRooms = () => D.weeks.flatMap((W, wi) => W.tasks.map((t, i) => ({ w: wi + 1, i, t })).filter(x => x.t[0] === 'room' && x.t[4] !== 'Extra room'));
/* live updates: the launcher's background sync rewrites thm.js; the page re-reads it every minute and on focus */
let LIVE = { ok: false, at: 0, checked: 0, news: [] }, CLOUD = { at: 0 }, pendingRender = false;
const roomTitle = c => { for (const W of D.weeks) for (const t of W.tasks) if (t[3] === c) return t[1]; return null; };
function liveRender() {
  const el = document.activeElement, typing = el && /INPUT|TEXTAREA/.test(el.tagName) && el.type !== 'checkbox' && el.type !== 'radio' && el.value;
  if (QS || ES || (SIM && !SIM.result) || typing) { pendingRender = true; return; }
  pendingRender = false; const y = window.scrollY; render(); window.scrollTo(0, y);
}
function pollThm() {
  const s = document.createElement('script'); s.src = 'thm.js?t=' + Date.now();
  s.onload = () => { s.remove(); const t = window.THM_SYNC, before = new Set(THMSET), was = LIVE.ok;
    LIVE.checked = Date.now(); LIVE.at = (t && t.at) || 0; LIVE.ok = !!t && Date.now() - LIVE.at < 6 * 6e4;
    if (adoptThm(t)) { refreshThm(); const fresh = [...THMSET].filter(c => !before.has(c) && roomTitle(c));
      if (fresh.length) { bump(3 * fresh.length); logDay('r', fresh.length); LIVE.news = fresh.map(roomTitle); }
      save(); liveRender(); }
    else if (pendingRender || was !== LIVE.ok || route().name === 'today') liveRender(); };
  s.onerror = () => { s.remove(); const was = LIVE.ok; LIVE.ok = false; LIVE.checked = Date.now(); if (was) liveRender(); };
  document.head.appendChild(s);
}
let remote = null, writing = false, dirty = false, saveTimer = null;
function setSync(mode) { const el = $('#sync'); el.className = 'sync ' + mode; el.lastElementChild.textContent = mode === 'cloud' ? 'Progress saved to your account' : 'Progress saved in this browser'; }
function save() {
  S.updatedAt = Date.now();
  try { snapSkills(); } catch (e) {}
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (remote) { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1200); }
}
async function pushRemote() {
  if (!remote || writing || !dirty) return;
  writing = true; dirty = false;
  try { await remote.set({ json: JSON.stringify(S), updatedAt: S.updatedAt }); setSync('cloud'); }
  catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { remote = null; setSync('local'); } else dirty = true; }
  writing = false;
  if (dirty && remote) { clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 3000); }
}
async function initRemote() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
    remote = ref;
    if (snap && snap.exists) {
      const body = snap.data();
      let R = null; try { R = JSON.parse(body.json); } catch (e) {}
      if (R && (R.updatedAt || 0) > (S.updatedAt || 0)) {
        S = Object.assign(fresh(), R); afterStateSwap();
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        if (!ES && !QS) render();
      } else if ((S.updatedAt || 0) > ((R && R.updatedAt) || 0)) { dirty = true; pushRemote(); }
    } else if (S.updatedAt) { dirty = true; pushRemote(); }
    setSync('cloud');
    try { db.doc('sync/thm').onSnapshot(snap => { if (!snap.exists) return; const t = snap.data(); if (!t || !Array.isArray(t.codes)) return; CLOUD.at = t.at || 0;
      const before = new Set(THMSET); if (adoptThm({ user: t.user, at: t.at, codes: t.codes })) { refreshThm(); const fr = [...THMSET].filter(c => !before.has(c) && roomTitle(c)); if (fr.length) { bump(3 * fr.length); logDay('r', fr.length); LIVE.news = fr.map(roomTitle); } save(); }
      liveRender(); }, () => {}); } catch (e) {}
  } catch (e) { setSync('local'); }
}

/* derived */
const STEPS = ['Learn', 'Labs', 'Recap', 'Quiz', 'Challenge'];
const stageOf = w => Math.floor((w - 1) / 3) + 1;
const unlocked = st => st === 1 || !!(S.ex[st - 1] && S.ex[st - 1].passed);
const tasksDone = w => D.weeks[w - 1].tasks.filter((_, i) => taskOn(w, i)).length;
const coreIdx = w => D.weeks[w - 1].res.map((r, i) => r[5] ? i : -1).filter(i => i >= 0);
const coreDone = w => coreIdx(w).filter(i => S.res[w + '-' + i]).length;
const quizPassed = w => !!(S.wq[w] && S.wq[w].best >= QPASS);
const chalSolved = w => { const c = S.ch[w]; return c ? c.ok.filter(Boolean).length : 0; };
const chalDone = w => chalSolved(w) === D.weeks[w - 1].chal.qs.length;
function stepState(w) { const W = D.weeks[w - 1]; return [coreDone(w) === coreIdx(w).length, tasksDone(w) === W.tasks.length, !!S.rec[w], quizPassed(w), chalDone(w)]; }
const curStep = w => { const i = stepState(w).indexOf(false); return i < 0 ? 5 : i; };
function weekPct(w) { const W = D.weeks[w - 1]; return Math.round(100 * (0.10 * coreDone(w) / coreIdx(w).length + 0.40 * tasksDone(w) / W.tasks.length + 0.05 * (S.rec[w] ? 1 : 0) + 0.20 * (quizPassed(w) ? 1 : 0) + 0.25 * chalSolved(w) / W.chal.qs.length)); }
const weekDone = w => stepState(w).every(Boolean);
const hours = w => D.weeks[w - 1].tasks.reduce((a, t) => a + t[2], 0);
const coreMins = w => coreIdx(w).reduce((a, i) => a + D.weeks[w - 1].res[i][4], 0);
const dueIds = () => { const now = Date.now(); return Object.keys(S.q).filter(id => Q[id] && S.q[id].d <= now).sort((a, b) => S.q[a].d - S.q[b].d); };
function workingWeek() { for (let w = 1; w <= 12; w++) if (!weekDone(w)) return w; return 12; }
function planWeek() { if (!S.start) return null; return Math.max(1, Math.min(12, Math.floor((Date.now() - S.start) / (7 * DAY)) + 1)); }
const allDone = () => !!(S.ex[4] && S.ex[4].passed) && chalDone(12);
const overallPct = () => Math.round(D.weeks.reduce((a, _, i) => a + weekPct(i + 1), 0) / 12 * 0.8 + [1, 2, 3, 4].filter(s => S.ex[s] && S.ex[s].passed).length / 4 * 20);

/* study activity */
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function bump(n) { const k = dkey(new Date()); S.act[k] = (S.act[k] || 0) + (n || 1); }
const level = n => !n ? 0 : n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4;
function calendarHtml() {
  const WEEKS = 26, today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - (WEEKS - 1) * 7);
  let cells = '', months = '', lastM = -1;
  for (let w = 0; w < WEEKS; w++) {
    const ws = new Date(start); ws.setDate(start.getDate() + w * 7);
    months += `<span>${ws.getMonth() !== lastM ? ws.toLocaleDateString(undefined, { month: 'short' }) : ''}</span>`; lastM = ws.getMonth();
    for (let d = 0; d < 7; d++) { const day = new Date(ws); day.setDate(ws.getDate() + d); const n = S.act[dkey(day)] || 0, fut = day > today;
      cells += `<i class="${fut ? 'fut' : 'l' + level(n)}${day.getTime() === today.getTime() ? ' today' : ''}"${fut ? '' : ` title="${day.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })}: ${n ? n + ' action' + (n > 1 ? 's' : '') : 'no study'}${S.time[dkey(day)] ? ', ' + S.time[dkey(day)] + ' min timed' : ''}"`}></i>`; }
  }
  const keys = Object.keys(S.act).filter(k => S.act[k] > 0).sort(), set = new Set(keys);
  let cur = 0; const c = new Date(today); if (!set.has(dkey(c))) c.setDate(c.getDate() - 1); while (set.has(dkey(c))) { cur++; c.setDate(c.getDate() - 1); }
  let best = 0, run = 0, prev = null; keys.forEach(k => { const t = new Date(k + 'T00:00:00').getTime(); run = prev !== null && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; });
  const wk = new Date(today); wk.setDate(wk.getDate() - ((wk.getDay() + 6) % 7)); let thisWeek = 0; for (let d = 0; d < 7; d++) { const x = new Date(wk); x.setDate(wk.getDate() + d); if (set.has(dkey(x))) thisWeek++; }
  return `<div class="card"><div class="row between"><h2>Study calendar</h2><div class="legend">Less <i style="background:var(--g0)"></i><i style="background:var(--g1)"></i><i style="background:var(--g2)"></i><i style="background:var(--g3)"></i><i style="background:var(--g4)"></i> More</div></div>
    <div class="cal"><div class="calgrid"><span></span><div class="months">${months}</div><div class="days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="cells" role="img" aria-label="Study activity for the last ${WEEKS} weeks">${cells}</div></div></div>
    <div class="row" style="margin-top:12px"><span class="chip fill">${keys.length} study day${keys.length === 1 ? '' : 's'}</span><span class="chip fill">Current streak ${cur} day${cur === 1 ? '' : 's'}</span><span class="chip fill">Longest streak ${best}</span><span class="chip fill">${thisWeek}/7 days this week</span><span class="hint">A day turns gold when you tick a resource or lab, answer a quiz or review question, solve a challenge or sit an exam. Stronger gold means more done.</span></div></div>`;
}

/* skills: what you can do, measured from quizzes, labs and challenges */
const AREAS = [
  { n: 'SOC process', w: [1, 10] }, { n: 'Networking', w: [2, 3] }, { n: 'Email and web', w: [4, 5] }, { n: 'Windows', w: [6] }, { n: 'Linux', w: [7] },
  { n: 'Malware and intel', w: [8] }, { n: 'SIEM', w: [9] }, { n: 'Cloud and identity', w: [11] }, { n: 'Incident response', w: [12] },
];
const areaOf = w => AREAS.findIndex(a => a.w.includes(w));
const LEVELS = [[80, 'Strong'], [60, 'Competent'], [40, 'Developing'], [15, 'Novice'], [0, 'Untested']];
const levelOf = s => LEVELS.find(l => s >= l[0])[1];
function skillScores() {
  return AREAS.map(a => {
    const qs = a.w.flatMap(weekQids), know = qs.reduce((x, id) => x + (S.q[id] ? Math.min(1, S.q[id].b / 4) : 0), 0) / qs.length;
    const seen = qs.filter(id => S.q[id]), acc = seen.length ? seen.reduce((x, id) => x + S.q[id].c, 0) / seen.reduce((x, id) => x + S.q[id].n, 0) : null;
    const tt = a.w.reduce((x, w) => x + D.weeks[w - 1].tasks.length, 0), labs = a.w.reduce((x, w) => x + tasksDone(w), 0) / tt;
    const cq = a.w.reduce((x, w) => x + D.weeks[w - 1].chal.qs.length, 0), solved = a.w.reduce((x, w) => x + chalSolved(w), 0), tries = a.w.reduce((x, w) => x + ((S.ch[w] && S.ch[w].tries) || 0), 0);
    const proof = cq ? solved / cq * (solved ? 0.6 + 0.4 * Math.min(1, solved / Math.max(tries, solved)) : 0) : 0;
    return { n: a.n, w: a.w, know: Math.round(know * 100), labs: Math.round(labs * 100), proof: Math.round(proof * 100), acc: acc === null ? null : Math.round(acc * 100), seen: seen.length, total: qs.length, score: Math.round(100 * (0.5 * know + 0.3 * labs + 0.2 * proof)) };
  });

function viewWeek(w) {

  if (!unlocked(st)) return head + `<div class="card"><h2>Locked</h2><p>Pass the stage ${st - 1} exam to open this week.</p><a class="btn" href="#exam-${st - 1}">Go to the stage ${st - 1} exam</a></div>`;

  const core = coreIdx(w), opt = W.res.map((_, i) => i).filter(i => !W.res[i][5]);

    [`Hands-on labs`, `${tasksDone(w)}/${W.tasks.length} done &middot; ${hours(w)} h`,
      `${W.note ? `<p class="note">${esc(W.note)}</p>` : ''}<p class="lead">Work top to bottom.</p><ul class="tasks">${tasks}</ul>
      <p class="hint">These are the real rooms of the SOC Level 1 path; each name opens the room. Rooms finished on TryHackMe are ticked from your profile at the next sync. You can also tick a room by hand.</p>`],
    [`Coach notes and self-check`, S.rec[w] ? 'Self-check ticked' : 'Read, then tick the self-check',
      `<div class="lesson">${W.lesson}</div><h4>Interview questions</h4><p class="hint">${AI ? 'Type your answer and have it graded like a real interview, then compare with the model answer.' : 'Answer aloud first, then open the model answer and compare.'}</p><div class="ivq">${interviewHtml(w)}</div><label class="selfc"><input type="checkbox" id="rec-${w}" data-act="rec" data-w="${w}"${S.rec[w] ? ' checked' : ''}><span><b>Self-check, without looking at the notes:</b> ${esc(W.check)}</span></label>`],
    [`Quiz`, wq ? `Best ${Math.round(wq.best * 100)}% &middot; pass at ${Math.round(QPASS * 100)}%` : `${W.quiz.length} questions &middot; pass at ${Math.round(QPASS * 100)}%`, `<div id="quiz">${quizIntro(w, wq)}</div>`],

    <div class="card"><div class="eyebrow">Time this week</div><div class="kv"><span>Core watching and reading</span><b>${mins(coreMins(w))}</b><span>Labs</span><b>${hours(w)} h</b><span>Recap, quiz, challenge</span><b>1 h</b></div></div></aside>`;
  return head + `<div class="wkgrid"><ol class="steps">${bodies.map((b, i) => `<li class="step ${ss[i] ? 'done' : i === cs ? 'cur' : 'todo'}"><span class="dot" aria-hidden="true">${ss[i] ? '&#10003;' : i + 1}</span>
    <details id="step-${w}-${i}" data-w="${w}" data-i="${i}"${(o[i] !== undefined ? o[i] : i === cs) ? ' open' : ''}><summary><span><span class="eyebrow">Step ${i + 1} &middot; ${STEPS[i]}</span><h2>${b[0]}</h2><small>${b[1]}</small></span><span class="row">${ss[i] ? '<span class="chip good">Done</span>' : i === cs ? '<span class="chip acc">Now</span>' : ''}<span class="caret"></span></span></summary><div class="body">${b[2]}</div></details></li>`).join('')}</ol>${aside}</div>
  <div class="row between">${w > 1 ? `<a class="btn ghost" href="#week-${w - 1}">Week ${w - 1}</a>` : '<span></span>'}${w % 3 === 0 ? `<a class="btn" href="#exam-${st}">${st === 4 ? 'Final exam' : 'Stage ' + st + ' exam'}</a>` : `<a class="btn ghost" href="#week-${w + 1}">Week ${w + 1}</a>`}</div>`;
}

      d.querySelectorAll('h4').forEach(h => { if (skip.test(h.textContent)) return; let html = '', n = h.nextElementSibling; while (n && n.tagName !== 'H4') { html += n.outerHTML; n = n.nextElementSibling; } out.push(`<div><h4>${esc(h.textContent)}</h4>${html}</div>`); });

/* quiz and review share one runner */
function startRun(ids, mode, w) {
  QS = { ids, mode, w, i: 0, right: 0, picked: null, order: {} };
  ids.forEach(id => QS.order[id] = shuffle(Q[id].o.map((_, i) => i)));
  drawRun();
}
function drawRun() {
  const box = $('#quiz'); if (!box || !QS) return;
  if (QS.i >= QS.ids.length) {
    const score = QS.right / QS.ids.length;
    let msg;
    if (QS.mode === 'week') {
      const p = S.wq[QS.w] || { best: 0, n: 0 }; p.best = Math.max(p.best, score); p.last = score; p.n++; S.wq[QS.w] = p; save();
      msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>${score >= QPASS ? 'Passed.' : 'Not passed yet. Re-read the coach notes and try again.'} These questions return in the Review tab on a 1, 3, 7, 14, 30 day schedule.</p><button class="btn" data-act="startQuiz" data-w="${QS.w}">Retake quiz</button>`;
    } else if (QS.mode === 'ai') { save(); msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>These five questions are now in your question bank and will come back in reviews and drills.</p><button class="btn ghost" data-act="reload">Back to skills</button>`;
    } else if (QS.mode === 'drill') { S.drill[dkey(new Date())] = 1; save(); msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>Drill done for today. Your skill scores below are updated.</p><button class="btn ghost" data-act="reload">Show updated skills</button>`;
    } else { save(); const left = dueIds().length; msg = `<p class="big">${QS.right}/${QS.ids.length}</p><p>${left ? left + ' more due.' : 'All caught up.'}</p>${left ? '<button class="btn" data-act="startReview">Continue</button>' : '<a class="btn" href="#today">Back to today</a>'}`; }
    QS = null; box.innerHTML = msg; nav(route().name); return;
  }
  const id = QS.ids[QS.i], q = Q[id], done = QS.picked !== null;
  box.innerHTML = `<div class="eyebrow">Question ${QS.i + 1} of ${QS.ids.length}${QS.mode !== 'week' ? ' &middot; ' + esc(AREAS[areaOf(q.week)].n) + ' &middot; week ' + q.week : ''}</div>
  <p class="qtext">${esc(q.q)}</p>
  <div class="opts">${QS.order[id].map(oi => `<button class="opt${done ? (oi === q.a ? ' right' : oi === QS.picked ? ' wrong' : '') : ''}" data-act="pick" data-o="${oi}"${done ? ' disabled' : ''}>${esc(q.o[oi])}</button>`).join('')}</div>
  ${done ? `<p class="why"><b>${QS.picked === q.a ? 'Correct.' : 'Not this time.'}</b> ${esc(q.why)}</p>${AI && QS.picked !== q.a ? `<p class="note" id="explain" style="white-space:pre-wrap"><button class="btn ghost small" data-act="explain">Explain my mistake</button></p>` : ''}<button class="btn" data-act="nextQ">${QS.i + 1 < QS.ids.length ? 'Next question' : 'See result'}</button>` : ''}`;
}

function viewReview() {
  const due = dueIds(), all = Object.keys(S.q).filter(id => Q[id]);
  const boxes = [1, 2, 3, 4, 5].map(b => all.filter(id => S.q[id].b === b).length), mx = Math.max(1, ...boxes);
  const nextDue = all.length ? Math.min(...all.map(id => S.q[id].d)) : null;
  return `<div><h1>Review</h1><p class="lead">Questions you have answered come back just before you would forget them. A correct answer moves a question up one box and doubles the wait. A wrong one sends it back to box 1.</p></div>
  <div class="card"><h2>${due.length} due now</h2><div id="quiz">${due.length ? `<button class="btn" data-act="startReview">Start review (${Math.min(20, due.length)} questions)</button>` : all.length ? `<p>Nothing due. Next review on ${fmtDate(nextDue)}.</p>` : '<p>Take a week quiz first. Its questions will appear here on schedule.</p>'}</div></div>
  ${mistakesHtml()}
  <div class="card"><h2>Memory boxes</h2><p class="lead">${all.length} questions in rotation. Box 5 means you answered correctly five times in a row over about two months.</p>
  <div class="boxes">${boxes.map((n, i) => `<div><span>${n}</span><i style="height:${Math.round(n / mx * 60)}px"></i><span>Box ${i + 1}<br>${IV[i + 1]} d</span></div>`).join('')}</div></div>`;
}

/* exams */
function examSpec(st) { const fin = !!D.stages[st - 1].final; return { fin, mins: fin ? 40 : 25, n: fin ? 30 : 20 }; }
function buildExam(st) {
  const sp = examSpec(st), extra = D.stages[st - 1].extra.map((_, i) => 's' + st + 'x' + (i + 1));
  let pool = [];
  if (sp.fin) for (let w = 1; w <= 12; w++) pool = pool.concat(shuffle(weekQids(w)).slice(0, 2));
  else pool = shuffle(D.stages[st - 1].weeks.flatMap(weekQids)).slice(0, sp.n - extra.length);
  return shuffle(extra.concat(pool));
}
function viewExam(st) {
  const s = D.stages[st - 1], sp = examSpec(st), e = S.ex[st], name = sp.fin ? 'Final exam' : 'Stage ' + st + ' exam';
  const head = `<div><div class="eyebrow"><a href="#roadmap">Roadmap</a> &middot; Stage ${st}</div><h1>${name}</h1><p class="lead">${esc(s.name)}${sp.fin ? '. Covers all 12 weeks.' : ''}</p></div>`;
  if (!unlocked(st)) return head + `<div class="card"><h2>Locked</h2><p>Pass the stage ${st - 1} exam first.</p><a class="btn" href="#exam-${st - 1}">Go to the stage ${st - 1} exam</a></div>`;
  if (ES && ES.stage === st && !ES.result) return head + examRunHtml();
  if (ES && ES.stage === st && ES.result) return head + examResultHtml();
  const wait = e && !e.passed && e.at ? e.at + COOLDOWN - Date.now() : 0;
  const ready = s.weeks.every(weekDone);
  return head + `<div class="card"><h2>Rules</h2>
  <ul><li>${sp.n} questions in ${sp.mins} minutes. It submits itself when time runs out.</li>
  <li>Pass mark ${Math.round(PASS * 100)}%. No feedback until you submit.</li>
  <li>${extraCount(st)} scenario questions appear only in this exam. The rest are drawn at random from ${sp.fin ? 'every week' : 'this stage'}.</li>
  <li>After a failed attempt you wait 12 hours. Use them to review what you missed.</li>
  <li>Closed book: no notes, no search, no AI. Leaving this page cancels the attempt.</li></ul>
  ${ready ? '' : `<p class="note">You have not finished every week in this stage. You may still sit the exam. If you already know the material, passing is the proof.</p>`}
  <div class="row"><button class="btn" data-act="startExam" data-s="${st}"${wait > 0 ? ' disabled' : ''}>${e ? 'Start new attempt' : 'Start exam'}</button>
  ${e ? examChip(st) + `<span class="hint">${e.n} attempt${e.n > 1 ? 's' : ''}</span>` : ''}${wait > 0 ? `<span class="hint">Next attempt possible in ${Math.ceil(wait / 36e5)} h</span>` : ''}</div></div>
  ${sp.fin ? `<div class="card"><h2>Practical half</h2><p>The final test has two halves. This exam checks knowledge. The week 12 capstone challenge checks that you can investigate. ${chalDone(12) ? '<span class="chip good">Capstone solved</span>' : '<a href="#week-12">Open the capstone</a>'}</p></div>` : ''}`;
}
const extraCount = st => D.stages[st - 1].extra.length;
function examRunHtml() {
  return `<div class="timer"><span>${Object.keys(ES.ans).length}/${ES.ids.length} answered</span><b id="clock">${clock()}</b></div>
  <div class="card">${ES.ids.map((id, n) => { const q = Q[id]; return `<div class="eq"><p class="qtext">${n + 1}. ${esc(q.q)}</p>${ES.order[id].map(oi => `<label><input type="radio" name="e-${id}" id="e-${id}-${oi}" data-act="ans" data-id="${id}" value="${oi}"${ES.ans[id] === oi ? ' checked' : ''}><span>${esc(q.o[oi])}</span></label>`).join('')}</div>`; }).join('')}

/* ---------- router and events ---------- */
function route() {
  const h = (location.hash || '#today').slice(1); let m;
  if ((m = /^week-(\d+)$/.exec(h)) && +m[1] >= 1 && +m[1] <= 12) return { name: 'week', n: +m[1] };
  if ((m = /^exam-(\d)$/.exec(h)) && +m[1] >= 1 && +m[1] <= 4) return { name: 'exam', n: +m[1] };
  if (h === 'roadmap' || h === 'review' || h === 'library' || h === 'cheatsheets' || h === 'skills' || h === 'weekly' || h === 'sim') return { name: h };
  return { name: 'today' };
}
function render() {
  const r = route();
  if (ES && !(r.name === 'exam' && r.n === ES.stage)) { clearInterval(esTimer); ES = null; }
  if (SIM && r.name !== 'sim') { clearInterval(simTimer); SIM = null; }
  QS = null; nav(r.name);
  $('#view').className = r.name === 'week' || (r.name === 'sim' && SIM && !SIM.result) ? 'wide' : '';
  $('#view').innerHTML = r.name === 'week' ? viewWeek(r.n) : r.name === 'exam' ? viewExam(r.n) : r.name === 'roadmap' ? viewRoadmap() : r.name === 'library' ? viewLibrary() : r.name === 'cheatsheets' ? viewSheets() : r.name === 'skills' ? viewSkills() : r.name === 'weekly' ? viewWeekly() : r.name === 'sim' ? viewSim() : r.name === 'review' ? viewReview() : viewToday();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

function checkAnswer(w, i) {
  const inp = $('#ci-' + w + '-' + i), val = inp.value; if (!norm(val)) return;
  const q = D.weeks[w - 1].chal.qs[i], c = S.ch[w] || { ok: [], tries: 0 };
  c.tries++; const ok = q.h.includes(hash(norm(val)));
  if (ok) { c.ok[i] = true; bump(2); logDay('c'); }
  S.ch[w] = c; save();
  if (ok) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  else { $('#cq-' + w + '-' + i).classList.add('no'); $('#cm-' + w + '-' + i).textContent = 'Not correct. Go back to the evidence.' + (q.hint ? ' Hint: ' + q.hint : ''); }
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'task' || a === 'ans' || a === 'res' || a === 'rec' || a === 'impFile') return;
  if (a === 'jump') { ev.preventDefault(); const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'simStart') return simStart(D.sims[+el.dataset.i]);
  if (a === 'simGen') return simGenerate(el);
  if (a === 'simSel' && SIM) { SIM.sel = +el.dataset.id; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (a === 'simV' && SIM && SIM.sel !== null) { if (!SIM.ans[SIM.sel]) SIM.order.push(SIM.sel); SIM.ans[SIM.sel] = el.dataset.v; const nx = SIM.alerts.find(x => !SIM.ans[x.id]); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (a === 'simFinish') return simFinish();
  if (a === 'simClose') { SIM = null; return render(); }
  if (a === 'simGrade') return simGrade(el);
  if (a === 'timer') return timerToggle();
  if (a === 'aiQ') return aiNewQuestions(+el.dataset.a, el);
  if (a === 'explain') return aiExplain(el);
  if (a === 'gradeRep') return aiGradeReport(+el.dataset.w, el);
  if (a === 'gradeIv') return aiGradeAnswer(+el.dataset.w, +el.dataset.i, el);
  if (a === 'calAdd') return calAdd(+el.dataset.w, el);
  if (a === 'todoAdd') return todoAdd(+el.dataset.w, el);
  if (a === 'coach') return aiCoach(el);
  if (a === 'wkPrev') { WKOFF--; return render(); }
  if (a === 'wkNext') { WKOFF = Math.min(0, WKOFF + 1); return render(); }
  if (a === 'repText') return;
  if (a === 'startDrill') { const ids = drillIds(8); if (ids.length) startRun(ids, 'drill'); return; }
  if (a === 'reload') { render(); return; }
  if (a === 'thmCheck') { el.textContent = 'Checking...'; pollThm(); setTimeout(() => { if (el.isConnected) el.textContent = 'Check now'; }, 1500); return; }
  if (a === 'newsOk') { LIVE.news = []; render(); return; }
  if (a === 'thmPaste') { const msg = $('#thmMsg'); let codes = null;
    try { const j = JSON.parse($('#thmPaste').value.trim()); codes = j.data.docs.map(d => String(d.code)); } catch (e) {}
    if (!codes || !codes.length) { msg.textContent = 'That does not look like the TryHackMe page text. Copy the whole page (Ctrl+A, Ctrl+C) and paste again.'; msg.style.color = 'var(--bad)'; return; }
    const before = THMSET.size; S.thm = { user: (S.thm && S.thm.user) || 'vicuvi1', at: Date.now(), codes: [...new Set([...(S.thm ? S.thm.codes : []), ...codes])] }; refreshThm(); save(); render();
    const m2 = $('#thmMsg'); if (m2) { m2.closest('details').open = true; m2.textContent = 'Synced. ' + (THMSET.size - before) + ' new completed room' + (THMSET.size - before === 1 ? '' : 's') + ' found.'; m2.style.color = 'var(--good)'; } return; }
  if (a === 'exportHtml') return exportHtml();
  if (a === 'exportJson') return download('soc-progress-' + stamp() + '.json', JSON.stringify(S), 'application/json');
  if (a === 'copyCode') { const c = toCode(); try { navigator.clipboard.writeText(c).then(() => moveMsg('Progress code copied. Paste it into "Bring progress in" on the other PC.'), () => { $('#impCode').value = c; $('#impCode').select(); moveMsg('Copy the selected code with Ctrl+C.'); }); } catch (e) { $('#impCode').value = c; $('#impCode').select(); moveMsg('Copy the selected code with Ctrl+C.'); } return; }
  if (a === 'impCode') return offerImport($('#impCode').value);
  if (a === 'impNo') { PENDING = null; return render(); }
  if (a === 'impYes' && PENDING) { S = Object.assign(fresh(), PENDING); afterStateSwap(); PENDING = null; save(); render(); moveMsg('Progress loaded.'); return; }
  if (a === 'libf') { LIBF = el.dataset.f; render(); return; }
  if (a === 'theme') { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), nx = cur === 'dark' ? 'light' : 'dark'; r.dataset.theme = nx; try { localStorage.setItem('soc12-theme', nx); } catch (e) {} return; }
  if (a === 'goStep') { const d = document.getElementById('step-' + el.dataset.w + '-' + el.dataset.i); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }
  if (a === 'setStart') { const v = $('#startDate').value; S.start = v ? new Date(v + 'T00:00:00').getTime() : Date.now(); save(); render(); }
  else if (a === 'clearStart') { S.start = null; save(); render(); }
  else if (a === 'reset1') { $('#resetBox').innerHTML = 'Delete all progress? <button class="btn small" data-act="reset2">Yes, delete</button> <button class="btn ghost small" data-act="reset0">Cancel</button>'; }
  else if (a === 'reset0') render();
  else if (a === 'reset2') { S = fresh(); afterStateSwap(); save(); render(); }
  else if (a === 'startQuiz') startRun(shuffle(weekQids(+el.dataset.w)), 'week', +el.dataset.w);
  else if (a === 'startReview') startRun(dueIds().slice(0, 20), 'review');
  else if (a === 'pick' && QS && QS.picked === null) { const id = QS.ids[QS.i]; QS.picked = +el.dataset.o; const ok = QS.picked === Q[id].a; if (ok) QS.right++; grade(id, ok, QS.mode); bump(1); logDay('q'); if (ok) logDay('ok'); save(); drawRun(); }
  else if (a === 'nextQ' && QS) { QS.i++; QS.picked = null; drawRun(); }
  else if (a === 'check') checkAnswer(+el.dataset.w, +el.dataset.i);
  else if (a === 'copy') { const t = D.weeks[+el.dataset.w - 1].chal.evidence; const done = () => { el.textContent = 'Copied'; setTimeout(() => el.textContent = 'Copy evidence', 1500); }; const fail = () => { const r = document.createRange(); r.selectNodeContents($('#ev-' + el.dataset.w)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = 'Selected: press Ctrl+C'; }; try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); } }
  else if (a === 'startExam') startExam(+el.dataset.s);
  else if (a === 'submitExam') submitExam();
  else if (a === 'closeExam') { ES = null; render(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, a = el.dataset && el.dataset.act;
  if (a === 'task' || a === 'res') { const code = el.dataset.code, m = code ? S.rooms : a === 'task' ? S.tasks : S.res, k = code || el.dataset.k; if (el.checked) { m[k] = 1; bump(a === 'task' ? 3 : 1); if (code) logDay('r'); } else delete m[k]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'rec') { if (el.checked) { S.rec[el.dataset.w] = 1; bump(1); } else delete S.rec[el.dataset.w]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (a === 'repText') { const w = el.dataset.w; S.rep[w] = Object.assign({}, S.rep[w], { text: el.value.slice(0, 6000) }); save(); }
  else if (a === 'impFile' && el.files && el.files[0]) { const f = new FileReader(); f.onload = () => offerImport(f.result); f.readAsText(el.files[0]); }
  else if (a === 'ans' && ES && !ES.result) { ES.ans[el.dataset.id] = +el.value; const t = document.querySelector('.timer span'); if (t) t.textContent = Object.keys(ES.ans).length + '/' + ES.ids.length + ' answered'; }
});
document.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.i !== undefined && d.dataset.w) { (OPEN[d.dataset.w] = OPEN[d.dataset.w] || {})[d.dataset.i] = d.open; } }, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.cq input')) checkAnswer(+ev.target.dataset.w, +ev.target.dataset.i); });

loadBank();
render();
timerPaint();
initCaps();
initRemote();
if (window.THM_SYNC) { LIVE.at = window.THM_SYNC.at || 0; LIVE.ok = Date.now() - LIVE.at < 6 * 6e4; LIVE.checked = Date.now(); if (LIVE.ok) render(); }
setInterval(pollThm, 60000);
window.addEventListener('focus', pollThm);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollThm(); });
</script>
</body>
</html>
